name: Reverse NBA replay helper modules
on:
  push:
    branches: ['codex/adams-westbrook-hls-final']
    paths:
      - 'analysis/reverse_nba_replay_modules.py'
      - '.github/workflows/reverse-nba-replay-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u analysis/reverse_nba_replay_modules.py

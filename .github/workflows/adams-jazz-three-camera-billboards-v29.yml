name: Adams Jazz three-camera secondary-player billboards v29

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v28.py'
      - 'freeze_spin/build_three_camera_mesh_v29.py'
      - '.github/workflows/adams-jazz-three-camera-billboards-v29.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-billboards-v29:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision; print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
      - name: Retrieve native event source clips
        run: |
          set -euxo pipefail
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py --request freeze_spin/adams_jazz_dunk_request.json --out target_source --workers 8
          test -n "$(find target_source/clips -type f -name '*_489_*_SOURCE.mp4' -print -quit)"
      - name: Retrieve v11 exact-state evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11 three_camera_v29
          gh run download 34535691949 --repo timeedmonds-maker/44 --name adams-jazz-three-camera-exact-sync-v11-34535691949 --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json
      - name: Retrieve accepted Right Above Rim v73 metric report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 --repo timeedmonds-maker/44 --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json
      - name: Render native v29 billboard proof
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          test -n "$BCAST"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v29 \
            --clips-dir target_source/clips \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v29 --tokens 900 --voxel-cm 2.5 2>&1 | tee three_camera_v29/render.log
      - name: Assert v29 native invariants
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,cv2,numpy as np
          from pathlib import Path
          r=Path('three_camera_v29'); q=json.load(open(r/'three_camera_mesh_v12_qa.json'))
          d=q['v29_secondary_people_billboards']; h=q['v28_clean_floor_temporal_background']; f=q['v23_focal_subject']
          assert d['resolution']==[960,540] and h['resolution']==[960,540]
          assert d['generated_texture'] is False and d['inpainting'] is False and d['crossfade'] is False
          assert d['upscale'] is False and d['uhd'] is False
          assert f['accepted_focal_mesh_count']==1
          assert set(f['accepted_focal_mesh_views'])=={'Left Above Rim','Broadcast','Right Above Rim'}
          assert q['ball']['status']=='BALL_TRIANGULATED_THREE_VIEW_ENHANCED'
          assert d['total_billboard_pixels'] > 0, d
          out=cv2.imread(str(r/'v12_00deg.png')); ref=cv2.imread(str(next(Path('inputs_v11').glob('K_Left_Above_Rim_v11_*.png'))))
          assert out is not None and ref is not None and np.array_equal(out,ref)
          print('V29_SECONDARY_BILLBOARDS_NATIVE_OK')
          print(json.dumps({'billboard_pixels':d['total_billboard_pixels'],'black_metrics':h['black_metrics']},indent=2))
          PY
      - name: Package v29 evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v29/render.log delivery/ 2>/dev/null || true
          cp three_camera_v29/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v29/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v29/v12_*deg.png delivery/ 2>/dev/null || true
          cp three_camera_v29/v22_focal_*.png delivery/ 2>/dev/null || true
          cp three_camera_v29/v23_focal_*.png delivery/ 2>/dev/null || true
          cp three_camera_v29/v21_*.png delivery/ 2>/dev/null || true
          find inputs_v11 -maxdepth 1 -type f \( -name 'K_Left_Above_Rim_v11_*.png' -o -name 'A_Broadcast_v11_*.png' -o -name 'L_Right_Above_Rim_v11_*.png' \) -exec cp {} delivery/ \; 2>/dev/null || true
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_three_camera_billboards_v29_package.zip ./*)
      - name: Upload v29 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-billboards-v29-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

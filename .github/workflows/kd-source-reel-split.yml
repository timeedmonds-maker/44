name: KD Source Reel Split

on:
  push:
    paths:
      - '.github/workflows/kd-source-reel-split.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split-source-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download original source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9731182962/zip" \
            -o original.zip
          mkdir -p original
          unzip -q original.zip -d original
          find original -maxdepth 3 -type f -printf '%s %p\n' | sort -nr | head -30

      - name: Split original combined reel with stream copy only
        shell: bash
        run: |
          set -euo pipefail
          REEL="$(find original -type f \( -iname 'reel_SOURCE.mp4' -o -iname '*reel*SOURCE*.mp4' -o -iname '*combined*.mp4' \) -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "${REEL:-}" ]; then
            REEL="$(find original -type f -name '*.mp4' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -n "$REEL"
          echo "SOURCE_REEL=$REEL"

          mkdir -p split
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,bit_rate -of json "$REEL" | tee split/source_ffprobe.json
          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$REEL")"
          MID="$(awk -v d="$DUR" 'BEGIN { printf "%.6f", d/2 }')"
          echo "duration=$DUR midpoint=$MID"

          ffmpeg -hide_banner -loglevel warning -y -i "$REEL" -t "$MID" -map 0 -c copy split/KD_Top10_All_Angles_SOURCE_Part_1.mp4
          ffmpeg -hide_banner -loglevel warning -y -ss "$MID" -i "$REEL" -map 0 -c copy split/KD_Top10_All_Angles_SOURCE_Part_2.mp4

          for f in split/KD_Top10_All_Angles_SOURCE_Part_1.mp4 split/KD_Top10_All_Angles_SOURCE_Part_2.mp4; do
            echo "=== $f ==="
            ls -lh "$f"
            ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,bit_rate -of json "$f"
            sha256sum "$f"
          done | tee split/parts_qa.txt

      - name: Upload source-quality part 1
        uses: actions/upload-artifact@v4
        with:
          name: KD-Top10-All-Angles-SOURCE-Part-1
          path: |
            split/KD_Top10_All_Angles_SOURCE_Part_1.mp4
            split/source_ffprobe.json
            split/parts_qa.txt
          compression-level: 0
          retention-days: 1

      - name: Upload source-quality part 2
        uses: actions/upload-artifact@v4
        with:
          name: KD-Top10-All-Angles-SOURCE-Part-2
          path: |
            split/KD_Top10_All_Angles_SOURCE_Part_2.mp4
            split/source_ffprobe.json
            split/parts_qa.txt
          compression-level: 0
          retention-days: 1

name: Westbrook dunk assist leaders

on:
  push:
    branches:
      - agent/westbrook-dunk-assist-leaders
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyreadr requests
      - run: python westbrook_dunk_assist_leaders.py
      - uses: actions/upload-artifact@v4
        with:
          name: westbrook-dunk-assist-leaders
          path: |
            westbrook_dunk_assist_leaders.csv
            westbrook_dunk_assist_events.csv

name: Adams Jazz fourth-camera candidate audit v113

on:
  push:
    branches: [right-slash-v100b-run]
    paths:
      - 'freeze_spin/audit_event489_fourth_camera_candidates_v113.py'
      - '.github/workflows/adams-jazz-fourth-camera-candidate-audit-v113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-fourth-camera-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
          ffmpeg -version | head -1
      - name: Audit exact event-489 native candidate feeds
        run: python -m freeze_spin.audit_event489_fourth_camera_candidates_v113 --game-id 0022500301 --event-id 489 --out v113
      - name: Report discovery-only result
        run: |
          python - <<'PY'
          import json
          q=json.load(open('v113/event489_fourth_camera_candidates_v113.json'))
          print('STATUS',q['status'])
          for r in q['diagnostic_ranking']:
            print('CANDIDATE',r['label'],r['selected_frame'],r['metrics'])
          assert all(v is False for v in q['permissions'].values())
          PY
      - name: Package evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v113/event489_fourth_camera_candidates_v113.json delivery/ 2>/dev/null || true
          cp v113/event489_fourth_camera_candidates_montage.png delivery/ 2>/dev/null || true
          shopt -s nullglob
          for d in v113/*_frames; do [ -d "$d" ] && cp -a "$d" delivery/; done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adams-jazz-fourth-camera-candidate-audit-v113-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

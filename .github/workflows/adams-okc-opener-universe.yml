name: Adams OKC opener possession universe
on:
  workflow_dispatch:
  push:
    branches: [codex/adams-screen-okc-opener]
    paths:
      - 'tools/build_adams_okc_opener_possessions.py'
      - '.github/workflows/adams-okc-opener-universe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyreadr requests
      - run: python tools/build_adams_okc_opener_possessions.py
      - uses: actions/upload-artifact@v4
        with:
          name: adams-okc-opener-possession-universe
          path: artifacts/adams_okc_opener
          if-no-files-found: error

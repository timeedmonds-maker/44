name: Adams Jazz Right Slash metric v106a

on:
  push:
    branches:
      - codex/right-slash-v101-execution
    paths:
      - 'freeze_spin/audit_right_slash_event416_metric_v106a.py'
      - '.github/workflows/adams-jazz-right-slash-metric-v106a.yml'
  workflow_dispatch:

jobs:
  coarse-root-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install metric runtime
        run: python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 scipy==1.14.1

      - name: Recover immutable v101 geometry bank
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-slash-adaptive-geometry-v101-34009445346
          path: right_slash_v101
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34009445346

      - name: Recover v105 fixed-centre authorization
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-slash-fixed-center-v105-34011286051
          path: right_slash_v105
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34011286051

      - name: Run coarse broad-root metric audit
        run: |
          python -m freeze_spin.audit_right_slash_event416_metric_v106a \
            --frame right_slash_v101/event_416_selected/f06.png \
            --v105 right_slash_v105/right_slash_fixed_center_authorization_v105.json \
            --out right_slash_v106a

      - name: Enforce audit-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('right_slash_v106a/right_slash_event416_metric_v106a.json').read_text())
          assert p['status']=='RIGHT_SLASH_EVENT416_COARSE_ROOT_AUDIT_V106A'
          assert p['permissions']['right_slash_metric_camera_allowed'] is False
          assert p['permissions']['replay_render_allowed'] is False
          print('V106A complete; audit only, no promotion.')
          PY

      - name: Upload v106a audit
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-metric-v106a-${{ github.run_id }}
          path: right_slash_v106a/
          retention-days: 14
          if-no-files-found: error

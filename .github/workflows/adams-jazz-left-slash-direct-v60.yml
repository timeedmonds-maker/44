# trigger existing v60 workflow; proof semantics unchanged
name: Adams Jazz Left Slash direct physical camera v60

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json'
      - 'freeze_spin/prove_left_slash_frame_c_direct_v60.py'
      - '.github/workflows/adams-jazz-left-slash-direct-v60.yml'
  pull_request:
    branches: [main]
    paths:
      - 'freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json'
      - 'freeze_spin/prove_left_slash_frame_c_direct_v60.py'
      - '.github/workflows/adams-jazz-left-slash-direct-v60.yml'

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic metric runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable Frame C chooser artifact
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692
      - name: Verify immutable Left Slash source
        run: |
          test -f frame_c/G_Left_Slash_8.868843s_frame0266.png
          echo '2ced6fbf7108459e4c8acda1d62ab8a4a77a455971287c1fcfcdc6ea7b6a272f  frame_c/G_Left_Slash_8.868843s_frame0266.png' | sha256sum -c -
      - name: Run direct noncoplanar functional proof
        id: proof
        continue-on-error: true
        run: |
          python -m freeze_spin.prove_left_slash_frame_c_direct_v60 \
            --frame frame_c/G_Left_Slash_8.868843s_frame0266.png \
            --observations freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json \
            --out v60
      - name: Package v60 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v60/*.json delivery/ 2>/dev/null || true
          cp v60/*.png delivery/ 2>/dev/null || true
          cp frame_c/G_Left_Slash_8.868843s_frame0266.png delivery/
          cp freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json delivery/
      - name: Upload v60 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-left-slash-direct-v60-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce fail-closed v60 verdict
        if: always()
        run: |
          test -f v60/left_slash_frame_c_direct_v60.json
          python - <<'PY'
          import json
          q=json.load(open('v60/left_slash_frame_c_direct_v60.json'))
          assert q['status']=='PASS_LEFT_SLASH_DIRECT_PHYSICAL_CAMERA_V60', q['status']
          assert q['permissions']['left_slash_frame_c_metric_event_camera_allowed'] is True
          assert q['permissions']['left_slash_physical_camera_center_allowed'] is True
          assert q['permissions']['static_two_camera_novel_view_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          assert all(q['gates'].values()), q['gates']
          PY

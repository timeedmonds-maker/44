name: Screen Tracker - Kickout 3 CLE Left Slash tracking

on:
  push:
    branches: [screen-tracker-kickout-3]
    paths:
      - '.github/workflows/kickout3-track-cle-left-slash.yml'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git zip
      - name: Install Screen Tracker CV stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install pyreadr requests ultralytics scipy 'numpy<2' pandas
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download deterministic CV models
        run: |
          mkdir -p artifacts/models
          curl -L --retry 3 -o artifacts/models/rfdetr_m_640.onnx https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --retry 3 -o artifacts/models/court_yolo11m_pose.pt https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Build exact official Left Slash tracks
        run: |
          python screen_tracker_kickout3/run_angle_tracking.py \
            --angle-label 'Left Slash' \
            --game '0022500255' --event '247' \
            --start-s '4.7' --end-s '8.2' \
            --analysis-fps 15 --number-fps 5 --court-fps 4 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --out artifacts/cle_left_slash/tracks
      - name: Emit exact-PBP lineage summary
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          root=pathlib.Path('artifacts/cle_left_slash')
          ctx=json.load(open(root/'tracks/context.json'))
          tracks=pd.read_csv(root/'tracks/tracks.csv')
          out={'key':'cle_left_slash','game_id':'0022500255','event_num':247,'angle':'Left Slash','track_rows':len(tracks),'lineup_home':ctx.get('pbp',{}).get('lineup_home'),'lineup_away':ctx.get('pbp',{}).get('lineup_away'),'identity_contract':'exact PBP lineup gate + validated role/jersey/continuity; no live roster API'}
          (root/'summary.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kickout3-track-cle_left_slash
          path: artifacts/cle_left_slash/
          retention-days: 30

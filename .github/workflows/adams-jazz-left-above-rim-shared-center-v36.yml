name: Adams Jazz Left Above Rim shared centre v36

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/prove_left_above_rim_shared_center_v36.py'
      - 'freeze_spin/adams_jazz_frame_c_floor_homography_v35.json'
      - 'freeze_spin/export_same_camera_transfer_samples_v1.py'
      - '.github/workflows/adams-jazz-left-above-rim-shared-center-v36.yml'

jobs:
  prove-shared-centre:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic native-video and metric runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests

      - name: Retrieve exact target event official angles fresh
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out target_source --workers 8
          test "$(find target_source/clips -name '*_SOURCE.mp4' | wc -l)" -eq 12

      - name: Recreate immutable Frame C target
        run: |
          python freeze_spin/prepare_locked_frame_c_sources.py \
            --clips target_source/clips --out frame_c_target
          python - <<'PY'
          import json
          q=json.load(open('frame_c_target/options.json'))
          lock=q['chosen_timing']
          assert lock['source_camera']=='Right Slash'
          assert lock['option']=='C'
          assert abs(float(lock['right_slash_local_time'])-8.275733)<5e-7
          assert int(lock['decoded_frame_index_from_manual_chooser'])==248
          lar=next(x for x in q['options'] if x['camera']=='Left Above Rim')
          assert abs(float(lar['requested_local_time'])-8.653093)<5e-7
          assert int(lar['decoded_frame_index'])==259
          print('FRAME_C_LOCK',lock)
          print('LEFT_ABOVE_RIM_FRAME',lar)
          PY

      - name: Acquire independent same-game Left Above Rim samples
        run: |
          python freeze_spin/export_same_camera_transfer_samples_v1.py \
            --game-id 0022500301 \
            --events 40,220,440,620 \
            --label 'Left Above Rim' \
            --out left_above_rim_samples
          test "$(find left_above_rim_samples -name 'Left_Above_Rim__event*__s*.png' | wc -l)" -eq 12

      - name: Prove replacement shared physical camera centre v36
        run: |
          python -m freeze_spin.prove_left_above_rim_shared_center_v36 \
            --target-frame frame_c_target/frames/K_Left_Above_Rim_8.653093s_frame0259.png \
            --samples left_above_rim_samples \
            --floor-proof freeze_spin/adams_jazz_frame_c_floor_homography_v35.json \
            --events 40,220,440,620 \
            --out shared_center_v36 \
            --perturbation-trials 24
          python - <<'PY'
          import json
          q=json.load(open('shared_center_v36/left_above_rim_shared_center_v36.json'))
          assert q['status']=='PASS_SHARED_PHYSICAL_CENTER_V36'
          assert q['permissions']['physical_camera_center_allowed'] is True
          assert q['permissions']['metric_event_camera_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          assert all(q['gates'].values())
          print('V36_CENTER_CM',q['camera_center_cm'])
          print('V36_PP_PX',q['principal_point_px'])
          print('V36_GRID_RMS',q['shared_regulation_grid_rms_px'])
          print('V36_HELDOUT_P95',q['max_heldout_static_p95_px'])
          print('V36_LOO_CENTER_SHIFT_CM',q['max_leave_one_event_center_shift_cm'])
          print('V36_UNSEEN_P95',q['max_unseen_event_static_p95_px'])
          print('V36_PERTURB_CENTER_CM',q['half_pixel_perturbation']['max_center_shift_cm'])
          print('V36_ELEVATED_TARGET_P95',q['elevated_target_heldout']['p95_px'])
          PY

      - name: Package v36 proof and source-pixel overlays
        if: always()
        run: |
          mkdir -p delivery
          cp shared_center_v36/left_above_rim_shared_center_v36.json delivery/ 2>/dev/null || true
          cp shared_center_v36/*_overlay_v36.png delivery/ 2>/dev/null || true
          cp frame_c_target/options.json delivery/frame_c_options.json 2>/dev/null || true
          cp frame_c_target/audio_sync_graph.json delivery/ 2>/dev/null || true
          cp frame_c_target/frames/K_Left_Above_Rim_8.653093s_frame0259.png delivery/ 2>/dev/null || true
          cp left_above_rim_samples/sample_manifest.json delivery/ 2>/dev/null || true
          cp freeze_spin/adams_jazz_frame_c_floor_homography_v35.json delivery/ 2>/dev/null || true
          cp left_above_rim_samples/Left_Above_Rim__event*__s*.png delivery/ 2>/dev/null || true

      - name: Upload v36 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-left-above-rim-shared-center-v36-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

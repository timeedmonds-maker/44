name: Adams Jazz three-camera no-Broadcast floor v20

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v20.py'
      - '.github/workflows/adams-jazz-three-camera-no-broadcast-floor-v20.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-no-broadcast-floor-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision; print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
      - name: Retrieve v11 exact-state evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p inputs_v11 three_camera_v20
          gh run download 34535691949 --repo timeedmonds-maker/44 --name adams-jazz-three-camera-exact-sync-v11-34535691949 --dir inputs_v11
      - name: Retrieve accepted Right Above Rim v73 metric report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p inputs_v73
          gh run download 33911842169 --repo timeedmonds-maker/44 --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 --dir inputs_v73
      - name: Render no-Broadcast-floor diagnostic
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v20 \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v20 --tokens 900 --voxel-cm 2.5 \
            2>&1 | tee three_camera_v20/render.log
      - name: Assert native diagnostic
        if: success()
        run: |
          python - <<'PY'
          import json,cv2
          from pathlib import Path
          r=Path('three_camera_v20'); q=json.load(open(r/'three_camera_mesh_v12_qa.json'))
          d=q['v20_diagnostic']
          assert d['resolution']==[960,540]
          assert d['broadcast_floor_appearance_enabled'] is False
          assert d['upscale'] is False and d['uhd'] is False
          assert q['accepted_mesh_count']>=2 and q['tracks_using_right_above_rim']>=1
          for a in (0,5,10,15,20,25):
              im=cv2.imread(str(r/f'v12_{a:02d}deg.png')); assert im is not None and im.shape[:2]==(540,960)
          print('V20_NATIVE_NO_BROADCAST_FLOOR_OK')
          print('OWNERSHIP',d['floor_source_ownership_by_render_call'])
          PY
      - name: Package v20 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp three_camera_v20/render.log delivery/ 2>/dev/null || true
          cp three_camera_v20/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v20/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v20/v12_*deg.png delivery/ 2>/dev/null || true
          (cd delivery && zip -0 adams_jazz_three_camera_no_broadcast_floor_v20_package.zip ./*)
      - name: Upload v20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-no-broadcast-floor-v20-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          compression-level: 0

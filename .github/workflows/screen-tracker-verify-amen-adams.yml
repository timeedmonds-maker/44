name: Screen Tracker - verify Amen scores off Adams screen

on:
  push:
    branches: [screen-tracker]
    paths:
      - '.github/workflows/screen-tracker-verify-amen-adams.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screen-tracker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clip dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install requests
      - name: Fetch official Broadcast clips for top new-game candidates
        run: |
          mkdir -p artifacts/amen_adams_verify
          python tools/fetch_official_nba_event_clip.py --game 0022500054 --event 527 --out artifacts/amen_adams_verify/den_hou_event527.mp4
          python tools/fetch_official_nba_event_clip.py --game 0022500160 --event 324 --out artifacts/amen_adams_verify/dal_hou_event324.mp4
          python tools/fetch_official_nba_event_clip.py --game 0022500191 --event 531 --out artifacts/amen_adams_verify/hou_mil_event531.mp4
      - name: Build dense visual contact sheets
        run: |
          python - <<'PY'
          import cv2, json, math
          from pathlib import Path
          root=Path('artifacts/amen_adams_verify')
          for mp4 in sorted(root.glob('*.mp4')):
              cap=cv2.VideoCapture(str(mp4)); fps=cap.get(cv2.CAP_PROP_FPS) or 30; n=int(cap.get(cv2.CAP_PROP_FRAME_COUNT)); W=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); H=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
              # 24 evenly-spaced frames gives ~0.3-0.5s resolution for typical event clips.
              idxs=[int(round(x)) for x in __import__('numpy').linspace(0,max(n-1,0),24)] if n else []
              panels=[]
              for target in idxs:
                  cap.set(cv2.CAP_PROP_POS_FRAMES,target); ok,fr=cap.read()
                  if not ok: continue
                  scale=480/W; thumb=cv2.resize(fr,(480,int(H*scale)),interpolation=cv2.INTER_AREA)
                  cv2.rectangle(thumb,(0,0),(200,24),(0,0,0),-1)
                  cv2.putText(thumb,f'{target/fps:.2f}s f{target}',(6,17),cv2.FONT_HERSHEY_SIMPLEX,.48,(255,255,255),1,cv2.LINE_AA)
                  panels.append(thumb)
              cap.release()
              if not panels: continue
              ph,pw=panels[0].shape[:2]; cols=4; rows=math.ceil(len(panels)/cols)
              sheet=__import__('numpy').zeros((rows*ph,cols*pw,3),dtype='uint8')
              for i,im in enumerate(panels): sheet[(i//cols)*ph:(i//cols+1)*ph,(i%cols)*pw:(i%cols+1)*pw]=im
              cv2.imwrite(str(root/(mp4.stem+'_contact_sheet.jpg')),sheet,[int(cv2.IMWRITE_JPEG_QUALITY),94])
              print(mp4.name,{'fps':fps,'frames':n,'size':[W,H]})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: screen-tracker-amen-adams-verification-clips
          path: artifacts/amen_adams_verify/
          if-no-files-found: error
          retention-days: 30

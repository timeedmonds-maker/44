name: Probe Adams assist current official playback
on:
  push:
    paths:
      - '.github/workflows/probe-adams-assist-current-official-playback.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe NBA identity STS bootstrap and official playback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, requests, re, uuid
          from urllib.parse import quote

          PAGE='https://www.nba.com/watch/video/assist-of-the-year-steven-adams'
          EXT='fake_202206011217NBA_____VIDEOS__NBAE_2590852_NBA_movie'
          MK='https://ottapp-appgw-client.nba.com'
          ID='https://identity.nba.com/api/v1'
          CLIENT='Ohp2l3Awgo1QfOWqlvxqcW-tw7i4EvdEQatAQTTjMTs'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36'
          DEVICE=str(uuid.uuid4())
          s=requests.Session()
          s.headers.update({'User-Agent':UA,'Accept':'application/json, text/plain, */*','Referer':'https://www.nba.com/','Origin':'https://www.nba.com'})
          r=s.get(PAGE,timeout=30)
          print('PAGE',r.status_code,'cookies',[(c.name,c.domain,len(c.value)) for c in s.cookies])

          ih={'content-type':'application/json','x-client-platform':'web','x-client-id':CLIENT,'User-Agent':UA,'Accept':'application/json, text/plain, */*','Origin':'https://www.nba.com','Referer':PAGE}
          responses=[]
          def call(label,method,path,body=None):
              try:
                  q=s.request(method,ID+path,headers=ih,json=body,timeout=25,allow_redirects=True)
                  txt=q.text
                  print('\nIDENTITY',label,method,path,'STATUS',q.status_code,'CT',q.headers.get('content-type'),'LEN',len(q.content))
                  print('SET_COOKIE_NAMES',re.findall(r'(?:^|,|;)\\s*([^=;,\\s]+)=',q.headers.get('set-cookie','')))
                  print('BODY',txt[:16000])
                  try: data=q.json()
                  except: data=None
                  responses.append((label,data))
                  return data
              except Exception as e:
                  print('IDENTITY_ERR',label,type(e).__name__,str(e)[:500]); return None

          # Current nba.com identity functions, in increasingly stateful order.
          call('cookie-token-initial','GET','/web/cookie/token')
          call('web-token','POST','/web/token')
          call('cookie-package','POST','/web/cookie/package',{})
          call('cookie-token-after-package','GET','/web/cookie/token')
          call('profile','GET','/profile?entitlements=true')
          sts=call('sts','GET','/sts?deviceId='+quote(DEVICE))

          # Collect token-looking strings without assuming response field casing.
          cand=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}' if path else k
                      if isinstance(v,str) and len(v)>20 and any(z in k.lower() for z in ['token','jwt','access','sts']):
                          cand.append((p,v))
                      walk(v,p)
              elif isinstance(x,list):
                  for j,v in enumerate(x): walk(v,f'{path}[{j}]')
          for label,data in responses:
              if data is not None: walk(data,label)
          for c in s.cookies:
              if len(c.value)>20 and any(z in c.name.lower() for z in ['token','jwt','sts','auth']): cand.append(('cookie:'+c.name,c.value))
          # dedupe by token value
          seen=set(); toks=[]
          for label,tok in cand:
              if tok not in seen:
                  seen.add(tok); toks.append((label,tok))
          print('\nTOKEN_CANDIDATES',[(a,len(b),b[:12]+'...') for a,b in toks])

          def enc(x): return base64.b64encode(json.dumps(x,separators=(',',':')).encode()).decode()
          locs=[{'PostalCode':'','CountryCode':''},{'PostalCode':'10001','CountryCode':'US'},{'PostalCode':'1010','CountryCode':'NZ'}]
          variants=[('none',None)]+toks
          for loc in locs:
              url=f"{MK}/S1/subscriber/v3/programs/{quote(EXT,safe='')}/play-options?IsexternalId=true&locationDetail={quote(enc(loc),safe='')}"
              for label,tok in variants:
                  h={'Content-Type':'application/json','Origin':'https://www.nba.com','Referer':PAGE,'User-Agent':UA}
                  if tok: h['Authorization']=f'OAUTH2 access_token="{tok}"'
                  try:
                      q=s.get(url,headers=h,timeout=20,allow_redirects=True)
                      print('\nPLAY_OPTIONS',loc,label,q.status_code,q.headers.get('content-type'),'len',len(q.content))
                      print('BODY',q.text[:20000])
                  except Exception as e:
                      print('PLAY_ERR',loc,label,type(e).__name__,str(e)[:500])
          PY

name: Probe Adams assist current official playback
on:
  push:
    paths:
      - '.github/workflows/probe-adams-assist-current-official-playback.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve original free NBA Adams assist assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,requests,uuid
          from urllib.parse import quote
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36'
          ID='https://identity.nba.com/api/v1'
          MK='https://ottapp-appgw-client.nba.com'
          CLIENT='Ohp2l3Awgo1QfOWqlvxqcW-tw7i4EvdEQatAQTTjMTs'
          programs=[
            ('original_top_play','fake_EAE0A37C0784E086ECADF4DADEBCEB4433D773CA_NBA_movie'),
            ('fan_favorites','fake_202206011217NBA_____VIDEOS__NBAE_2590852_NBA_movie'),
          ]
          H={'User-Agent':UA,'content-type':'application/json','x-client-platform':'web','x-client-id':CLIENT,'Origin':'https://www.nba.com','Referer':'https://www.nba.com/'}
          s=requests.Session()
          r=s.get(ID+'/sts',params={'deviceId':str(uuid.uuid4())},headers=H,timeout=25); r.raise_for_status(); token=r.json()['data']['AccessToken']
          print('::add-mask::'+token); print('STS_OK',len(token))
          loc=base64.b64encode(json.dumps({'PostalCode':'','CountryCode':''},separators=(',',':')).encode()).decode()
          for label,ext in programs:
            url=f'{MK}/S1/subscriber/v3/programs/{quote(ext,safe="")}/play-options?IsexternalId=true&locationDetail={quote(loc,safe="")}'
            h={'Authorization':f'OAUTH2 access_token="{token}"','User-Agent':UA,'Origin':'https://www.nba.com','Referer':'https://www.nba.com/'}
            q=s.get(url,headers=h,timeout=25); print('\nPROGRAM',label,'STATUS',q.status_code,'CT',q.headers.get('content-type'),'LEN',len(q.content)); print(q.text[:12000].replace(token,'<TOKEN>'))
            if q.ok:
              j=q.json()
              for vod in j.get('Vods',[]):
                for a in vod.get('PlayActions',[]):
                  p=a.get('VideoProfile',{})
                  uri=p.get('PlaybackUri')
                  print('PROFILE',p.get('Id'),'QUALITY',p.get('QualityLevel'),'ENCRYPTED',p.get('IsEncrypted'),'URI',uri)
                  if uri:
                    for u in [uri, uri.replace('http://','https://')]:
                      try:
                        z=requests.get(u,headers={'User-Agent':UA,'Referer':'https://www.nba.com/'},timeout=12,allow_redirects=True)
                        print('DIRECT',u[:180],'STATUS',z.status_code,'CT',z.headers.get('content-type'),'LEN',len(z.content),'FINAL',z.url[:220],'BODY',z.text[:500] if 'text' in (z.headers.get('content-type') or '') or 'mpegurl' in (z.headers.get('content-type') or '') else '<binary>')
                      except Exception as e: print('DIRECT_ERR',u[:180],type(e).__name__,str(e)[:300])
          PY

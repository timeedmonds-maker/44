name: Drop Coverage universal V2 reference

on:
  workflow_dispatch:
  push:
    branches: [codex/drop-coverage-universal-v2]
    paths:
      - '.github/workflows/drop-coverage-locked-broadcast-v1-reference.yml'
      - 'tools/drop_coverage_locked_broadcast_v1.py'
      - 'tools/drop_coverage_locked_broadcast_v1_fixed_tracking.py'
      - 'configs/drop_coverage_locked_broadcast_v1_toronto_event483.json'
      - 'manifests/drop_coverage/game_0022500131_event_483_roles.json'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core zip
          pip install 'numpy<2' pandas pillow opencv-python-headless
      - name: Download validated Toronto source and tracks
        uses: actions/download-artifact@v4
        with:
          name: sheppard-adams-v2-probe
          path: artifacts/probe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34923420312
      - name: Download validated V3 matched-shot data
        uses: actions/download-artifact@v4
        with:
          name: sheppard-adams-locked-v3-matched-xfg-contact
          path: artifacts/v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34926748500
      - name: Validate exact lineup and universal role identity
        run: |
          python - <<'PY'
          import json
          cfg=json.load(open('configs/drop_coverage_locked_broadcast_v1_toronto_event483.json'))
          m=json.load(open('manifests/drop_coverage/game_0022500131_event_483_roles.json'))
          q=json.load(open('artifacts/probe/toronto_tracking/qa.json'))
          sx=json.load(open('artifacts/v3/sheppard_v3_matched_xfg.json'))
          assert q['game_id']=='0022500131' and q['event_num']==483, q
          assert q['source']['angle']=='Broadcast', q['source']
          assert q['roles']['adams']==10 and q['roles']['ballhandler']==7 and q['roles']['screened_defender']==3 and q['roles']['adams_defender']==4, q['roles']
          assert m['game_id']=='0022500131' and m['event_num']==483
          ids={p['player_id'] for p in m['defensive_lineup']}
          assert 1630572 in ids, m['defensive_lineup']
          assert all(p['name']!='Jakob Poeltl' for p in m['defensive_lineup'])
          drop=m['screen_roles']['screener_defender']
          assert drop['player_id']==1630572 and drop['name']=='Sandro Mamukelashvili' and drop['jersey']==54
          assert drop['source_role_track']==4 and drop['virtual_track_id']==104
          seg=[x['raw_track_id'] for x in drop['track_segments']]
          assert seg==[4,26,8], seg
          assert cfg['roles']['drop_coverage_defender_track_id']==104
          assert cfg['drop_big_stitch']['player_id']==1630572 and cfg['drop_big_stitch']['jersey']==54
          assert [x['raw_track_id'] for x in cfg['drop_big_stitch']['segments']]==[4,26,8]
          labels={p['track_id']:p['label'] for p in cfg['players']}
          assert labels=={10:'ADAMS',107:'SHEPPARD',103:'SHEAD',104:'MAMUKELASHVILI'}, labels
          sim=cfg['shot']['similar_xfg']
          assert sim['n']==8 and abs(sim['xfg_pct']-40.9375)<1e-12
          assert sx['matched']['n']==8 and abs(sx['matched']['xfg_pct']-40.9375)<1e-12
          assert abs(sum(e-s for s,e in cfg['timing']['contact_phases'])-1.8018)<0.002
          print('DROP DEFENDER: Sandro Mamukelashvili #54, virtual track 104, raw continuity 4 -> 26 -> 8')
          PY
      - name: Render universal deterministic drop-coverage clip
        run: |
          PYTHONPATH=tools python tools/drop_coverage_locked_broadcast_v1_fixed_tracking.py \
            --source artifacts/probe/toronto_tracking/source_native.mp4 \
            --tracks artifacts/probe/toronto_tracking/tracks.csv \
            --config configs/drop_coverage_locked_broadcast_v1_toronto_event483.json \
            --out artifacts/drop_coverage_universal_v2
      - name: Validate UHD and create streamable 4K
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('artifacts/drop_coverage_universal_v2')
          qa=json.load(open(p/'qa.json'))
          assert qa['tool_id']=='DROP_COVERAGE_LOCKED_BROADCAST_V1'
          assert qa['universal_role_resolution_v2'] is True
          assert qa['identity_stitch_enabled'] is True
          assert qa['name_lock']['drop_coverage_defender']=='MAMUKELASHVILI'
          assert qa['drop_big_stitch']['identity']=='Sandro Mamukelashvili'
          assert qa['drop_big_stitch']['jersey']==54
          assert [x['raw_track_id'] for x in qa['drop_big_stitch']['segments']]==[4,26,8]
          assert all(p['name']!='Jakob Poeltl' for p in qa['exact_defensive_lineup'])
          assert abs(qa['screen_contact_total_s']-1.8018)<0.002
          assert qa['event_xfg_pct']==41.7
          assert qa['similar_xfg']['n']==8 and abs(qa['similar_xfg']['xfg_pct']-40.9375)<1e-12
          uhd=pathlib.Path(qa['uhd']); assert uhd.exists()
          s=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,r_frame_rate','-of','json',str(uhd)],text=True))['streams'][0]
          assert s['codec_name']=='h264' and s['width']==3840 and s['height']==2160 and s['r_frame_rate']=='30/1', s
          print(json.dumps(qa,indent=2))
          PY
          ffmpeg -y -hide_banner -loglevel warning \
            -i artifacts/drop_coverage_universal_v2/sheppard_adams_drop_coverage_universal_v2_event483_UHD.mp4 \
            -c:v libx264 -preset veryfast -crf 20 -maxrate 14M -bufsize 28M -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart \
            artifacts/sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_4k_streamable.mp4
          ffmpeg -v error -i artifacts/sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_4k_streamable.mp4 -f null -
      - name: Build package
        run: |
          cd artifacts
          zip -9 -r sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_package.zip \
            drop_coverage_universal_v2 \
            sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_4k_streamable.mp4 \
            ../configs/drop_coverage_locked_broadcast_v1_toronto_event483.json \
            ../manifests/drop_coverage/game_0022500131_event_483_roles.json \
            v3/sheppard_v3_matched_xfg.json \
            v3/sheppard_v3_matched_shots.csv
      - uses: actions/upload-artifact@v4
        with:
          name: drop-coverage-universal-v2-event483
          path: |
            artifacts/drop_coverage_universal_v2/sheppard_adams_drop_coverage_universal_v2_event483_UHD.mp4
            artifacts/drop_coverage_universal_v2/sheppard_adams_drop_coverage_universal_v2_event483_native.mp4
            artifacts/sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_4k_streamable.mp4
            artifacts/drop_coverage_universal_v2/release_freeze.jpg
            artifacts/drop_coverage_universal_v2/qa.json
            artifacts/drop_coverage_universal_v2/LOCKED_TOOL_ID.txt
            artifacts/drop_coverage_universal_v2/identity_stitched_tracks.csv
            configs/drop_coverage_locked_broadcast_v1_toronto_event483.json
            manifests/drop_coverage/game_0022500131_event_483_roles.json
            artifacts/sheppard_adams_DROP_COVERAGE_UNIVERSAL_V2_package.zip
          if-no-files-found: error
          retention-days: 30

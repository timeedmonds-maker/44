name: Drop Coverage locked broadcast V1 reference

on:
  workflow_dispatch:
  push:
    branches: [codex/drop-coverage-locked-broadcast-v1]
    paths:
      - '.github/workflows/drop-coverage-locked-broadcast-v1-reference.yml'
      - 'tools/drop_coverage_locked_broadcast_v1.py'
      - 'configs/drop_coverage_locked_broadcast_v1_toronto_event483.json'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core zip
          pip install 'numpy<2' pandas pillow opencv-python-headless
      - name: Download validated Toronto source and tracks
        uses: actions/download-artifact@v4
        with:
          name: sheppard-adams-v2-probe
          path: artifacts/probe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34923420312
      - name: Download validated V3 matched-shot data
        uses: actions/download-artifact@v4
        with:
          name: sheppard-adams-locked-v3-matched-xfg-contact
          path: artifacts/v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34926748500
      - name: Validate enduring inputs
        run: |
          python - <<'PY'
          import json
          cfg=json.load(open('configs/drop_coverage_locked_broadcast_v1_toronto_event483.json'))
          q=json.load(open('artifacts/probe/toronto_tracking/qa.json'))
          sx=json.load(open('artifacts/v3/sheppard_v3_matched_xfg.json'))
          assert q['game_id']=='0022500131' and q['event_num']==483, q
          assert q['source']['angle']=='Broadcast', q['source']
          assert q['roles']['adams']==10 and q['roles']['ballhandler']==7 and q['roles']['screened_defender']==3, q['roles']
          assert cfg['screen']['value']=='DROP COVERAGE', cfg['screen']
          sim=cfg['shot']['similar_xfg']
          assert sim['n']==8 and abs(sim['xfg_pct']-40.9375)<1e-12, sim
          assert sx['matched']['n']==8 and abs(sx['matched']['xfg_pct']-40.9375)<1e-12, sx['matched']
          assert sim['distance_tolerance_ft']==1.5 and sim['xfg_tolerance_percentage_points']==2.0
          assert sim['criteria_logic']=='intersection' and sim['action_type_filter'] is None
          assert cfg['timing']['contact_source_start_frame']==168
          assert cfg['timing']['contact_source_end_frame_inclusive']==221
          assert abs(sum(e-s for s,e in cfg['timing']['contact_phases'])-1.8018)<0.002
          print('LOCKED LABEL:',cfg['screen']['value'])
          print('MATCHED XFG:',sim['xfg_pct'],'N',sim['n'])
          print('CONTACT:',sum(e-s for s,e in cfg['timing']['contact_phases']))
          PY
      - name: Render DROP_COVERAGE_LOCKED_BROADCAST_V1 UHD
        run: |
          PYTHONPATH=tools python tools/drop_coverage_locked_broadcast_v1.py \
            --source artifacts/probe/toronto_tracking/source_native.mp4 \
            --tracks artifacts/probe/toronto_tracking/tracks.csv \
            --config configs/drop_coverage_locked_broadcast_v1_toronto_event483.json \
            --out artifacts/drop_coverage_locked_broadcast_v1
      - name: Validate UHD and create streamable 4K
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('artifacts/drop_coverage_locked_broadcast_v1')
          qa=json.load(open(p/'qa.json'))
          assert qa['tool_id']=='DROP_COVERAGE_LOCKED_BROADCAST_V1', qa
          assert qa['parent_tool_id']=='LOCKED_BROADCAST_SCREEN_V3', qa
          assert qa['canonical_ui_label']=='DROP COVERAGE', qa
          assert qa['enduring_model_lock'] is True and qa['universal_default'] is True
          assert abs(qa['screen_contact_total_s']-1.8018)<0.002
          assert qa['event_xfg_pct']==41.7
          assert qa['similar_xfg']['n']==8 and abs(qa['similar_xfg']['xfg_pct']-40.9375)<1e-12
          uhd=pathlib.Path(qa['uhd']); assert uhd.exists()
          s=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,r_frame_rate','-of','json',str(uhd)],text=True))['streams'][0]
          assert s['codec_name']=='h264' and s['width']==3840 and s['height']==2160 and s['r_frame_rate']=='30/1', s
          print(json.dumps(qa,indent=2))
          PY
          ffmpeg -y -hide_banner -loglevel warning \
            -i artifacts/drop_coverage_locked_broadcast_v1/sheppard_adams_drop_coverage_locked_broadcast_v1_UHD.mp4 \
            -c:v libx264 -preset veryfast -crf 20 -maxrate 14M -bufsize 28M -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart \
            artifacts/sheppard_adams_DROP_COVERAGE_V1_4k_streamable.mp4
          ffmpeg -v error -i artifacts/sheppard_adams_DROP_COVERAGE_V1_4k_streamable.mp4 -f null -
      - name: Build package
        run: |
          mkdir -p artifacts/drop_coverage_qa
          cp artifacts/drop_coverage_locked_broadcast_v1/release_freeze.jpg artifacts/drop_coverage_qa/
          cd artifacts
          zip -9 -r sheppard_adams_DROP_COVERAGE_V1_package.zip \
            drop_coverage_locked_broadcast_v1 \
            sheppard_adams_DROP_COVERAGE_V1_4k_streamable.mp4 \
            v3/sheppard_v3_matched_xfg.json \
            v3/sheppard_v3_matched_shots.csv \
            ../configs/drop_coverage_locked_broadcast_v1_toronto_event483.json \
            drop_coverage_qa
      - uses: actions/upload-artifact@v4
        with:
          name: drop-coverage-locked-broadcast-v1-reference
          path: |
            artifacts/drop_coverage_locked_broadcast_v1/sheppard_adams_drop_coverage_locked_broadcast_v1_UHD.mp4
            artifacts/drop_coverage_locked_broadcast_v1/sheppard_adams_drop_coverage_locked_broadcast_v1_native.mp4
            artifacts/sheppard_adams_DROP_COVERAGE_V1_4k_streamable.mp4
            artifacts/drop_coverage_locked_broadcast_v1/release_freeze.jpg
            artifacts/drop_coverage_locked_broadcast_v1/qa.json
            artifacts/drop_coverage_locked_broadcast_v1/LOCKED_TOOL_ID.txt
            artifacts/v3/sheppard_v3_matched_xfg.json
            artifacts/v3/sheppard_v3_matched_shots.csv
            configs/drop_coverage_locked_broadcast_v1_toronto_event483.json
            artifacts/sheppard_adams_DROP_COVERAGE_V1_package.zip
          if-no-files-found: error
          retention-days: 30

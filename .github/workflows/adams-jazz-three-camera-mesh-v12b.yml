name: Adams Jazz three-camera high-standard mesh v12b

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v12.py'
      - 'freeze_spin/build_three_camera_mesh_v12b.py'
      - '.github/workflows/adams-jazz-three-camera-mesh-v12b.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-three-camera-v12b:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
          python - <<'PY'
          import cv2, numpy, scipy, skimage, torch, torchvision
          from rfdetr import RFDETRKeypointPreview
          from moge.model.v2 import MoGeModel
          print('RUNTIME', cv2.__version__, numpy.__version__, scipy.__version__, skimage.__version__, torch.__version__, torchvision.__version__)
          print('RFDETR_OK', RFDETRKeypointPreview)
          print('MOGE_OK', MoGeModel)
          PY

      - name: Retrieve v11 exact-state evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11 three_camera_v12b
          gh run download 34535691949 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-three-camera-exact-sync-v11-34535691949 \
            --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json
          test -s "$(find inputs_v11 -type f -name 'K_Left_Above_Rim_v11_*.png' | head -n 1)"
          test -s "$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          test -s "$(find inputs_v11 -type f -name 'L_Right_Above_Rim_v11_*.png' | head -n 1)"

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render native static three-camera hypothesis proof
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v12b \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v12b \
            --tokens 900 \
            --voxel-cm 2.5 \
            2>&1 | tee three_camera_v12b/render.log

      - name: Assert native static outputs and hypothesis diagnostics
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          root=Path('three_camera_v12b')
          q=json.load(open(root/'three_camera_mesh_v12_qa.json'))
          assert q['accepted_mesh_count'] >= 2, q['accepted_mesh_count']
          assert q['tracks_using_right_above_rim'] >= 1, q['tracks_using_right_above_rim']
          for a in (0,5,10,15,20,25):
              p=root/f'v12_{a:02d}deg.png'; im=cv2.imread(str(p))
              assert im is not None and im.shape[:2]==(540,960), (p, None if im is None else im.shape)
          print('V12B_NATIVE_STATIC_OUTPUTS_OK')
          print('MESHES',q['accepted_mesh_count'],'RAR_TRACKS',q['tracks_using_right_above_rim'],'BALL',q['ball']['status'])
          print('MIN_NONBLACK',q['minimum_nonblack_fraction'])
          PY

      - name: Package v12b evidence even on failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v12b/render.log delivery/ 2>/dev/null || true
          cp three_camera_v12b/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v12b/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v12b/v12_*deg.png delivery/ 2>/dev/null || true
          cp three_camera_v12b/v12_pose_mask_*.png delivery/ 2>/dev/null || true
          cp three_camera_v12b/v12_track_*_mesh.npz delivery/ 2>/dev/null || true
          cp inputs_v11/exact_visual_state_v11_qa.json delivery/ 2>/dev/null || true
          find inputs_v11 -maxdepth 1 -type f \( -name 'K_Left_Above_Rim_v11_*.png' -o -name 'A_Broadcast_v11_*.png' -o -name 'L_Right_Above_Rim_v11_*.png' \) -exec cp {} delivery/ \; 2>/dev/null || true
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_three_camera_mesh_v12b_package.zip ./*)

      - name: Upload v12b static hypothesis proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-mesh-v12b-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

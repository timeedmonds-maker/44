# Delivery-trigger revision: exact Reed Sheppard xFG handoff
name: Adams Toronto event483 V8 final

on:
  workflow_dispatch:
  push:
    branches: [codex/sheppard-adams-xfg-delivery]
    paths:
      - '.github/workflows/adams-toronto-event483-v8-final.yml'
  pull_request:
    branches: [codex/adams-screen-v8-toronto]
    paths:
      - '.github/workflows/adams-toronto-event483-v8-final.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CV and data stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git fonts-dejavu-core zip
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install requests ultralytics scipy pandas 'numpy<2' pillow pyreadr
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download tracking models
        run: |
          mkdir -p artifacts/models
          curl -L --fail --retry 3 -o artifacts/models/rfdetr_m_640.onnx https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --fail --retry 3 -o artifacts/models/court_yolo11m_pose.pt https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Lock visually and temporally validated roles
        run: |
          mkdir -p artifacts
          cat > artifacts/event483_overrides.json <<'JSON'
          {
            "adams": 10,
            "ballhandler": 7,
            "screened_defender": 3,
            "adams_defender": 4,
            "names": {
              "10": "ADAMS",
              "7": "SHEPPARD"
            }
          }
          JSON
      - name: Resolve exact official Sheppard xFG row
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          GAME_ID='0022500131'
          PLAYER_ID=1642263
          EVENT_NUM=483
          URL='https://stats.gleague.nba.com/stats/shotqualityvideologs'
          HEADERS={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://www.nba.com/',
              'Origin':'https://www.nba.com',
              'Accept':'application/json, text/plain, */*',
              'Accept-Language':'en-US,en;q=0.9',
              'Connection':'keep-alive',
          }
          s=requests.Session(); s.headers.update(HEADERS)
          last=None
          payload=None
          for attempt in range(1,6):
              try:
                  r=s.get(URL,params={'GameID':GAME_ID,'PlayerID':PLAYER_ID},timeout=(8,35))
                  if r.status_code==200:
                      payload=r.json()
                      if str(payload.get('gameId') or '').zfill(10)==GAME_ID and int(payload.get('playerId') or 0)==PLAYER_ID:
                          break
                      last=f'unexpected payload: {r.text[:300]}'
                  else:
                      last=f'HTTP {r.status_code}: {r.text[:300]}'
              except Exception as exc:
                  last=repr(exc)
              if attempt<5:
                  time.sleep(min(6.0,0.7*(2**(attempt-1))))
          else:
              raise RuntimeError(f'Official xFG fetch failed: {last}')

          matches=[sh for sh in (payload.get('shotList') or []) if int(sh.get('eventNum') or -1)==EVENT_NUM]
          if len(matches)!=1:
              raise RuntimeError(f'Expected exactly one official xFG shot for event {EVENT_NUM}; found {len(matches)}')
          sh=matches[0]
          xfg=float(sh['shotQuality'])
          if not (0.0 <= xfg <= 1.0):
              raise RuntimeError(f'Invalid shotQuality: {xfg}')
          shot_value=float(sh.get('shotValue') or (3 if '3' in str(sh.get('shotType')) else 2))
          exact={
              'game_date': payload.get('gameDate'),
              'game_id': GAME_ID,
              'event_num': EVENT_NUM,
              'player_id': PLAYER_ID,
              'player_name_pbp': 'Reed Sheppard',
              'description': sh.get('description') or sh.get('actionType'),
              'period': sh.get('period'),
              'clock': sh.get('gameClock'),
              'shot_distance': sh.get('shotDistance'),
              'xfg_matchup': payload.get('matchup'),
              'xfg_team_abbr': payload.get('teamAbbreviation') or payload.get('teamTricode'),
              'xfg_player_name': payload.get('playerName') or 'Reed Sheppard',
              'xfg_event_type': sh.get('eventType'),
              'xfg_action_type': sh.get('actionType'),
              'xfg_shot_type': sh.get('shotType'),
              'xfg_shot_value': sh.get('shotValue'),
              'xfg_made': int(sh.get('success') or 0),
              'xfg_period': sh.get('period'),
              'xfg_game_clock': sh.get('gameClock'),
              'xfg_xfg': xfg,
              'xfg_xfg_pct': f'{xfg*100.0:.1f}',
              'xfg_expected_points': xfg*shot_value,
              'xfg_actual_points': shot_value if int(sh.get('success') or 0)==1 else 0.0,
              'xfg_source_host': 'stats.gleague.nba.com',
              'xfg_source_resource': 'shotqualityvideologs',
              'xfg_available': True,
              'guid': sh.get('guid'),
              'large_hls': sh.get('largeHls'),
              'playlist_url': sh.get('playListUrl'),
              'loc_x': sh.get('locX'),
              'loc_y': sh.get('locY'),
          }
          exact['xfg_points_over_expected']=exact['xfg_actual_points']-exact['xfg_expected_points']
          exact['xfg_fg_over_expected_shot']=float(exact['xfg_made'])-xfg
          out={'xfg':exact}
          Path('artifacts/event483_xfg.json').write_text(json.dumps(out,indent=2,default=str))
          print('OFFICIAL_XFG_PCT', exact['xfg_xfg_pct'])
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Render final V8 Adams screen clip with official xFG
        run: |
          python tools/adams_screen_prod_v3.py \
            --game 0022500131 --event 483 \
            --start-s 3.5 --end-s 11.5 \
            --analysis-fps 15 --number-fps 6 --court-fps 1 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --overrides artifacts/event483_overrides.json \
            --xfg-row-json artifacts/event483_xfg.json \
            --out artifacts/toronto_event483_v8_final_xfg
      - name: Validate identities, xFG provenance and package
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifacts/toronto_event483_v8_final_xfg')
          qa=json.loads((p/'qa.json').read_text())
          r=qa['roles']
          assert r['adams']==10, r
          assert r['ballhandler']==7, r
          assert r['screened_defender']==3, r
          assert qa['game_id']=='0022500131' and qa['event_num']==483
          assert qa['source']['angle']=='Broadcast'
          assert qa['source']['variant']['width']==960 and qa['source']['variant']['height']==540
          ctx=json.loads((p/'context.json').read_text())
          assert ctx['xfg_status']=='provided', ctx
          x=ctx['xfg']
          assert int(float(x['event_num']))==483, x
          assert int(float(x['player_id']))==1642263, x
          assert x['xfg_source_resource']=='shotqualityvideologs', x
          assert 0.0 <= float(x['xfg_xfg']) <= 1.0, x
          assert abs(float(x['xfg_xfg_pct']) - 100.0*float(x['xfg_xfg'])) < 0.11, x
          assert x['xfg_xfg_pct']=='41.7', x
          print('OFFICIAL_XFG_PCT', x['xfg_xfg_pct'])
          print(json.dumps(qa,indent=2))
          print(json.dumps(ctx,indent=2))
          PY
          cd artifacts/toronto_event483_v8_final_xfg
          zip -j -9 ../sheppard_adams_event483_v8_xfg_uhd.zip adams_screen_overlay_2160p.mp4 qa.json roles.json context.json ../event483_xfg.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheppard-adams-event483-v8-xfg-final
          path: |
            artifacts/toronto_event483_v8_final_xfg/adams_screen_overlay_h264.mp4
            artifacts/toronto_event483_v8_final_xfg/adams_screen_overlay_2160p.mp4
            artifacts/toronto_event483_v8_final_xfg/qa.json
            artifacts/toronto_event483_v8_final_xfg/roles.json
            artifacts/toronto_event483_v8_final_xfg/context.json
            artifacts/toronto_event483_v8_final_xfg/track_contact_sheet.jpg
            artifacts/event483_xfg.json
            artifacts/sheppard_adams_event483_v8_xfg_uhd.zip
          if-no-files-found: error
          retention-days: 30

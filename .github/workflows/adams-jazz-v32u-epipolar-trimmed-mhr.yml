name: Adams Jazz v32v coherent LAR-RAR MHR leave-one-out

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v32v_lar_rar_global_state_mhr.py'
      - '.github/workflows/adams-jazz-v32u-epipolar-trimmed-mhr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lar-rar-global-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install observation and MHR runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1' 'pymomentum-core>=0.1.111' 'git+https://github.com/facebookresearch/MHR.git'

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Attach source-grounded LAR Adams identity anchor
        run: |
          python - <<'PY'
          import json, pathlib
          stage = pathlib.Path('inputs_b32/stage_a')
          qp = stage / 'v32_quality_cluster.json'
          sp = stage / 'v32_scene_manifest.json'
          q = json.load(open(qp)); s = json.load(open(sp))
          rows = s['all_on_court_people']['per_camera']['Left Above Rim']
          # Visual QA of the packaged chosen LAR frame identifies detector person_0
          # as Houston #12 Steven Adams. Reuse its real B32 bbox; do not invent pixels.
          row = next(r for r in rows if int(r['camera_person_id']) == 0)
          q['focal_player']['observations']['Left Above Rim'] = {
              'camera_person_id': 0,
              'bbox_xyxy': row['bbox_xyxy'],
              'detector_score': row.get('score'),
              'mask_pixels': row.get('mask_pixels'),
              'foot_px': row.get('foot_px'),
              'foot_world_cm': row.get('foot_world_cm'),
              'identity_source': 'B32 scene all_on_court_people person_0; visually verified Houston #12',
          }
          qp.write_text(json.dumps(q, indent=2))
          print('LAR identity anchor', row['bbox_xyxy'])
          PY

      - name: Run v32v coherent LAR-RAR solve
        shell: bash
        run: |
          set +e
          mkdir -p v32v work_v32v
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v32v_lar_rar_global_state_mhr \
            --b32-root inputs_b32 --work work_v32v --out v32v --max-nfev 360 2>&1 | tee v32v/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32v/solver_exit_code.txt
          exit 0

      - name: Print v32v diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for n in ('v32v_state_audit.json','v32v_qa.json'):
              p = pathlib.Path('v32v') / n
              if not p.exists():
                  continue
              q = json.load(open(p))
              print(n)
              if n.startswith('v32v_state'):
                  keys = ['selected_lar_source','selected_lar_anchor_rel','selected_lar_epipolar']
              else:
                  keys = ['status','selected_lar_source','raw_lar_rar_epipolar','per_camera_reprojection','optimizer','gate']
              print(json.dumps({k:q.get(k) for k in keys}, indent=2))
          PY

      - name: Package v32v evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32v/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32v_lar_rar_global_state_mhr.zip ./*)

      - name: Upload v32v evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32v-lar-rar-global-state-mhr-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed v32v gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32v/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

name: Adams Jazz v32x full-MHR coherent LAR candidate sweep

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v32x_lar_candidate_sweep.py'
      - '.github/workflows/adams-jazz-v32u-epipolar-trimmed-mhr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lar-candidate-full-mhr-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install observation and MHR runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1' 'pymomentum-core>=0.1.111' 'git+https://github.com/facebookresearch/MHR.git'

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Run v32x ranks 1 2 3 through unchanged full MHR solve
        shell: bash
        run: |
          set +e
          mkdir -p v32x work_v32x
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v32x_lar_candidate_sweep \
            --b32-root inputs_b32 --work work_v32x --out v32x --ranks 1,2,3 --max-nfev 360 2>&1 | tee v32x/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32x/solver_exit_code.txt
          exit 0

      - name: Print v32x winner diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('v32x/v32x_summary.json')
          if p.exists():
              q=json.load(open(p))
              print(json.dumps({
                'winner_rank':q.get('winner_rank'),
                'static_0_15_geometry_unlocked':q.get('static_0_15_geometry_unlocked'),
                'winner':q.get('winner'),
                'all_results':q.get('all_results')},indent=2))
          PY

      - name: Package v32x evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp -r v32x/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -type f -print -quit)"
          (cd delivery && zip -0 -r adams_jazz_v32x_lar_candidate_full_mhr_sweep.zip ./*)

      - name: Upload v32x evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32x-lar-candidate-full-mhr-sweep-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed v32x gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32x/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

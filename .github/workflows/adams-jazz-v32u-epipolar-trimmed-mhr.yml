name: Adams Jazz v32w all-candidate LAR epipolar MHR

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v32w_lar_all_candidate_epipolar_mhr.py'
      - '.github/workflows/adams-jazz-v32u-epipolar-trimmed-mhr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lar-rar-all-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install observation and MHR runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1' 'pymomentum-core>=0.1.111' 'git+https://github.com/facebookresearch/MHR.git'

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Run v32w geometry-selected coherent LAR-RAR solve
        shell: bash
        run: |
          set +e
          mkdir -p v32w work_v32w
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v32w_lar_all_candidate_epipolar_mhr \
            --b32-root inputs_b32 --work work_v32w --out v32w --max-nfev 360 2>&1 | tee v32w/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32w/solver_exit_code.txt
          exit 0

      - name: Print v32w diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for n in ('v32v_state_audit.json','v32v_qa.json'):
              p = pathlib.Path('v32w') / n
              if not p.exists():
                  continue
              q = json.load(open(p))
              print(n)
              if n.startswith('v32v_state'):
                  top=q.get('lar_candidates',[])[:8]
                  print(json.dumps({
                    'selected_lar_source':q.get('selected_lar_source'),
                    'selected_lar_anchor_rel':q.get('selected_lar_anchor_rel'),
                    'selected_lar_detection_index':q.get('selected_lar_detection_index'),
                    'selected_lar_epipolar':q.get('selected_lar_epipolar'),
                    'top_lar_candidates':top},indent=2))
              else:
                  keys=['status','selected_lar_source','raw_lar_rar_epipolar','per_camera_reprojection','optimizer','gate']
                  print(json.dumps({k:q.get(k) for k in keys},indent=2))
          PY

      - name: Package v32w evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32w/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32w_lar_all_candidate_epipolar_mhr.zip ./*)

      - name: Upload v32w evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32w-lar-all-candidate-epipolar-mhr-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed v32w gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32w/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

name: Adams Jazz Right Slash temporal bridge v97

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-jazz-right-slash-temporal-bridge-v97.yml'
      - 'freeze_spin/audit_right_slash_bridge_v97.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adams-jazz-right-slash-temporal-bridge-v97.yml'
      - 'freeze_spin/audit_right_slash_bridge_v97.py'

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic diagnostic runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Recover immutable v93 exact-event burst
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-slash-event489-burst-v93-33955558281
          path: right_slash_v93
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: timeedmonds-maker/44
          run-id: 33955558281

      - name: Execute freeze-to-sharp temporal bridge proof
        run: |
          python freeze_spin/audit_right_slash_bridge_v97.py \
            --frames right_slash_v93/frames \
            --manifest right_slash_v93/event489_burst_v93.json \
            --target b40_8.276s.png \
            --bridge b42_8.376s.png \
            --candidates \
              b43_8.426s.png \
              b44_8.476s.png \
              b45_8.526s.png \
              b46_8.576s.png \
              b47_8.626s.png \
              b48_8.676s.png \
              b49_8.726s.png \
              b50_8.776s.png \
              b51_8.826s.png \
              b52_8.876s.png \
              b53_8.926s.png \
              b54_8.976s.png \
              b55_9.026s.png \
            --out right_slash_temporal_bridge_v97

      - name: Upload v97 bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-temporal-bridge-v97-${{ github.run_id }}
          path: right_slash_temporal_bridge_v97/
          retention-days: 14
          if-no-files-found: error

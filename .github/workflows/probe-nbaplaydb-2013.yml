name: Probe NBA Play DB 2013
on:
  push:
    branches: [agent/adams-westbrook-old-video-probe]
    paths:
      - 'probe_nbaplaydb_2013.py'
      - '.github/workflows/probe-nbaplaydb-2013.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python3 probe_nbaplaydb_2013.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbaplaydb-2013-${{ github.run_id }}
          path: nbaplaydb_2013_probe.json
          retention-days: 1

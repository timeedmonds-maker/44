name: Adams Jazz Frame C Right Above Rim hash roots v50a

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/adams_jazz_frame_c_right_above_rim_hash_v50.json'
      - 'freeze_spin/diagnose_right_above_rim_hash_roots_v50a.py'
      - '.github/workflows/adams-jazz-frame-c-right-above-rim-v50a.yml'

permissions:
  contents: read

jobs:
  diagnose-hash-roots-v50a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Run diagnostic-only direct-hash multistart check
        run: |
          python -m freeze_spin.diagnose_right_above_rim_hash_roots_v50a \
            --observations freeze_spin/adams_jazz_frame_c_right_above_rim_hash_v50.json \
            --out v50a
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-above-rim-hash-roots-v50a-${{ github.run_id }}
          path: v50a/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

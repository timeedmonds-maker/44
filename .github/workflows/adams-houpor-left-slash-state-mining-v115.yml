name: Adams HOU-POR Left Slash state mining v115

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-houpor-left-slash-state-mining-v115.yml'
      - 'freeze_spin/mine_same_game_camera_states_v1.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adams-houpor-left-slash-state-mining-v115.yml'
      - 'freeze_spin/mine_same_game_camera_states_v1.py'

permissions:
  contents: read
  actions: read

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic native-frame mining runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 requests==2.32.3

      - name: Recover immutable synchronized Frame C chooser
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692

      - name: Verify exact immutable Left Slash target
        run: |
          test -f frame_c/G_Left_Slash_8.868843s_frame0266.png
          echo '2ced6fbf7108459e4c8acda1d62ab8a4a77a455971287c1fcfcdc6ea7b6a272f  frame_c/G_Left_Slash_8.868843s_frame0266.png' | sha256sum -c -

      - name: Mine broad target-game Left Slash optical states
        run: |
          python -m freeze_spin.mine_same_game_camera_states_v1 \
            --game-id 0022500527 \
            --camera-label 'Left Slash' \
            --target-frame frame_c/G_Left_Slash_8.868843s_frame0266.png \
            --target-sha256 2ced6fbf7108459e4c8acda1d62ab8a4a77a455971287c1fcfcdc6ea7b6a272f \
            --count 22 \
            --event-start 5 \
            --event-stop 1205 \
            --event-step 20 \
            --samples-per-clip 7 \
            --keep-top 12 \
            --out v115

      - name: Assert discovery-only semantics and provenance
        run: |
          python - <<'PY'
          import json
          q=json.load(open('v115/same_game_physical_state_mining_v1.json'))
          assert q['game_id']=='0022500527', q['game_id']
          assert q['camera_label']=='Left Slash', q['camera_label']
          assert q['status']=='DISCOVERY_ONLY_NO_PROMOTION'
          assert q['permissions']['fixed_camera_center_prior_allowed'] is False
          assert q['permissions']['metric_camera_promotion_allowed'] is False
          assert q['permissions']['static_novel_view_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          assert len(q['top_candidates']) >= 5, len(q['top_candidates'])
          print('target game', q['game_id'])
          print('successful events', sum(e.get('status')=='ok' for e in q['events']))
          print('credible discovery candidates', q['credible_candidate_event_count'])
          for c in q['top_candidates']:
              a=c['analysis']
              print(c['event_probe'], c['sample_name'], a['discovery_score_lower_is_better'], a['full_scene']['ransac_inliers'], a['cross_depth'].get('support_residual',{}).get('median_px'))
          PY

      - name: Package v115 discovery evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v115/same_game_physical_state_mining_v1.json delivery/ 2>/dev/null || true
          cp v115/top_state_candidates_montage.png delivery/ 2>/dev/null || true
          cp -r v115/selected_frames delivery/ 2>/dev/null || true
          cp frame_c/G_Left_Slash_8.868843s_frame0266.png delivery/ 2>/dev/null || true

      - name: Upload v115 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-houpor-left-slash-state-mining-v115-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

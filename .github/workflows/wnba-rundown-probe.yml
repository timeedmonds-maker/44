name: WNBA Rundown 2025 tracking extraction

on:
  push:
    paths:
      - .github/workflows/wnba-rundown-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wnba-potential-assists-2025
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Extract server-rendered 2025 WNBA player data
        shell: bash
        run: |
          cat >/tmp/rundown_extract.py <<'PY'
          import csv,html,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          O=Path('outputs/wnba_rundown_2025'); O.mkdir(parents=True,exist_ok=True)
          B='https://www.therundown.gg'
          S=requests.Session(); H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36','Accept':'text/html,application/xhtml+xml,*/*'}
          attempts=[]

          def get(path,name):
              try:
                  r=S.get(urljoin(B,path),headers=H,timeout=30)
                  attempts.append({'path':path,'status':r.status_code,'bytes':len(r.content),'final':r.url})
                  print('GET',path,r.status_code,len(r.content),r.url)
                  if r.status_code==200:
                      (O/f'{name}.html').write_text(r.text,encoding='utf8')
                      return r.text
              except Exception as e:
                  attempts.append({'path':path,'error':repr(e)}); print('ERR',path,e)
              return ''

          paths=[
              ('/research/wnba/players?season=2025&gt=Regular+Season','all_players_2025'),
              ('/research/wnba/players?season=2025','all_players_2025_simple'),
              ('/research/wnba/player/courtney-williams?season=2025&gt=Regular+Season','courtney_williams'),
              ('/research/wnba/player/alyssa-thomas?season=2025&gt=Regular+Season','alyssa_thomas'),
              ('/research/wnba/player/chelsea-gray?season=2025&gt=Regular+Season','chelsea_gray'),
              ('/research/wnba/player/paige-bueckers?season=2025&gt=Regular+Season','paige_bueckers'),
          ]
          pages=[]
          for p,n in paths:
              txt=get(p,n)
              if txt: pages.append((p,n,txt))

          def table_dump(txt):
              soup=BeautifulSoup(txt,'html.parser')
              out=[]
              for ti,t in enumerate(soup.find_all('table')):
                  headers=[x.get_text(' ',strip=True) for x in t.find_all('th')]
                  rows=[]
                  for tr in t.find_all('tr'):
                      cells=[x.get_text(' ',strip=True) for x in tr.find_all(['td','th'])]
                      if cells: rows.append(cells)
                  out.append({'index':ti,'headers':headers,'rows':rows})
              return out,soup

          all_tables={}; player_links=set(); textual=[]
          for p,n,txt in pages:
              tables,soup=table_dump(txt); all_tables[n]=tables
              text=soup.get_text(' ',strip=True)
              textual.append({'page':n,'length':len(text),'potAstPositions':[m.start() for m in re.finditer(r'POT\s*AST|Potential Assists?',text,re.I)][:30],'sample':text[:1200]})
              for a in soup.find_all('a',href=True):
                  h=html.unescape(a['href'])
                  if h.startswith('/research/wnba/player/'):
                      if 'season=' not in h: h += ('&' if '?' in h else '?')+'season=2025&gt=Regular+Season'
                      player_links.add(h)
              print(n,'tables',len(tables),'playerlinks',len(player_links),'POT AST?',bool(re.search(r'POT\s*AST|Potential Assists?',text,re.I)))
          (O/'tables_initial.json').write_text(json.dumps(all_tables,indent=2),encoding='utf8')
          (O/'page_text_summary.json').write_text(json.dumps(textual,indent=2),encoding='utf8')
          (O/'player_links.json').write_text(json.dumps(sorted(player_links),indent=2),encoding='utf8')

          # Convert any table whose headers actually contain potential assists.
          extracted=[]
          for page,tables in all_tables.items():
              for t in tables:
                  hdr=t['headers']
                  joined=' | '.join(hdr)
                  if re.search(r'POT\s*AST|Potential Assists?',joined,re.I):
                      extracted.append({'page':page,'headers':hdr,'rows':t['rows']})
          (O/'potential_assist_tables.json').write_text(json.dumps(extracted,indent=2),encoding='utf8')

          # If all-player page is member-truncated or lacks PA, fetch discovered 2025 player pages.
          # Server-rendered individual research pages are public; cap at every discovered player URL.
          player_results=[]
          for idx,h in enumerate(sorted(player_links)):
              if idx>=260: break
              txt=get(h,f'player_{idx:03d}')
              if not txt: continue
              tables,soup=table_dump(txt)
              page_text=soup.get_text(' ',strip=True)
              pname=''
              h1=soup.find('h1');
              if h1:pname=h1.get_text(' ',strip=True)
              matched=[]
              for t in tables:
                  hj=' | '.join(t['headers'])
                  if re.search(r'POT\s*AST|Potential Assists?',hj,re.I): matched.append(t)
              # also save compact context around potential-assist phrases if values rendered outside a table
              contexts=[]
              for m in re.finditer(r'POT\s*AST|Potential Assists?',page_text,re.I):
                  contexts.append(page_text[max(0,m.start()-600):m.start()+1200])
              if matched or contexts:
                  player_results.append({'url':h,'player':pname,'tables':matched,'contexts':contexts[:8]})
                  print('PA PLAYER',idx,pname,'tables',len(matched),'contexts',len(contexts))
              time.sleep(.03)
          (O/'player_pa_pages.json').write_text(json.dumps(player_results,indent=2),encoding='utf8')

          # General flatten: detect header columns and write rows wherever a PA table is present.
          flat=[]
          for pr in player_results:
              for t in pr['tables']:
                  hdr=t['headers']
                  # rows often include header as first row; align only equal-length data rows
                  for row in t['rows']:
                      if len(row)!=len(hdr) or row==hdr: continue
                      d={hdr[i]:row[i] for i in range(len(hdr))}
                      d['_player_page']=pr['player']; d['_url']=pr['url']; flat.append(d)
          # union columns
          cols=[]
          for d in flat:
              for k in d:
                  if k not in cols:cols.append(k)
          if flat:
              with (O/'wnba_2025_potential_assists_raw_tables.csv').open('w',newline='',encoding='utf8') as f:
                  w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(flat)

          (O/'attempts.json').write_text(json.dumps(attempts,indent=2),encoding='utf8')
          summary={'initialPages':len(pages),'playerLinksDiscovered':len(player_links),'initialPATables':len(extracted),'playerPagesWithPA':len(player_results),'flatPARows':len(flat)}
          (O/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf8')
          print('SUMMARY',summary)
          PY
          python /tmp/rundown_extract.py
      - name: Commit isolated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/wnba_rundown_2025
          git diff --staged --quiet || git commit -m "Extract 2025 WNBA potential assists from public Rundown research [skip ci]"
          git push origin HEAD:agent/wnba-potential-assists-2025

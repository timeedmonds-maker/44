name: Adams Jazz physical apex hardened orbit v19

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/select_jazz_predunk_ball_apex_v6.py'
      - 'freeze_spin/build_portable_moge_true_orbit_v18.py'
      - '.github/workflows/adams-jazz-physical-apex-hardened-orbit-v19.yml'
  workflow_dispatch:

jobs:
  physical-apex-hardened-orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install native vision and MoGe runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve and QA all 12 official native Jazz dunk angles
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json --out jazz_dunk_source --workers 8

      - name: Establish common audio timeline
        run: |
          mkdir -p jazz_physical_v19/locked_frames
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path('jazz_dunk_source/clips').glob('*_489_*_SOURCE.mp4')):
              m=re.search(r'_489_(.+)_SOURCE\.mp4$',p.name)
              if m: rows.append({'label':m.group(1).replace('_',' '),'file':p.name,'freeze_time':9.57658})
          if len(rows)!=12: raise RuntimeError(f'Expected 12 angles, found {len(rows)}')
          cfg={'event':{'game_id':'0022500301','event_id':489},'source_fps':29.97003,'reference_angle':'Left Above Rim','angles':rows}
          Path('jazz_physical_v19/provisional_sync_map.json').write_text(json.dumps(cfg,indent=2))
          PY
          python freeze_spin/estimate_audio_sync_graph.py \
            --config jazz_physical_v19/provisional_sync_map.json --clips jazz_dunk_source/clips \
            --reference 'Left Above Rim' --max-lag-seconds 2.0 --out jazz_physical_v19/audio_sync_graph.json

      - name: Prove highest basketball point before first descending rim crossing
        run: |
          python freeze_spin/select_jazz_predunk_ball_apex_v6.py \
            --clips jazz_dunk_source/clips --sync jazz_physical_v19/audio_sync_graph.json \
            --out jazz_physical_v19 --old-rejected-apex-ref 9.635413333166447
          python - <<'PY'
          import json
          d=json.load(open('jazz_physical_v19/predunk_ball_apex_v6.json'))
          if not d.get('passed'): raise SystemExit('Physical apex gate failed')
          a=float(d['apex_reference_time']); c=float(d['rim_crossing_reference_time']); h=9.635413333166447
          if not (a < c < h+0.02): raise SystemExit(f'Invalid state ordering apex={a} crossing={c} rejected={h}')
          print('PHYSICAL_APEX_REFERENCE_TIME',a)
          print('RIM_CROSSING_REFERENCE_TIME',c)
          print('APEX_TO_CROSSING_S',d['apex_to_crossing_s'])
          print('SECONDS_BEFORE_REJECTED_HANG',d['seconds_before_user_rejected_hanging_state'])
          print('CONFIRMATIONS',d['confirmation_labels'])
          PY

      - name: Lock all 12 cameras to physical apex
        run: |
          python - <<'PY'
          import cv2,json
          from pathlib import Path
          d=json.load(open('jazz_physical_v19/predunk_ball_apex_v6.json')); tref=float(d['apex_reference_time'])
          sync=json.load(open('jazz_physical_v19/audio_sync_graph.json'))
          cfg=json.load(open('jazz_physical_v19/provisional_sync_map.json'))
          offsets={r['label']:float(r['offset_seconds_vs_reference']) for r in sync['angles']}; files={r['label']:r['file'] for r in cfg['angles']}
          rows=[]
          for label,file in files.items():
              t=tref+offsets[label]; p=Path('jazz_dunk_source/clips')/file
              cap=cv2.VideoCapture(str(p)); fps=float(cap.get(cv2.CAP_PROP_FPS) or 29.97003); cap.set(cv2.CAP_PROP_POS_MSEC,t*1000.0)
              ok,im=cap.read(); fi=int(round(cap.get(cv2.CAP_PROP_POS_FRAMES)-1)); cap.release()
              if not ok: raise RuntimeError(f'Cannot export {label} at {t}')
              if im.shape[:2]!=(540,960): raise RuntimeError(f'{label} not native 960x540')
              out=Path('jazz_physical_v19/locked_frames')/f"{label.replace(' ','_')}_apex.png"; cv2.imwrite(str(out),im)
              rows.append({'label':label,'requested_local_time':t,'reference_time':tref,'decoded_frame_index':fi,'fps':fps,'file':out.name})
          if len(rows)!=12: raise RuntimeError(f'Expected 12 frames, got {len(rows)}')
          Path('jazz_physical_v19/locked_frames/locked_frames.json').write_text(json.dumps(rows,indent=2))
          print('LOCKED_FRAMES',len(rows),'REFERENCE_TIME',tref)
          PY

      - name: Render hardened constant-radius orbit
        run: |
          python freeze_spin/build_portable_moge_true_orbit_v18.py \
            --locked-dir jazz_physical_v19/locked_frames --out jazz_orbit_v19 \
            --reference 'In Arena' --tokens 1600 --max-degree 5.0 --frames 31

      - name: Enforce hard spatial QA
        run: |
          python - <<'PY'
          import json
          q=json.load(open('jazz_orbit_v19/portable_moge_true_orbit_qa_v18.json'))
          assert q['source_resolution']==[960,540] and q['render_resolution']==[960,540]
          assert q['max_radius_drift']<=1e-6 and q['max_pivot_drift_px']<=0.05 and q['render_max_degree']>=3.0
          assert q['edge_splat_policy'].startswith('explicit bounded')
          print('TRUE_ORBIT_MAX_DEG',q['render_max_degree'])
          print('TARGET_DIRECTION_CAMERA',q['target_direction_camera'])
          print('REAL_BASELINE_DEG',q['real_baseline_angle_deg'])
          print('DYNAMIC_ELIGIBLE_CAMERAS',q['dynamic_eligible_cameras'])
          print('MAX_RADIUS_DRIFT',q['max_radius_drift'])
          print('MAX_PIVOT_DRIFT_PX',q['max_pivot_drift_px'])
          for r in q['stills']: print('STILL_QA',r['degree'],'actual',r['actual_degree'],'resolved',round(r['resolved_fraction'],6),'holes',r['unresolved_pixels'])
          PY

      - name: Encode native hardened orbit preview
        run: |
          ffmpeg -y -framerate 30 -i jazz_orbit_v19/motion_%03d.png -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart jazz_orbit_v19/adams_jazz_physical_apex_hardened_orbit_native.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 jazz_orbit_v19/adams_jazz_physical_apex_hardened_orbit_native.mp4)" = "960" || exit 1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 jazz_orbit_v19/adams_jazz_physical_apex_hardened_orbit_native.mp4)" = "540" || exit 1

      - name: Package proof
        if: always()
        run: |
          mkdir -p delivery
          cp jazz_orbit_v19/true_orbit_00deg_native.png delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/true_orbit_03deg_native.png delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/true_orbit_05deg_native.png delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/true_orbit_unresolved_03deg.png delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/true_orbit_unresolved_05deg.png delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/portable_moge_true_orbit_qa_v18.json delivery/ 2>/dev/null || true
          cp jazz_orbit_v19/adams_jazz_physical_apex_hardened_orbit_native.mp4 delivery/ 2>/dev/null || true
          cp jazz_physical_v19/predunk_ball_apex_v6.json delivery/ 2>/dev/null || true
          cp jazz_physical_v19/*strip.png delivery/ 2>/dev/null || true
          cp jazz_physical_v19/*confirm.png delivery/ 2>/dev/null || true
          cp jazz_physical_v19/audio_sync_graph.json delivery/ 2>/dev/null || true
          cp jazz_physical_v19/locked_frames/locked_frames.json delivery/ 2>/dev/null || true
          cp jazz_physical_v19/locked_frames/*_apex.png delivery/ 2>/dev/null || true
          cp jazz_dunk_source/qa.json delivery/source_qa.json 2>/dev/null || true

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-physical-apex-hardened-orbit-v19-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Launch WNBA potential assists probe

on:
  push:
    paths:
      - .github/workflows/wnba-potential-assists-launch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wnba-potential-assists-2025
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run branch probe embedded in branch workflow
        shell: bash
        run: |
          awk '
            /python - <<.PY./ {inside=1; next}
            inside && /^          PY$/ {inside=0; exit}
            inside {sub(/^          /, ""); print}
          ' .github/workflows/wnba-potential-assists-2025.yml > /tmp/wnba_probe.py
          python /tmp/wnba_probe.py

      - name: Commit results to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/wnba_potential_assists_probe
          git diff --staged --quiet || git commit -m "Add WNBA 2025 potential assists probe results [skip ci]"
          git push origin HEAD:agent/wnba-potential-assists-2025

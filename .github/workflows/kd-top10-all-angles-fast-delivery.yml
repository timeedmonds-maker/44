name: KD Top 10 All Angles Fast Delivery

on:
  push:
    paths:
      - '.github/workflows/kd-top10-all-angles-fast-delivery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download validated source reel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9731182962/zip > source.zip
          unzip -j source.zip reel_SOURCE.mp4 -d source
          ls -lh source/reel_SOURCE.mp4

      - name: Prepare FFmpeg
        shell: bash
        run: |
          mkdir -p vendor bin
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target vendor imageio-ffmpeg==0.6.0
          FFMPEG_EXE=$(PYTHONPATH=vendor python3 - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
          ln -sf "$FFMPEG_EXE" bin/ffmpeg

      - name: Encode compact combined MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverable
          bin/ffmpeg -nostdin -y -v error -i source/reel_SOURCE.mp4 \
            -vf 'scale=960:540:flags=lanczos,fps=30000/1001' \
            -c:v libx264 -preset ultrafast -b:v 1000k -maxrate 1100k -bufsize 2200k \
            -profile:v high -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart \
            deliverable/Kevin_Durant_Top10_Hybrid_All_Camera_Angles.mp4
          ls -lh deliverable/*.mp4

      - name: Upload deliverable
        uses: actions/upload-artifact@v4
        with:
          name: kd-top10-all-angles-delivery-${{ github.run_id }}
          path: deliverable/*.mp4
          retention-days: 1
          compression-level: 0

name: Adams Jazz v32t epipolar-selected Broadcast MHR solve

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v32t_epipolar_broadcast_mhr.py'
      - '.github/workflows/adams-jazz-v32t-epipolar-broadcast-mhr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  epipolar-broadcast-mhr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install observation and MHR runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1' 'pymomentum-core>=0.1.111' 'git+https://github.com/facebookresearch/MHR.git'
      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507
      - name: Run v32t epipolar Broadcast solve
        shell: bash
        run: |
          set +e
          mkdir -p v32t work_v32t
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v32t_epipolar_broadcast_mhr \
            --b32-root inputs_b32 --work work_v32t --out v32t --max-nfev 320 2>&1 | tee v32t/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32t/solver_exit_code.txt
          exit 0
      - name: Print v32t diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          for n in ('v32t_epipolar_selection_audit.json','v32t_qa.json'):
              p=pathlib.Path('v32t')/n
              if not p.exists(): continue
              q=json.load(open(p)); print(n)
              if n.startswith('v32t_epipolar'):
                  keys=['retained_body_joint_count','retained_body_joints','selected_source_counts','broadcast_temporal_anchor_summary']
              else:
                  keys=['status','per_camera_reprojection','left_best_validation','gate','v32t_base_exit_code']
              print(json.dumps({k:q.get(k) for k in keys},indent=2))
          PY
      - name: Package v32t evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32t/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32t_epipolar_broadcast_mhr.zip ./*)
      - name: Upload v32t evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32t-epipolar-broadcast-mhr-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce fail-closed v32t gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32t/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

name: Probe NBA api-hub Stats Events
on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - analysis/probe_nba_api_hub_stats_events.py
      - .github/workflows/probe-nba-api-hub-stats-events.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u analysis/probe_nba_api_hub_stats_events.py

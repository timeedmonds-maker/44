name: Adams Jazz projection-aware apex selector v3

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/select_jazz_ball_apex_multiview_v3.py'
      - '.github/workflows/adams-jazz-apex-selector-v3.yml'
  workflow_dispatch:

jobs:
  apex-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install lightweight vision runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests

      - name: Retrieve 12 official native Jazz dunk angles
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out jazz_dunk_source --workers 8

      - name: Solve common audio timeline and impact
        run: |
          mkdir -p jazz_apex_v3
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path('jazz_dunk_source/clips').glob('*_489_*_SOURCE.mp4')):
              m=re.search(r'_489_(.+)_SOURCE\.mp4$',p.name)
              if m: rows.append({'label':m.group(1).replace('_',' '),'file':p.name,'freeze_time':9.57658})
          if len(rows)!=12: raise RuntimeError(f'Expected 12 angles, found {len(rows)}')
          cfg={'event':{'game_id':'0022500301','event_id':489},'source_fps':29.97003,'reference_angle':'Left Above Rim','angles':rows}
          Path('jazz_apex_v3/provisional_sync_map.json').write_text(json.dumps(cfg,indent=2))
          PY
          python freeze_spin/estimate_audio_sync_graph.py \
            --config jazz_apex_v3/provisional_sync_map.json \
            --clips jazz_dunk_source/clips \
            --reference 'Left Above Rim' --max-lag-seconds 2.0 \
            --out jazz_apex_v3/audio_sync_graph.json
          python freeze_spin/refine_jazz_predunk_audio_impact_v2.py \
            --clips jazz_dunk_source/clips \
            --sync jazz_apex_v3/audio_sync_graph.json \
            --config jazz_apex_v3/provisional_sync_map.json \
            --pre-impact-seconds 0.12 \
            --out jazz_apex_v3/audio_impact_bound.json

      - name: Select apex with projection-aware local consensus
        id: apex
        continue-on-error: true
        run: |
          python freeze_spin/select_jazz_ball_apex_multiview_v3.py \
            --clips jazz_dunk_source/clips \
            --sync jazz_apex_v3/audio_sync_graph.json \
            --impact-json jazz_apex_v3/audio_impact_bound.json \
            --out jazz_apex_v3

      - name: Print decisive diagnostics
        if: always()
        run: |
          echo '--- projection-aware apex diagnostics ---'
          cat jazz_apex_v3/multiview_apex_selection_v3.json || true

      - name: Enforce apex gate
        run: |
          python - <<'PY'
          import json
          p='jazz_apex_v3/multiview_apex_selection_v3.json'
          d=json.load(open(p))
          if not d.get('passed'):
              raise SystemExit('APEX_V3_GATE_FAILED: '+str(d.get('reason','projection-aware gate false')))
          print('APEX_V3_GATE_PASS', d['apex_reference_time'], d['height_apex_consensus_labels'], d['ball_track_confirmation_count'])
          PY

      - name: Upload apex diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-apex-selector-v3-${{ github.run_id }}
          path: |
            jazz_apex_v3/multiview_apex_selection_v3.json
            jazz_apex_v3/audio_impact_bound.json
            jazz_apex_v3/audio_sync_graph.json
            jazz_dunk_source/qa.json
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

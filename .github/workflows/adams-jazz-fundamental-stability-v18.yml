name: Adams Jazz depth-free geometry diagnostic v18

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/diagnose_fundamental_stability_v18.py'
      - '.github/workflows/adams-jazz-fundamental-stability-v18.yml'
  workflow_dispatch:

jobs:
  fundamental-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install depth-free vision runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Retrieve accepted-apex locked frames from v16
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-reciprocal-camera-freeview-v16-33590681203
          path: v16_artifact
          github-token: ${{ github.token }}
          run-id: 33590681203

      - name: Run depth-free correspondence geometry diagnostic
        run: |
          python freeze_spin/diagnose_fundamental_stability_v18.py \
            --locked-dir v16_artifact \
            --out jazz_geometry_v18 \
            --reference 'In Arena' \
            --targets 'Broadcast' 'Other Broadcast' 'Right Above Rim'

      - name: Print geometry verdicts
        run: |
          python - <<'PY'
          import json
          q=json.load(open('jazz_geometry_v18/fundamental_stability_v18.json'))
          for label,row in q['results'].items():
              print('GEOMETRY_QA',label,json.dumps(row,indent=2))
          b=q['results']['Broadcast']
          r=q['results']['Right Above Rim']
          if not b.get('correspondence_geometry_passed'):
              raise SystemExit('Broadcast positive-control correspondence geometry failed')
          print('RAR_PROJECTIVE_GEOMETRY_SUPPORTED',bool(r.get('passed')))
          print('RAR_EPIPOLAR_STABLE',bool(r.get('correspondence_geometry_passed')))
          print('RAR_NONPLANAR_EVIDENCE',bool(r.get('nonplanar_evidence_passed')))
          if r.get('passed'):
              print('NEXT_DECISION','Wide-baseline correspondences are usable; next solve metric intrinsics/extrinsics from known court/basket geometry and triangulated real features, not independent MoGe clouds.')
          elif r.get('correspondence_geometry_passed'):
              print('NEXT_DECISION','Correspondences are stable but too homography-dominated for translation/depth; add metric arena landmarks before using this camera.')
          else:
              print('NEXT_DECISION','Current SIFT correspondence set is not strong enough; move to learned wide-baseline matching under the same projective gates.')
          PY

      - name: Package depth-free diagnostic
        if: always()
        run: |
          mkdir -p delivery
          cp jazz_geometry_v18/fundamental_stability_v18.json delivery/ 2>/dev/null || true
          cp v16_artifact/In_Arena_apex.png delivery/ 2>/dev/null || true
          cp v16_artifact/Broadcast_apex.png delivery/ 2>/dev/null || true
          cp v16_artifact/Other_Broadcast_apex.png delivery/ 2>/dev/null || true
          cp v16_artifact/Right_Above_Rim_apex.png delivery/ 2>/dev/null || true

      - name: Upload depth-free diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-depth-free-geometry-v18-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Multi-angle basketball camera calibration POC

on:
  workflow_dispatch:
  push:
    paths:
      - "freeze_spin/prepare_kalicalib_inputs.py"
      - "freeze_spin/validate_kalicalib_predictions.py"
      - "freeze_spin/nba_geometry.py"
      - "freeze_spin/build_plane_sweep_static_test.py"
      - ".github/workflows/multi-angle-camera-calibration-poc.yml"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install NBA video runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Retrieve all validated native angles
        run: |
          python build_kd_top10_all_angles.py \
            --request freeze_spin/sidy_cissoko_request.json \
            --out source_output \
            --workers 8

      - name: Solve global audio synchronization
        run: |
          python freeze_spin/estimate_audio_sync_graph.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --clips source_output/clips \
            --out diagnostics/audio_sync_graph.json
          python freeze_spin/export_contact_windows.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --sync diagnostics/audio_sync_graph.json \
            --clips source_output/clips \
            --before 0.50 --after 1.10 \
            --out contact_windows

      - name: Prepare corrected impact frames
        run: |
          python freeze_spin/prepare_kalicalib_inputs.py \
            --windows contact_windows \
            --out kalicalib_input

      - name: Install and patch frozen KaliCalib CPU stack
        run: |
          git clone --depth 1 https://github.com/CEA-LIST/KaliCalib.git kalicalib_repo
          python -m pip install 'torch==2.6.0+cpu' 'torchvision==0.21.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'deepsport-utilities==4.0.9' --no-deps
          python -m pip install \
            numpy==1.26.4 \
            scipy==1.12.0 \
            opencv-python==4.10.0.84 \
            opencv-python-headless==4.10.0.84 \
            scikit-image==0.22.0 \
            tifffile==2024.2.12 \
            imageio==2.34.0 \
            matplotlib==3.8.4 \
            shapely==2.0.4 \
            m3u8==4.0.0 \
            calib3d==2.13.0 \
            mlworkflow==0.6.0 \
            python-dotenv==1.0.1 \
            aleatorpy==0.3.0 \
            tqdm==4.66.5 \
            yacs==0.1.8 \
            pytorch-ignite==0.4.13
          python - <<'PY'
          from pathlib import Path
          import site
          import numpy as np
          import scipy
          import cv2

          print('NUMERICAL STACK', np.__version__, scipy.__version__, cv2.__version__)
          assert np.__version__ == '1.26.4'
          assert scipy.__version__.startswith('1.12.')

          candidates = [Path(site.getusersitepackages()), *map(Path, site.getsitepackages())]
          target = next((p / 'deepsport_utilities' / 'utils.py' for p in candidates if (p / 'deepsport_utilities' / 'utils.py').exists()), None)
          if target is None:
              raise RuntimeError('Could not locate deepsport_utilities/utils.py')
          text = target.read_text(encoding='utf-8')
          old = "color_cycle_rgb = list(map(lambda color: list(map(lambda c: int(c, 16), [color[1:3], color[3:5], color[5:7]])), color_cycle))"
          new = "color_cycle_rgb = [([int(color[1:3],16), int(color[3:5],16), int(color[5:7],16)] if isinstance(color,str) and color.startswith('#') else [int(round(float(c)*255)) if float(c) <= 1 else int(round(float(c))) for c in color[:3]]) for color in color_cycle]"
          if old in text:
              target.write_text(text.replace(old, new), encoding='utf-8')
              print('PATCHED color cycle', target)
          from deepsport_utilities.utils import Subset, SubsetType
          from scipy.spatial import ConvexHull
          print('DeepSport + SciPy API OK', Subset, SubsetType, ConvexHull)

          evaluator = Path('kalicalib_repo/tools/evaluate_net.py')
          source = evaluator.read_text(encoding='utf-8')
          needle = 'model.load_state_dict(torch.load(cfg.TEST.WEIGHT))'
          replacement = "model.load_state_dict(torch.load(cfg.TEST.WEIGHT, map_location=torch.device(cfg.MODEL.DEVICE)))"
          if needle not in source:
              raise RuntimeError('Expected KaliCalib checkpoint load line not found')
          evaluator.write_text(source.replace(needle, replacement), encoding='utf-8')
          print('PATCHED CPU checkpoint loading', evaluator)
          PY

      - name: Run KaliCalib challenge model on NBA impact views
        run: |
          mkdir -p kalicalib_repo/CHALLENGE
          cp kalicalib_input/[0-9]*.png kalicalib_repo/CHALLENGE/
          cd kalicalib_repo
          python tools/evaluate_net.py \
            --config_file configs/eval_challenge.yml \
            MODEL.DEVICE cpu \
            DATALOADER.NUM_WORKERS 0

      - name: Validate predicted camera geometry
        run: |
          python -m freeze_spin.validate_kalicalib_predictions \
            --predictions kalicalib_repo/predictions.json \
            --mapping kalicalib_input/mapping.json \
            --images kalicalib_input \
            --out calibration_qa

      - name: Build no-blur calibrated static 3D orbit test
        run: |
          python freeze_spin/build_plane_sweep_static_test.py \
            --predictions kalicalib_repo/predictions.json \
            --mapping kalicalib_input/mapping.json \
            --images kalicalib_input \
            --out static_reconstruction \
            --stride 2 \
            --depth-steps 88

      - name: Package calibration and reconstruction diagnostics
        if: always()
        run: |
          mkdir -p calibration_delivery
          cp kalicalib_input/mapping.json calibration_delivery/input_mapping.json
          cp diagnostics/audio_sync_graph.json calibration_delivery/audio_sync_graph.json
          if [ -f kalicalib_repo/predictions.json ]; then cp kalicalib_repo/predictions.json calibration_delivery/kalicalib_predictions.json; fi
          if [ -d kalicalib_repo/output/evaluation_images ]; then cp -R kalicalib_repo/output/evaluation_images calibration_delivery/; fi
          if [ -d calibration_qa ]; then cp -R calibration_qa calibration_delivery/; fi
          if [ -d static_reconstruction ]; then cp -R static_reconstruction calibration_delivery/; fi
          cp kalicalib_input/[0-9]*.png calibration_delivery/

      - name: Upload calibration experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidy-cissoko-calibrated-static-orbit-${{ github.run_id }}
          path: calibration_delivery/
          retention-days: 14
          if-no-files-found: error

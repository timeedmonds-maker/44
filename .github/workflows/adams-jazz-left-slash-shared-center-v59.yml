name: Adams Jazz Left Slash shared centre v59

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json'
      - '.github/workflows/adams-jazz-left-slash-shared-center-v59.yml'
      - 'freeze_spin/prove_game_camera_center_from_transfer_v1.py'
  pull_request:
    branches: [main]
    paths:
      - 'freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json'
      - '.github/workflows/adams-jazz-left-slash-shared-center-v59.yml'
      - 'freeze_spin/prove_game_camera_center_from_transfer_v1.py'

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic metric runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84

      - name: Recover immutable Frame C chooser artifact
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692

      - name: Recover successful Left Slash v58a same-game scan
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-left-slash-same-game-scan-v58a-33731421560
          path: v58a
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33731421560

      - name: Verify immutable target and prepare static source samples
        run: |
          test -f frame_c/G_Left_Slash_8.868843s_frame0266.png
          echo 'a1ba9df27411397982d93361508977b7ff611bc29687f27dff8ad3becb5be255  frame_c/G_Left_Slash_8.868843s_frame0266.png' | sha256sum -c - || {
            echo 'Target hash differs from preflight; printing actual and failing closed.'
            sha256sum frame_c/G_Left_Slash_8.868843s_frame0266.png
            exit 1
          }
          mkdir -p samples
          python - <<'PY'
          from pathlib import Path
          count=0
          for event in (25,55,65,75,85,95):
              d=Path('v58a')/f'event_{event}_frames'
              if not d.is_dir():
                  continue
              for i,p in enumerate(sorted(d.glob('f*.png'))):
                  out=Path('samples')/f'Left_Slash__event{event:04d}__s{i}.png'
                  out.write_bytes(p.read_bytes())
                  count += 1
          assert count >= 36, count
          print('prepared',count,'native samples')
          PY

      - name: Prove shared physical centre from independent static events
        id: proof
        continue-on-error: true
        run: |
          python -m freeze_spin.prove_game_camera_center_from_transfer_v1 \
            --target-frame frame_c/G_Left_Slash_8.868843s_frame0266.png \
            --target-landmarks freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json \
            --camera-label 'Left Slash' \
            --samples samples \
            --out v59 \
            --max-landmark-rmse-px 3.0 \
            --max-center-pairwise-cm 10.0 \
            --max-half-pixel-center-shift-cm 10.0 \
            --min-independent-events 4 \
            --perturbation-trials 24

      - name: Package all v59 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v59/*.json delivery/ 2>/dev/null || true
          cp v59/*.png delivery/ 2>/dev/null || true
          cp freeze_spin/adams_jazz_left_slash_frame_c_metric_v59.json delivery/
          cp frame_c/G_Left_Slash_8.868843s_frame0266.png delivery/

      - name: Upload v59 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-left-slash-shared-center-v59-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed v59 verdict
        if: always()
        run: |
          test -f v59/game_camera_center_proof_v1.json
          python - <<'PY'
          import json
          q=json.load(open('v59/game_camera_center_proof_v1.json'))
          assert q['status']=='PASS_CENTER_PRIOR', q['status']
          assert q['center_prior_allowed'] is True
          assert q['metric_camera_promotion_allowed'] is False
          assert q['replay_render_allowed'] is False
          assert all(q['gates'].values()), q['gates']
          PY

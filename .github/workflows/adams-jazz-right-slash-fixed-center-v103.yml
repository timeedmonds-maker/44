name: Adams Jazz Right Slash fixed centre v103

on:
  workflow_dispatch:
  push:
    branches: [codex/right-slash-v101-execution]
    paths:
      - '.github/workflows/adams-jazz-right-slash-fixed-center-v103.yml'
      - 'freeze_spin/prove_right_slash_fixed_center_graph_v103.py'

jobs:
  fixed-center-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install projective runtime
        run: python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Recover immutable v101 distributed geometry bank
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-slash-adaptive-geometry-v101-34009445346
          path: right_slash_v101
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: timeedmonds-maker/44
          run-id: 34009445346

      - name: Recover fail-closed v102 prerequisite
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-slash-fixed-center-v102-34010087482
          path: right_slash_v102
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: timeedmonds-maker/44
          run-id: 34010087482

      - name: Prove corrected fixed-centre graph
        run: |
          python -m freeze_spin.prove_right_slash_fixed_center_graph_v103 \
            --v101-root right_slash_v101 \
            --v102-report right_slash_v102/right_slash_distributed_fixed_center_v102.json \
            --out right_slash_v103

      - name: Enforce acquisition-to-metric semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('right_slash_v103/right_slash_fixed_center_graph_v103.json').read_text())
          assert p['status']=='PASS_RIGHT_SLASH_FIXED_CENTER_GRAPH_V103'
          assert p['permissions']['shared_center_metric_attempt_allowed'] is True
          assert p['permissions']['right_slash_metric_camera_allowed'] is False
          assert p['permissions']['replay_render_allowed'] is False
          print('V103 PASS; metric shared-centre attempt is now authorized.')
          PY

      - name: Upload v103 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-fixed-center-v103-${{ github.run_id }}
          path: right_slash_v103/
          retention-days: 14
          if-no-files-found: error

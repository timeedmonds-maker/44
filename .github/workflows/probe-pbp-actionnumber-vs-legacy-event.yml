name: Probe PBP actionNumber vs legacy event ID

on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - '.github/workflows/probe-pbp-actionnumber-vs-legacy-event.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adams-westbrook-hls-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install curl_cffi
      - name: Compare current PBP actionNumber 21 with legacy event 215
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from curl_cffi import requests

          s=requests.Session(impersonate='chrome')
          s.headers.update({'Referer':'https://www.nba.com/','Origin':'https://www.nba.com'})
          game='0041800163'
          out=[]
          for ev in [21,215]:
              url=f'https://stats.nba.com/stats/videoeventsasset?GameID={game}&GameEventID={ev}'
              try:
                  r=s.get(url,timeout=20)
                  out.append(f'\n=== EVENT {ev} ===\nURL {url}\nHTTP {r.status_code} bytes={len(r.content)}')
                  data=r.json() if r.status_code==200 else {}
                  out.append(json.dumps(data, indent=2)[:12000])
                  rs=data.get('resultSets',{}) if isinstance(data,dict) else {}
                  plist=rs.get('playlist') or []
                  vus=((rs.get('Meta') or {}).get('videoUrls') or [])
                  if plist: out.append('DESC='+str(plist[0].get('dsc')))
                  for i,v in enumerate(vus[:2]):
                      for k in ['lurl','murl','surl']:
                          media=v.get(k)
                          if not media: continue
                          try:
                              rr=s.get(media,timeout=30,allow_redirects=True)
                              out.append(f'MEDIA {ev} {i} {k} http={rr.status_code} bytes={len(rr.content)} final={rr.url} sha256={hashlib.sha256(rr.content).hexdigest()} type={rr.headers.get("content-type")}')
                          except Exception as e:
                              out.append(f'MEDIA_ERR {ev} {i} {k} {e}')
              except Exception as e:
                  out.append(f'ERROR event={ev} {e}')
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/pbp_actionnumber_vs_legacy_event.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/pbp_actionnumber_vs_legacy_event.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record PBP actionNumber versus legacy event probe'
            git push origin HEAD:codex/adams-westbrook-hls-final
          fi

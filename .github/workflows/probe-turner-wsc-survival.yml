name: Probe Turner WSC survival

on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - '.github/workflows/probe-turner-wsc-survival.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adams-westbrook-hls-final
      - name: Probe known historical WSC objects
        shell: bash
        run: |
          set -u
          mkdir -p analysis
          result='analysis/turner_wsc_survival_result.txt'
          : > "$result"
          urls=(
            'https://ssl.cdn.turner.com/nba/big/nba/wsc/2019/04/14/574d0faf-b0fc-fcfe-8ef2-96b4fb4c561e.nba_3677698_1280x720_3500.mp4'
            'https://ssl.cdn.turner.com/nba/big/nba/wsc/2019/04/14/f12a16bb-c684-3c9f-9540-2f9a9e5981ba.nba_3678039_1920x1080_5904.mp4'
            'https://ssl.cdn.turner.com/nba/big/nba/wsc/2019/04/11/3d698a32-b385-326e-ce38-e8f8adc76495.nba_3665376_1920x1080_5904.mp4'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            out="/tmp/wsc_${i}.bin"
            headers="/tmp/h_${i}.txt"
            echo "=== PROBE $i ===" | tee -a "$result"
            echo "$url" | tee -a "$result"
            metrics=$(curl -L --connect-timeout 10 --max-time 45 -r 0-1048575 -sS -D "$headers" -o "$out" -w 'http=%{http_code} size=%{size_download} final=%{url_effective} type=%{content_type}' "$url" 2>&1 || true)
            echo "$metrics" | tee -a "$result"
            sed -n '1,25p' "$headers" | tee -a "$result" || true
            if [ -f "$out" ]; then
              file "$out" | tee -a "$result" || true
              shasum -a 256 "$out" | tee -a "$result" || true
              stat -f 'bytes=%z' "$out" | tee -a "$result" || true
              printf 'magic=' | tee -a "$result"
              head -c 16 "$out" | xxd -p | tr -d '\n' | tee -a "$result"
              echo | tee -a "$result"
            fi
          done
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/turner_wsc_survival_result.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Turner WSC survival probe result'
            git push origin HEAD:codex/adams-westbrook-hls-final
          fi

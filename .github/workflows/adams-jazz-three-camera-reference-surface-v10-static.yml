name: Adams Jazz three-camera reference surface v10 static

on:
  push:
    branches: [codex/three-camera-volumetric-v8-run]
    paths:
      - 'freeze_spin/build_three_camera_reference_surface_v10.py'
      - '.github/workflows/adams-jazz-three-camera-reference-surface-v10-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests pillow
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
      - name: Verify v10 imports
        run: PYTHONPATH=.:freeze_spin python -c "import freeze_spin.build_three_camera_reference_surface_v10; print('V10_IMPORT_OK')"
      - name: Retrieve Jazz event 489 native source angles
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py --request freeze_spin/adams_jazz_dunk_request.json --out target_source --workers 8
          python freeze_spin/prepare_locked_frame_c_sources.py --clips target_source/clips --out frame_c_target
          find frame_c_target/frames -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort
      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs_v73
          gh run download 33911842169 --repo timeedmonds-maker/44 --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 --dir inputs_v73
          test -f inputs_v73/right_above_rim_metric_camera_v73.json
      - name: Render six virtual test viewpoints
        run: |
          mkdir -p v10_static
          BCAST="$(find frame_c_target/frames -type f -name 'A_Broadcast*.png' | head -n 1)"
          PYTHONPATH=.:freeze_spin python -u -m freeze_spin.build_three_camera_reference_surface_v10 \
            --frames-dir frame_c_target/frames \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out v10_static --tokens 1200 --voxel-cm 4.0 | tee v10_static/render.log
      - name: Build static montage and hard QA gate
        run: |
          cp v10_static/frame_000.png v10_static/v10_00deg.png
          cp v10_static/frame_001.png v10_static/v10_05deg.png
          cp v10_static/frame_002.png v10_static/v10_10deg.png
          cp v10_static/frame_003.png v10_static/v10_15deg.png
          cp v10_static/frame_004.png v10_static/v10_20deg.png
          cp v10_static/frame_005.png v10_static/v10_25deg.png
          python - <<'PY'
          import json
          from PIL import Image
          q=json.load(open('v10_static/three_camera_reference_surface_v10_qa.json'))
          names=['v10_00deg.png','v10_05deg.png','v10_10deg.png','v10_15deg.png','v10_20deg.png','v10_25deg.png']
          ims=[Image.open('v10_static/'+n).convert('RGB') for n in names]
          c=Image.new('RGB',(ims[0].width*3,ims[0].height*2))
          for i,im in enumerate(ims): c.paste(im,((i%3)*im.width,(i//3)*im.height))
          c.save('v10_static/v10_key_arc_montage.png')
          print(json.dumps(q['gates'],indent=2))
          if not all(q['gates'][k] for k in ('zero_degree_iou_pass','broadcast_support_pass','ball_pass')):
              raise SystemExit('V10_NUMERIC_GATE_FAILED')
          PY
      - name: Package proof
        if: always()
        run: |
          mkdir -p delivery
          cp v10_static/*.png delivery/ 2>/dev/null || true
          cp v10_static/*.json delivery/ 2>/dev/null || true
          cp v10_static/render.log delivery/ 2>/dev/null || true
          cp frame_c_target/frames/K_Left_Above_Rim*.png delivery/ 2>/dev/null || true
          cp frame_c_target/frames/A_Broadcast*.png delivery/ 2>/dev/null || true
          cp frame_c_target/frames/L_Right_Above_Rim*.png delivery/ 2>/dev/null || true
          touch delivery/_artifact_present
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-reference-surface-v10-static-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Adams Jazz v33i RAR-anchored native free-view

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_v33i_rar_anchored_native_freeview.py'
      - 'freeze_spin/run_v33i_rar_anchored_native_freeview.py'
      - '.github/workflows/adams-jazz-v33i-rar-native-freeview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-freeview:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      V33H_RUN: '34731524073'
      V33H_ARTIFACT: 'adams-jazz-v33h-contact-ball-qa-34731524073'
    steps:
      - uses: actions/checkout@v4

      - name: Install native deterministic render runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet numpy scipy opencv-python-headless pillow
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Wait for visually-inspectable v33h numerical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v33h
          found=0
          for i in $(seq 1 80); do
            if gh api "repos/timeedmonds-maker/44/actions/runs/${V33H_RUN}/artifacts" --jq '.artifacts[].name' 2>/dev/null | grep -Fx "$V33H_ARTIFACT"; then
              found=1
              break
            fi
            sleep 15
          done
          test "$found" = 1
          gh run download "$V33H_RUN" --repo timeedmonds-maker/44 --name "$V33H_ARTIFACT" --dir inputs_v33h
          test -s inputs_v33h/v33h_contact_ball_qa.json
          test -s inputs_v33h/v33h_render_state.json
          test -s inputs_v33h/v33h_source_Right_Above_Rim.png
          python - <<'PY'
          import json
          q=json.load(open('inputs_v33h/v33h_contact_ball_qa.json'))
          assert q['status']=='PASS_V33H_CONTACT_BALL_AWAITING_VISUAL_QA'
          assert q['render_numerically_eligible'] is True
          assert q['camera_lock']==['Left Above Rim','Right Above Rim','Broadcast']
          assert q['native_resolution']==[960,540]
          print('V33H_NUMERICAL_INPUT_READY')
          PY

      - name: Render small RAR-anchored native free-view arc
        shell: bash
        run: |
          set +e
          mkdir -p v33i
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v33i_rar_anchored_native_freeview \
            --state inputs_v33h/v33h_render_state.json \
            --sources inputs_v33h \
            --out v33i \
            --frames 49 \
            --max-degree 12 \
            --tokens 900 2>&1 | tee v33i/render.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v33i/render_exit_code.txt
          exit 0

      - name: Build native motion proof MP4
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v33i/render_exit_code.txt 2>/dev/null || echo 99)" = "0"
          test -s v33i/v33i_render_qa.json
          ffmpeg -y -v error -framerate 30 -i v33i/motion_%03d.png \
            -vf 'format=yuv420p' -c:v libx264 -crf 16 -preset medium -movflags +faststart \
            v33i/adams_jazz_v33i_rar_native_freeview.mp4
          test -s v33i/adams_jazz_v33i_rar_native_freeview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate \
            -of default=nw=1 v33i/adams_jazz_v33i_rar_native_freeview.mp4 | tee v33i/ffprobe.txt
          grep -q '^width=960$' v33i/ffprobe.txt
          grep -q '^height=540$' v33i/ffprobe.txt

      - name: Package v33i visual QA evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v33i/render.log delivery/ 2>/dev/null || true
          cp v33i/render_exit_code.txt delivery/ 2>/dev/null || true
          cp v33i/ffprobe.txt delivery/ 2>/dev/null || true
          cp v33i/v33i_render_qa.json delivery/ 2>/dev/null || true
          cp v33i/v33i_static_arc_montage.png delivery/ 2>/dev/null || true
          cp v33i/v33i_*deg.png delivery/ 2>/dev/null || true
          cp v33i/v33i_ball_source_crop.png delivery/ 2>/dev/null || true
          cp v33i/v33i_ball_source_alpha.png delivery/ 2>/dev/null || true
          cp v33i/adams_jazz_v33i_rar_native_freeview.mp4 delivery/ 2>/dev/null || true
          cp inputs_v33h/v33h_three_camera_contact_ball_montage.png delivery/ 2>/dev/null || true
          cp inputs_v33h/v33h_contact_ball_qa.json delivery/ 2>/dev/null || true
          test -s delivery/v33i_render_qa.json
          (cd delivery && zip -0 adams_jazz_v33i_rar_native_freeview_package.zip ./*)

      - name: Upload v33i visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v33i-rar-native-freeview-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce deterministic render execution only
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v33i/render_exit_code.txt 2>/dev/null || echo 99)" = "0"
          test -s v33i/adams_jazz_v33i_rar_native_freeview.mp4

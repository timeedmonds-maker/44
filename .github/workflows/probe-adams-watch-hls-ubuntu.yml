name: Probe archived Adams HLS on Ubuntu
on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - .github/workflows/probe-adams-watch-hls-ubuntu.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install curl_cffi
      - name: Probe actual HLS bytes
        shell: python
        run: |
          from curl_cffi import requests
          import urllib.parse,re,hashlib,subprocess,os,tempfile
          U='http://vsppvmproda1.cloudapp.net:5555/shls/NBA_E03503130405E830BD3AFC12D0853E7DFEFA7372.nba_2573663_1920x1080_5904/index.m3u8?device=v2_mdrm_sa_reach_hd_enc'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://www.nba.com/watch/video/adams-for-the-slam-in-the-second-quarter','Origin':'https://www.nba.com','Accept':'*/*'}
          s=requests.Session(impersonate='chrome120')
          good=None
          for u in [U,U.replace('http://','https://')]:
              try:
                  r=s.get(u,headers=H,timeout=20,allow_redirects=True)
                  print('PLAYLIST',u[:80],r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
                  print(r.text[:6000],flush=True)
                  if r.status_code==200 and '#EXTM3U' in r.text: good=(r.url,r.text); break
              except Exception as e: print('ERR',type(e).__name__,str(e)[:300],flush=True)
          if not good: raise SystemExit('NO_PLAYLIST')
          url,text=good
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          vs=[]
          for i,x in enumerate(lines[:-1]):
              if x.startswith('#EXT-X-STREAM-INF'):
                  m=re.search(r'BANDWIDTH=(\d+)',x); vs.append((int(m.group(1)) if m else 0,lines[i+1]))
          if vs:
              _,v=max(vs); url=urllib.parse.urljoin(url,v)
              r=s.get(url,headers=H,timeout=20,allow_redirects=True); print('VARIANT',r.status_code,len(r.content),r.url,flush=True); print(r.text[:8000],flush=True)
              if r.status_code!=200: raise SystemExit('VARIANT_FAIL')
              url,text=r.url,r.text
          seg=[urllib.parse.urljoin(url,x.strip()) for x in text.splitlines() if x.strip() and not x.strip().startswith('#')]
          print('SEGCOUNT',len(seg),flush=True)
          for i,u in enumerate(seg[:3]):
              r=s.get(u,headers=H,timeout=25,allow_redirects=True)
              print('SEG',i,r.status_code,r.headers.get('content-type'),len(r.content),hashlib.sha256(r.content).hexdigest(),r.url,flush=True)
          out='/tmp/adams.mp4'
          p=subprocess.run(['ffmpeg','-y','-headers','Referer: https://www.nba.com/watch/video/adams-for-the-slam-in-the-second-quarter\r\nUser-Agent: '+UA+'\r\n','-i',url,'-t','23','-c','copy',out],capture_output=True,text=True,timeout=80)
          print('FFMPEG',p.returncode,p.stderr[-5000:],flush=True)
          if p.returncode or not os.path.exists(out): raise SystemExit('FFMPEG_FAIL')
          d=open(out,'rb').read(); print('MP4',len(d),hashlib.sha256(d).hexdigest(),flush=True)
          q=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_name,codec_type,width,height,avg_frame_rate','-of','json',out],capture_output=True,text=True,timeout=20)
          print('FFPROBE',q.stdout,flush=True)
          os.makedirs('out',exist_ok=True); import shutil; shutil.copy2(out,'out/adams_game3_real.mp4')
          for t in ['2','10','18']:
              f=f'out/frame_{t}.jpg'; subprocess.run(['ffmpeg','-y','-ss',t,'-i',out,'-frames:v','1','-q:v','2',f],capture_output=True,text=True,timeout=20)
      - uses: actions/upload-artifact@v4
        with:
          name: adams-game3-real-hls-ubuntu
          path: out/
          if-no-files-found: error

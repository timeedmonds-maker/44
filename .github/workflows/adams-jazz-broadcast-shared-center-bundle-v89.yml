name: Adams Jazz Broadcast shared-center bundle v89

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/solve_broadcast_shared_center_bundle_v89.py'
      - '.github/workflows/adams-jazz-broadcast-shared-center-bundle-v89.yml'

permissions:
  contents: read
  actions: read

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install bundle-calibration runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.14.1 opencv-python-headless==4.10.0.84

      - name: Recover immutable synchronized Frame C target
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692

      - name: Recover same-game Broadcast optical-state evidence
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-broadcast-state-mining-v80-33946057264
          path: state_mining
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33946057264

      - name: Verify immutable evidence provenance
        run: |
          test -f frame_c/A_Broadcast_9.194613s_frame0276.png
          echo '7cd80d1c24c9eefa025e50a55a7cf6cdc3d64ea1ac168ff66bb7aadb307d5b3c  frame_c/A_Broadcast_9.194613s_frame0276.png' | sha256sum -c -
          test -f state_mining/same_game_physical_state_mining_v1.json
          test -d state_mining/selected_frames
          test "$(find state_mining/selected_frames -name '*.png' | wc -l)" -ge 8

      - name: Solve shared physical Broadcast centre across PTZ states
        run: |
          python -m freeze_spin.solve_broadcast_shared_center_bundle_v89 \
            --frame frame_c/A_Broadcast_9.194613s_frame0276.png \
            --floor freeze_spin/adams_jazz_frame_c_broadcast_floor_v86.json \
            --target-lines freeze_spin/adams_jazz_broadcast_target_lines_v87.json \
            --rim freeze_spin/adams_jazz_broadcast_rim_v88.json \
            --states-json state_mining/same_game_physical_state_mining_v1.json \
            --states-dir state_mining/selected_frames \
            --perturbation-trials 64 \
            --out broadcast_bundle_v89

      - name: Summarize v89 without weakening gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('broadcast_bundle_v89/broadcast_shared_center_bundle_v89.json').read_text())
          print('V89_STATUS',p['status'])
          print('V89_ACCEPTED_STATE_COUNT',p.get('accepted_state_count',len(p.get('accepted_same_center_states',[]))))
          if 'camera_candidate' in p:
              print('V89_CAMERA',p['camera_candidate'])
              print('V89_NOMINAL',p['nominal'])
              print('V89_PERTURB',p['half_pixel_bundle_perturbation'])
              print('V89_GATES',p['gates'])
          assert p['status'] in {
              'PASS_BROADCAST_SHARED_CENTER_BUNDLE_V89',
              'FAIL_CLOSED_BROADCAST_SHARED_CENTER_BUNDLE_V89',
              'FAIL_CLOSED_INSUFFICIENT_SHARED_CENTER_STATES_V89',
          }
          PY

      - name: Package v89 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp broadcast_bundle_v89/broadcast_shared_center_bundle_v89.json delivery/ 2>/dev/null || true
          cp frame_c/A_Broadcast_9.194613s_frame0276.png delivery/ 2>/dev/null || true
          cp state_mining/top_state_candidates_montage.png delivery/ 2>/dev/null || true

      - name: Upload v89 bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-broadcast-shared-center-v89-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Adams Jazz three-camera focal subject v22

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v22.py'
      - '.github/workflows/adams-jazz-three-camera-focal-subject-v22.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-focal-subject-v22:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision; print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve v11 exact-state evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11 three_camera_v22
          gh run download 34535691949 --repo timeedmonds-maker/44 --name adams-jazz-three-camera-exact-sync-v11-34535691949 --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json

      - name: Retrieve accepted Right Above Rim v73 metric report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 --repo timeedmonds-maker/44 --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render focal-locked native three-camera proof
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v22 \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v22 --tokens 900 --voxel-cm 2.5 \
            2>&1 | tee three_camera_v22/render.log

      - name: Assert focal subject survives every novel view
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, cv2
          from pathlib import Path
          r=Path('three_camera_v22'); q=json.load(open(r/'three_camera_mesh_v12_qa.json'))
          d=q['v22_focal_subject']
          assert d['resolution']==[960,540]
          assert d['upscale'] is False and d['uhd'] is False and d['generated_texture'] is False
          assert d['accepted_focal_mesh_count']==1, d
          assert set(d['accepted_focal_mesh_views'])=={'Left Above Rim','Broadcast','Right Above Rim'}, d['accepted_focal_mesh_views']
          rows={int(x['angle_deg']):x for x in d['visibility_by_angle']}
          for a in (0,5,10,15,20,25):
              assert rows[a]['projected_silhouette_pixels'] >= 550, rows[a]
              assert rows[a]['projected_bbox_height_px'] >= 45, rows[a]
              im=cv2.imread(str(r/f'v22_focal_overlay_{a:02d}deg.png'))
              assert im is not None and im.shape[:2]==(540,960)
          for a in (5,10,15,20,25):
              assert rows[a]['visible_render_effect_pixels'] is not None and rows[a]['visible_render_effect_pixels'] >= 140, rows[a]
          print('V22_FOCAL_SUBJECT_LOCK_OK')
          print(json.dumps(rows,indent=2))
          PY

      - name: Package v22 evidence even on failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v22/render.log delivery/ 2>/dev/null || true
          cp three_camera_v22/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v22/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v22/v12_*deg.png delivery/ 2>/dev/null || true
          cp three_camera_v22/v22_focal_*.png delivery/ 2>/dev/null || true
          cp three_camera_v22/v12_pose_mask_*.png delivery/ 2>/dev/null || true
          find inputs_v11 -maxdepth 1 -type f \( -name 'K_Left_Above_Rim_v11_*.png' -o -name 'A_Broadcast_v11_*.png' -o -name 'L_Right_Above_Rim_v11_*.png' \) -exec cp {} delivery/ \; 2>/dev/null || true
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_three_camera_focal_subject_v22_package.zip ./*)

      - name: Upload v22 focal subject proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-focal-subject-v22-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

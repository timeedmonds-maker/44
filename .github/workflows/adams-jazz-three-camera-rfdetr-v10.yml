name: Adams Jazz three-camera RF-DETR keypoint v10

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_rfdetr_v10.py'
      - '.github/workflows/adams-jazz-three-camera-rfdetr-v10.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render-rfdetr-v10:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction and RF-DETR runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
          python - <<'PY'
          import cv2, numpy, scipy, torch, torchvision, rfdetr
          from rfdetr import RFDETRKeypointPreview
          from moge.model.v2 import MoGeModel
          print('RUNTIME', cv2.__version__, numpy.__version__, scipy.__version__, torch.__version__, torchvision.__version__)
          print('RFDETR_IMPORT_OK', RFDETRKeypointPreview)
          print('MOGE_IMPORT_OK', MoGeModel)
          PY

      - name: Package-entrypoint smoke test
        run: |
          set -euxo pipefail
          mkdir -p three_camera_v10
          python -u -X faulthandler -c "import freeze_spin.build_three_camera_rfdetr_v10 as m; print('V10_MODULE_IMPORT_OK',m.CAMERA_ORDER,flush=True)" 2>&1 | tee three_camera_v10/module_import.log
          python -u -X faulthandler -m freeze_spin.build_three_camera_rfdetr_v10 --help 2>&1 | tee three_camera_v10/help.log || true

      - name: Retrieve exact event-489 native source angles
        run: |
          set -euxo pipefail
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out target_source --workers 8
          python freeze_spin/prepare_locked_frame_c_sources.py \
            --clips target_source/clips \
            --out frame_c_target
          find frame_c_target -type f -name '*.png' -printf '%p\n' | sort | tee three_camera_v10/source_frames.txt

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json
          python -m json.tool inputs_v73/right_above_rim_metric_camera_v73.json >/dev/null

      - name: Render RF-DETR pose-constrained native diagnostic
        run: |
          set -euxo pipefail
          BCAST="$(find frame_c_target -type f -name '*Broadcast*.png' ! -name '*Mobile*' ! -name '*Other*' | head -n 1)"
          test -n "$BCAST"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_rfdetr_v10 \
            --frames-dir frame_c_target \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v10 \
            --tokens 1200 \
            --voxel-cm 4.0 \
            2>&1 | tee three_camera_v10/render.log

      - name: Encode native source-resolution diagnostic only
        if: success()
        run: |
          set -euxo pipefail
          ffmpeg -y -framerate 30 -i three_camera_v10/frame_%03d.png \
            -c:v libx264 -preset medium -crf 14 -pix_fmt yuv420p -movflags +faststart \
            three_camera_v10/adams_jazz_three_camera_rfdetr_v10_native.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size \
            -of json three_camera_v10/adams_jazz_three_camera_rfdetr_v10_native.mp4 \
            > three_camera_v10/native_ffprobe.json
          python - <<'PY'
          import json
          j=json.load(open('three_camera_v10/native_ffprobe.json')); s=j['streams'][0]
          assert int(s['width'])==960 and int(s['height'])==540, j
          print('NATIVE_RESOLUTION_CONFIRMED',s['width'],s['height'])
          PY

      - name: Extract static arc QA
        if: success()
        run: |
          set -euxo pipefail
          cp three_camera_v10/frame_011.png three_camera_v10/v10_00deg.png
          cp three_camera_v10/frame_026.png three_camera_v10/v10_05deg.png
          cp three_camera_v10/frame_041.png three_camera_v10/v10_10deg.png
          cp three_camera_v10/frame_056.png three_camera_v10/v10_15deg.png
          cp three_camera_v10/frame_071.png three_camera_v10/v10_20deg.png
          cp three_camera_v10/frame_087.png three_camera_v10/v10_25deg.png
          python - <<'PY'
          from PIL import Image
          names=['v10_00deg.png','v10_05deg.png','v10_10deg.png','v10_15deg.png','v10_20deg.png','v10_25deg.png']
          ims=[Image.open('three_camera_v10/'+n).convert('RGB') for n in names]
          canvas=Image.new('RGB',(ims[0].width*3,ims[0].height*2),(0,0,0))
          for i,im in enumerate(ims): canvas.paste(im,((i%3)*im.width,(i//3)*im.height))
          canvas.save('three_camera_v10/v10_key_arc_montage.png')
          PY

      - name: Package evidence even on failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v10/*.log delivery/ 2>/dev/null || true
          cp three_camera_v10/source_frames.txt delivery/ 2>/dev/null || true
          cp three_camera_v10/three_camera_rfdetr_v10_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v10/three_camera_semantic_v9_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v10/native_ffprobe.json delivery/ 2>/dev/null || true
          cp three_camera_v10/v10_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v10/v10_*.png delivery/ 2>/dev/null || true
          cp three_camera_v10/rfdetr_pose_*.png delivery/ 2>/dev/null || true
          cp three_camera_v10/*_person_*.png delivery/ 2>/dev/null || true
          cp three_camera_v10/adams_jazz_three_camera_rfdetr_v10_native.mp4 delivery/ 2>/dev/null || true
          find frame_c_target -type f \( -name '*Left_Above_Rim*.png' -o -name '*Right_Above_Rim*.png' -o -name '*Broadcast*.png' \) -exec cp {} delivery/ \; 2>/dev/null || true
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_three_camera_rfdetr_v10_package.zip ./*)

      - name: Upload RF-DETR diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-rfdetr-v10-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

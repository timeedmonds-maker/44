name: Probe NBAPlayDB historical resolver
on:
  push:
    branches: ['codex/adams-westbrook-hls-final']
    paths:
      - 'analysis/probe_nbaplaydb_resolver.py'
      - '.github/workflows/probe-nbaplaydb-historical-resolver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public NBAPlayDB historical play resolver
        run: python -u analysis/probe_nbaplaydb_resolver.py

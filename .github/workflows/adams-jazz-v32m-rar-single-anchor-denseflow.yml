name: Adams Jazz v32m RAR single-anchor denseflow

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/solve_v32m_rar_single_anchor_denseflow.py'
      - '.github/workflows/adams-jazz-v32m-rar-single-anchor-denseflow.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rar-single-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install observation runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy opencv-python-headless pillow scipy 'rfdetr>=1.8.1'
      - name: Download exact B32 package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507
      - name: Run v32m single-anchor solve
        shell: bash
        run: |
          set +e
          mkdir -p v32m
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.solve_v32m_rar_single_anchor_denseflow \
            --b32-root inputs_b32 --out v32m 2>&1 | tee v32m/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32m/solver_exit_code.txt
          exit 0
      - name: Print strict diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v32m/v32m_single_anchor_qa.json')
          if not p.exists(): print('NO_QA_JSON'); raise SystemExit(0)
          q=json.load(open(p))
          keys=['status','consensus_joint_count','triangulated_joint_count','median_two_view_reprojection_px','measured_bone_count','bone_plausible_fraction','left_best_validation','v32m_strict_gate']
          print(json.dumps({k:q[k] for k in keys},indent=2))
          PY
      - name: Package native evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32m/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32m_single_anchor.zip ./*)
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32m-rar-single-anchor-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce strict geometry gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32m/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

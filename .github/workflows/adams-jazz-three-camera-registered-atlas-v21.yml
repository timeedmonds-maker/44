name: Adams Jazz three-camera registered atlas v21

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v21.py'
      - '.github/workflows/adams-jazz-three-camera-registered-atlas-v21.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-registered-atlas-v21:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision; print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve v11 exact-state evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11 three_camera_v21
          gh run download 34535691949 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-three-camera-exact-sync-v11-34535691949 \
            --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render native registered-atlas three-camera proof
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v21 \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v21 \
            --tokens 900 \
            --voxel-cm 2.5 \
            2>&1 | tee three_camera_v21/render.log

      - name: Assert native registered-atlas renderer
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2, numpy as np
          root=Path('three_camera_v21')
          q=json.load(open(root/'three_camera_mesh_v12_qa.json'))
          assert q['accepted_mesh_count'] >= 2
          assert q['tracks_using_right_above_rim'] >= 1
          r=q['v21_renderer']
          assert r['resolution']==[960,540]
          assert r['generated_texture'] is False and r['crossfade'] is False
          assert r['upscale'] is False and r['uhd'] is False
          aq=r['atlas_qa']; assert aq['resolved_fraction'] > 0.20, aq
          for a in (0,5,10,15,20,25):
              p=root/f'v12_{a:02d}deg.png'; im=cv2.imread(str(p))
              assert im is not None and im.shape[:2]==(540,960)
          srcp=next(Path('inputs_v11').glob('K_Left_Above_Rim_v11_*.png'))
          src=cv2.imread(str(srcp)); anchor=cv2.imread(str(root/'v12_00deg.png'))
          assert np.array_equal(src,anchor)
          print('V21_NATIVE_ONLY_OK')
          print('V21_ATLAS_QA',json.dumps(aq,indent=2))
          print('MESHES',q['accepted_mesh_count'],'RAR_TRACKS',q['tracks_using_right_above_rim'],'BALL',q['ball']['status'])
          PY

      - name: Package v21 evidence even on failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v21/render.log delivery/ 2>/dev/null || true
          cp three_camera_v21/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v21/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v21/v12_*deg.png delivery/ 2>/dev/null || true
          cp three_camera_v21/v21_*.png delivery/ 2>/dev/null || true
          cp three_camera_v21/v12_pose_mask_*.png delivery/ 2>/dev/null || true
          cp three_camera_v21/v12_track_*_mesh.npz delivery/ 2>/dev/null || true
          cp inputs_v11/exact_visual_state_v11_qa.json delivery/ 2>/dev/null || true
          (cd delivery && zip -0 adams_jazz_three_camera_registered_atlas_v21_package.zip ./*)

      - name: Upload v21 registered-atlas proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-registered-atlas-v21-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Adams OKC event 447 clean broadcast screen overlay

on:
  workflow_dispatch:
  push:
    branches: [codex/adams-screen-okc-opener]
    paths:
      - 'tools/adams_screen_broadcast_v1.py'
      - '.github/workflows/adams-okc-screen-event447-broadcast.yml'
      - 'tools/adams_screen_prod_v3.py'
      - 'tools/adams_screen_prod_poc.py'
      - 'tools/render_deterministic_master.py'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git
      - name: Install CV stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install pyreadr requests ultralytics scipy 'numpy<2'
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download models
        run: |
          mkdir -p artifacts/models
          curl -L --retry 3 -o artifacts/models/rfdetr_m_640.onnx \
            https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --retry 3 -o artifacts/models/court_yolo11m_pose.pt \
            https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Render event 447 clean broadcast overlay
        run: |
          python tools/adams_screen_broadcast_v1.py \
            --game 0022500001 --event 447 \
            --start-s 6.0 --end-s 10.1 \
            --analysis-fps 12 --number-fps 4 --court-fps 0.5 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --out artifacts/adams_screen_event447_broadcast
      - name: Report QA
        if: always()
        run: |
          cat artifacts/adams_screen_event447_broadcast/qa.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adams-event447-clean-broadcast-uhd
          path: artifacts/adams_screen_event447_broadcast
          if-no-files-found: error
          retention-days: 30

name: Probe NBA Stats historical event player network
on:
  push:
    branches: ['codex/adams-westbrook-hls-final']
    paths:
      - 'analysis/probe_stats_event_player_network.py'
      - '.github/workflows/probe-stats-event-player-network.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Trace Stats event player media traffic
        run: python -u analysis/probe_stats_event_player_network.py

name: Resolve NBA PBP Query

on:
  push:
    paths:
      - 'query_requests/*.json'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime output
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --retry 2 --retry-delay 1 -fsSL "$RAW_BASE/resolve_pbp_query.py" -o .runtime/resolve_pbp_query.py
          REQUEST_PATH=$(curl --retry 2 --retry-delay 1 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            | jq -r '.files[]?.filename | select(startswith("query_requests/") and endswith(".json"))' \
            | tail -n 1)
          test -n "$REQUEST_PATH"
          curl --retry 2 --retry-delay 1 -fsSL "$RAW_BASE/$REQUEST_PATH" -o .runtime/request.json
          python3 .runtime/resolve_pbp_query.py --request .runtime/request.json --out output/resolved_manifest.json

      - name: Upload resolved manifest
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pbp-${{ github.run_id }}
          path: output/resolved_manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

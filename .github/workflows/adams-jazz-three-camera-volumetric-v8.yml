name: Adams Jazz three-camera volumetric perspective v8

on:
  push:
    branches: [codex/three-camera-volumetric-v8-run]
    paths:
      - 'freeze_spin/build_three_camera_volumetric_v8.py'
      - '.github/workflows/adams-jazz-three-camera-volumetric-v8.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render-volumetric-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic reconstruction runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests pillow
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve exact event-489 native source angles
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out target_source --workers 8
          python freeze_spin/prepare_locked_frame_c_sources.py \
            --clips target_source/clips \
            --out frame_c_target
          find frame_c_target -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -f inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render volumetric three-camera perspective diagnostic
        run: |
          mkdir -p three_camera_v8
          BCAST="$(find frame_c_target -maxdepth 1 -type f -name '*A_Broadcast*.png' | head -n 1)"
          test -n "$BCAST"
          PYTHONPATH=. python -m freeze_spin.build_three_camera_volumetric_v8 \
            --frames-dir frame_c_target \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v8 \
            --tokens 1200 \
            --voxel-cm 4.0

      - name: Encode Ultra HD diagnostic
        run: |
          ffmpeg -y -framerate 30 -i three_camera_v8/frame_%03d.png \
            -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart \
            three_camera_v8/adams_jazz_three_camera_volumetric_v8_native.mp4
          ffmpeg -y -i three_camera_v8/adams_jazz_three_camera_volumetric_v8_native.mp4 \
            -vf "hqdn3d=0.6:0.6:2.0:2.0,scale=3840:2160:flags=lanczos,cas=0.22,fps=30" \
            -c:v libx264 -preset medium -crf 16 -profile:v high -maxrate 36M -bufsize 72M \
            -pix_fmt yuv420p -movflags +faststart \
            three_camera_v8/adams_jazz_three_camera_volumetric_v8_UHD.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size \
            -of json three_camera_v8/adams_jazz_three_camera_volumetric_v8_UHD.mp4 \
            > three_camera_v8/uhd_ffprobe.json
          cat three_camera_v8/uhd_ffprobe.json

      - name: Extract decisive QA stills
        run: |
          cp three_camera_v8/frame_011.png three_camera_v8/v8_00deg.png
          cp three_camera_v8/frame_026.png three_camera_v8/v8_05deg.png || true
          cp three_camera_v8/frame_041.png three_camera_v8/v8_10deg.png || true
          cp three_camera_v8/frame_056.png three_camera_v8/v8_15deg.png || true
          cp three_camera_v8/frame_071.png three_camera_v8/v8_20deg.png || true
          cp three_camera_v8/frame_087.png three_camera_v8/v8_25deg.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=['v8_00deg.png','v8_05deg.png','v8_10deg.png','v8_15deg.png','v8_20deg.png','v8_25deg.png']
          ims=[Image.open('three_camera_v8/'+n).convert('RGB') for n in names if Path('three_camera_v8/'+n).exists()]
          if ims:
              canvas=Image.new('RGB',(ims[0].width*3,ims[0].height*2),(0,0,0))
              for i,im in enumerate(ims[:6]): canvas.paste(im,((i%3)*im.width,(i//3)*im.height))
              canvas.save('three_camera_v8/v8_key_arc_montage.png')
          PY

      - name: Package user delivery
        if: always()
        run: |
          mkdir -p delivery
          cp three_camera_v8/adams_jazz_three_camera_volumetric_v8_UHD.mp4 delivery/ 2>/dev/null || true
          cp three_camera_v8/three_camera_volumetric_v8_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v8/uhd_ffprobe.json delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_00deg.png delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_10deg.png delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_20deg.png delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_25deg.png delivery/ 2>/dev/null || true
          cp three_camera_v8/*_body_mask.png delivery/ 2>/dev/null || true
          cp frame_c_target/*Left_Above_Rim*.png delivery/ 2>/dev/null || true
          cp frame_c_target/*Right_Above_Rim*.png delivery/ 2>/dev/null || true
          cp frame_c_target/*A_Broadcast*.png delivery/ 2>/dev/null || true
          cd delivery && zip -0 adams_jazz_three_camera_volumetric_v8_package.zip \
            adams_jazz_three_camera_volumetric_v8_UHD.mp4 \
            three_camera_volumetric_v8_qa.json uhd_ffprobe.json v8_key_arc_montage.png \
            v8_00deg.png v8_10deg.png v8_20deg.png v8_25deg.png 2>/dev/null || true

      - name: Upload volumetric diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-volumetric-v8-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

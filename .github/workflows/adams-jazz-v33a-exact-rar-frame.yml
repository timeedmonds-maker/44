name: Adams Jazz v33b RAR exact-state dual-reference sweep

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v33b_rar_exact_state_sweep.py'
      - '.github/workflows/adams-jazz-v33a-exact-rar-frame.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rar-exact-state-dual-reference-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic observation runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1'

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Download accepted v73 RAR metric camera evidence
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-above-rim-metric-camera-v73-33911842169
          path: inputs_v73
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33911842169

      - name: Run v33b dual-reference RAR exact-state sweep
        shell: bash
        run: |
          set +e
          mkdir -p v33b
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v33b_rar_exact_state_sweep \
            --b32-root inputs_b32 \
            --v73-frame0257 inputs_v73/L_Right_Above_Rim_8.562013s_frame0257.png \
            --out v33b 2>&1 | tee v33b/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v33b/solver_exit_code.txt
          exit 0

      - name: Print v33b decisive diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v33b/v33b_rar_exact_state_sweep.json')
          if not p.exists():
              print('v33b JSON missing')
              raise SystemExit(0)
          q=json.load(open(p))
          ref=q.get('lar_broadcast_reference') or {}
          winner=q.get('winner')
          print(json.dumps({
            'status':q.get('status'),
            'lar_broadcast_reference':{
              'lar':ref.get('lar'), 'broadcast':ref.get('broadcast'),
              'epipolar':ref.get('epipolar'), 'gate':ref.get('gate')},
            'winner':winner,
            'gate':q.get('gate')},indent=2))
          PY

      - name: Package v33b evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v33b/* delivery/ 2>/dev/null || true
          test -s delivery/v33b_rar_exact_state_sweep.json
          (cd delivery && zip -0 adams_jazz_v33b_rar_exact_state_sweep.zip ./*)

      - name: Upload v33b evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v33b-rar-exact-state-sweep-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed exact-state gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v33b/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

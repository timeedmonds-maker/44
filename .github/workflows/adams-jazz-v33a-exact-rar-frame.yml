name: Adams Jazz v33d locked three-camera joint state search

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v33d_locked_three_camera_joint_state_search.py'
      - '.github/workflows/adams-jazz-v33a-exact-rar-frame.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  locked-three-camera-joint-state-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic observation runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1'

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Download accepted v73 RAR metric camera evidence
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-above-rim-metric-camera-v73-33911842169
          path: inputs_v73
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33911842169

      - name: Run v33d locked three-camera joint state search
        shell: bash
        run: |
          set +e
          mkdir -p v33d
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v33d_locked_three_camera_joint_state_search \
            --b32-root inputs_b32 \
            --v73-frame0257 inputs_v73/L_Right_Above_Rim_8.562013s_frame0257.png \
            --out v33d 2>&1 | tee v33d/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v33d/solver_exit_code.txt
          exit 0

      - name: Print decisive v33d result
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v33d/v33d_locked_three_camera_joint_state_search.json')
          if not p.exists():
              print('v33d JSON missing')
              raise SystemExit(0)
          q=json.load(open(p))
          print(json.dumps({k:q.get(k) for k in ['status','camera_lock','tested_triplets','pairwise_pass_triplets','exact_pass_triplets','winner']},indent=2))
          PY

      - name: Package v33d evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v33d/* delivery/ 2>/dev/null || true
          test -s delivery/v33d_locked_three_camera_joint_state_search.json
          (cd delivery && zip -0 adams_jazz_v33d_locked_three_camera_joint_state_search.zip ./*)

      - name: Upload v33d evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v33d-locked-three-camera-joint-state-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed exact-state gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v33d/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

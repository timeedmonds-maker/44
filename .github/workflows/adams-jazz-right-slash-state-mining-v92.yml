name: Adams Jazz Right Slash state mining v92

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-jazz-right-slash-state-mining-v92.yml'
      - 'freeze_spin/mine_same_game_camera_states_v1.py'
      - 'freeze_spin/scan_same_game_camera_priors.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adams-jazz-right-slash-state-mining-v92.yml'
      - 'freeze_spin/mine_same_game_camera_states_v1.py'
      - 'freeze_spin/scan_same_game_camera_priors.py'

permissions:
  contents: read
  actions: read

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install native video and feature runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 requests

      - name: Recover immutable synchronized Frame C chooser
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692

      - name: Verify immutable Right Slash target
        run: |
          test -f frame_c/H_Right_Slash_8.275733s_frame0248.png
          sha256sum frame_c/H_Right_Slash_8.275733s_frame0248.png

      - name: Mine recurring same-game Right Slash optical states
        run: |
          SHA=$(sha256sum frame_c/H_Right_Slash_8.275733s_frame0248.png | awk '{print $1}')
          python -m freeze_spin.mine_same_game_camera_states_v1 \
            --game-id 0022500301 \
            --camera-label 'Right Slash' \
            --target-frame frame_c/H_Right_Slash_8.275733s_frame0248.png \
            --target-sha256 "$SHA" \
            --count 24 \
            --event-start 5 \
            --event-stop 1405 \
            --event-step 10 \
            --samples-per-clip 7 \
            --keep-top 12 \
            --out right_slash_state_mining_v92

      - name: Enforce discovery-only semantics and evidence minimum
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('right_slash_state_mining_v92/same_game_physical_state_mining_v1.json').read_text())
          assert p['status']=='DISCOVERY_ONLY_NO_PROMOTION'
          assert p['camera_label']=='Right Slash'
          assert all(v is False for v in p['permissions'].values())
          ok=[e for e in p['events'] if e.get('status')=='ok']
          assert len(ok)>=8, len(ok)
          assert len(p['top_candidates'])>=8
          print('RIGHT_SLASH_V92_DISCOVERY_OK',len(ok),'credible',p['credible_candidate_event_count'])
          print([(r['event_probe'],r['sample_name'],round(r['analysis']['discovery_score_lower_is_better'],3),r['analysis'].get('full_scene',{}).get('ransac_inliers'),r['analysis'].get('cross_depth',{}).get('support_residual',{}).get('median_px')) for r in p['top_candidates']])
          PY

      - name: Package v92 state evidence
        if: always()
        run: |
          mkdir -p delivery
          cp right_slash_state_mining_v92/same_game_physical_state_mining_v1.json delivery/ 2>/dev/null || true
          cp right_slash_state_mining_v92/top_state_candidates_montage.png delivery/ 2>/dev/null || true
          cp -a right_slash_state_mining_v92/selected_frames delivery/ 2>/dev/null || true
          cp frame_c/H_Right_Slash_8.275733s_frame0248.png delivery/ 2>/dev/null || true

      - name: Upload v92 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-state-mining-v92-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Fifth-camera local geometry evidence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/right-slash-local-trajectory-evidence.yml"
      - "freeze_spin/export_visual_state_candidates.py"
      - "freeze_spin/export_contact_windows.py"
      - "freeze_spin/estimate_audio_sync_graph.py"
      - "freeze_spin/sidy_cissoko_request.json"
      - "freeze_spin/sidy_cissoko_sync_map.json"
      - "build_kd_top10_all_angles.py"
      - "nba_video_worker.py"

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install lean calibration runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84

      - name: Retrieve validated official NBA angles
        run: |
          python build_kd_top10_all_angles.py \
            --request freeze_spin/sidy_cissoko_request.json \
            --out source_output \
            --workers 2 \
          || {
            echo "Concurrent retrieval did not validate all feeds; retrying serially with fresh signed URLs."
            sleep 3
            python build_kd_top10_all_angles.py \
              --request freeze_spin/sidy_cissoko_request.json \
              --out source_output \
              --workers 1
          }

      - name: Synchronize and export same-event F5-F32 camera windows
        run: |
          python freeze_spin/estimate_audio_sync_graph.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --clips source_output/clips \
            --out diagnostics/audio_sync_graph.json
          python freeze_spin/export_contact_windows.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --sync diagnostics/audio_sync_graph.json \
            --clips source_output/clips \
            --before 0.50 --after 1.10 \
            --out contact_windows
          python freeze_spin/export_visual_state_candidates.py \
            --windows contact_windows \
            --out visual_state_candidates \
            --start 5 --end 32 \
            --reference-frame 28
          test "$(find visual_state_candidates/07_Right_Slash -name 'f*.png' | wc -l)" -eq 28
          test "$(find visual_state_candidates/05_High_Tight -name 'f*.png' | wc -l)" -eq 28

      - name: Package fifth-camera evidence
        run: |
          mkdir -p delivery/right_slash_native delivery/high_tight_native
          cp visual_state_candidates/07_Right_Slash/f*.png delivery/right_slash_native/
          cp visual_state_candidates/05_High_Tight/f*.png delivery/high_tight_native/
          cp visual_state_candidates/07_Right_Slash_F5_F32_sheet.png delivery/
          cp visual_state_candidates/07_Right_Slash_F28_reference_sheet.png delivery/
          cp visual_state_candidates/05_High_Tight_F5_F32_sheet.png delivery/
          cp visual_state_candidates/05_High_Tight_F28_reference_sheet.png delivery/
          cp visual_state_candidates/visual_state_candidates.json delivery/
          cp diagnostics/audio_sync_graph.json delivery/
          cp source_output/qa.json delivery/source_video_qa.json

      - name: Upload fifth-camera evidence
        uses: actions/upload-artifact@v4
        with:
          name: sidy-fifth-camera-local-evidence-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error

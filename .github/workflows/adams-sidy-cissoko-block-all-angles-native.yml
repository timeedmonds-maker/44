name: Steven Adams Sidy Cissoko block all angles native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adams-sidy-cissoko-block-all-angles-native.yml'
      - 'build_kd_top10_all_angles.py'
      - 'nba_video_worker.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public worker repo
        uses: actions/checkout@v4

      - name: Prepare dependencies and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir requests
          mkdir -p vendor bin
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target vendor imageio-ffmpeg==0.6.0
          FFMPEG_EXE=$(PYTHONPATH=vendor python3 - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
          ln -sf "$FFMPEG_EXE" bin/ffmpeg
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Write exact Sidy Cissoko blocked-shot request
        shell: bash
        run: |
          cat > request.json <<'JSON'
          {
            "player": "Steven Adams",
            "player_id": 203500,
            "season": "2025-26",
            "selection": "Steven Adams Restricted Area block immediately after Derik Queen block in chronological full rim-block list",
            "expected_count": 1,
            "events": [
              {
                "rank": 1,
                "original_rim_rank": 7,
                "game_date": "2026-01-07",
                "game_id": "0022500527",
                "event_id": 18,
                "blocked_shot_event_id": 18,
                "block_stat_event_id": 19,
                "period": 1,
                "clock": "10:35.00",
                "team_home": "POR",
                "team_away": "HOU",
                "shooter": "1631321 Sidy Cissoko",
                "blocker": "203500 Steven Adams",
                "description": "MISS S. Cissoko driving DUNK - blocked",
                "shot_distance_ft": 1.62,
                "area": "Restricted Area",
                "video_anchor": "blocked shot event_id"
              }
            ]
          }
          JSON
          cat request.json

      - name: Download every official NBA camera angle at native source quality
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BINARY="$PWD/bin/ffmpeg" python3 build_kd_top10_all_angles.py --request request.json --out output --workers 8

      - name: Verify exact event and complete all-angle QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('output/qa.json').read_text())
          req=json.loads(Path('request.json').read_text())
          if len(req.get('events',[])) != 1:
              raise SystemExit('Expected one event')
          e=req['events'][0]
          if str(e['game_id'])!='0022500527' or int(e['event_id'])!=18:
              raise SystemExit('Exact Sidy event mismatch')
          if qa.get('valid_clip_count') != qa.get('expanded_clip_count'):
              raise SystemExit('All-angle QA count mismatch')
          if qa.get('exact_cross_event_duplicate_groups'):
              raise SystemExit('Unexpected exact duplicate media')
          if qa.get('valid_clip_count',0) < 1:
              raise SystemExit('No valid camera angles')
          print(f"SIDY_ANGLES={qa['valid_clip_count']}")
          PY

      - name: Package into sub-100MB ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          LIMIT=95_000_000
          clips=sorted(Path('output/clips').glob('*_R01_0022500527_18_*_SOURCE.mp4'))
          if not clips:
              raise SystemExit('No Sidy native angle clips found')
          groups=[]; cur=[]; cur_bytes=0
          for p in clips:
              sz=p.stat().st_size
              if sz >= LIMIT:
                  raise SystemExit(f'Single angle too large: {p}')
              if cur and cur_bytes + sz > LIMIT:
                  groups.append(cur); cur=[]; cur_bytes=0
              cur.append(p); cur_bytes += sz
          if cur: groups.append(cur)
          packages=[]
          for i,group in enumerate(groups,1):
              suffix=f'_part_{i:02d}' if len(groups)>1 else ''
              z=Path('packages')/f'Sidy_Cissoko_block_ALL_NATIVE_ANGLES{suffix}.zip'
              with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED) as a:
                  for p in group:
                      a.write(p,arcname=f'angles/{p.name}')
                  a.write('request.json',arcname='event_manifest.json')
                  a.write('output/qa.json',arcname='video_qa.json')
              if z.stat().st_size >= 100_000_000:
                  raise SystemExit(f'ZIP exceeds 100MB: {z}')
              packages.append({'filename':z.name,'bytes':z.stat().st_size,'mb_decimal':round(z.stat().st_size/1_000_000,2),'angle_count':len(group),'part':i,'parts_total':len(groups)})
          Path('packages/packages.json').write_text(json.dumps(packages,indent=2))
          print('PACKAGES=' + json.dumps(packages))
          PY
          ls -lh packages

      - name: Upload Sidy Cissoko all-angle package
        uses: actions/upload-artifact@v4
        with:
          name: adams-block-R07-Sidy-Cissoko-${{ github.run_id }}
          path: |
            packages/*.zip
            packages/packages.json
            request.json
            output/qa.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

name: Adams Jazz v32o MHR anatomical fit

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/fit_v32o_mhr_to_v32m_pose.py'
      - '.github/workflows/adams-jazz-v32o-mhr-anatomical-fit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mhr-anatomical-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - name: Install stable PyMomentum CPU solver and MHR asset CLI
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy opencv-python-headless pillow scipy 'pymomentum-cpu>=0.1.111' 'trimesh>=4.8.3,<5'
          python -m pip install --quiet --no-deps 'git+https://github.com/facebookresearch/MHR.git'
          python - <<'PY'
          import pymomentum.geometry as g
          import pymomentum.solver as s
          print('PYMOMENTUM_GEOMETRY_OK', g.__name__)
          print('PYMOMENTUM_SOLVER_OK', s.__name__)
          PY

      - name: Download public MHR assets into isolated work directory
        run: |
          set -euxo pipefail
          mkdir -p v32o_work
          mhr-download-assets --dest v32o_work
          test -s v32o_work/assets/lod1.fbx
          test -s v32o_work/assets/compact_v6_1.model
          test -s v32o_work/assets/mhr_model.pt

      - name: Download accepted v32m pose
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32m-rar-single-anchor-34682680955
          path: inputs_v32m
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34682680955

      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507

      - name: Run direct PyMomentum MHR anatomical fit
        shell: bash
        run: |
          set +e
          mkdir -p v32o
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.fit_v32o_mhr_to_v32m_pose \
            --v32m-root inputs_v32m \
            --b32-root inputs_b32 \
            --work v32o_work \
            --out v32o 2>&1 | tee v32o/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32o/solver_exit_code.txt
          exit 0

      - name: Print anatomical fit diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('v32o/v32o_mhr_fit_qa.json')
          if not p.exists():
              print('NO_QA_JSON')
              raise SystemExit(0)
          q=json.load(open(p))
          keys=['status','surface_type','vertex_count','face_count','median_joint_error_cm','p90_joint_error_cm','max_joint_error_cm','gate','camera_projection_qa']
          print(json.dumps({k:q[k] for k in keys}, indent=2))
          PY

      - name: Package anatomical evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32o/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32o_mhr_anatomical_fit.zip ./*)

      - name: Upload anatomical fit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32o-mhr-anatomical-fit-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Enforce fail-closed anatomical fit gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32o/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

name: Adams Jazz locked Frame C true orbit v22

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_frame_c_true_orbit_v22.py'
      - '.github/workflows/adams-jazz-frame-c-true-orbit-v22.yml'

jobs:
  frame-c-true-orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic native vision and MoGe runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve and real-media QA all 12 official Jazz dunk angles
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json --out jazz_dunk_source --workers 8

      - name: Fresh audio graph anchored to immutable Right Slash Frame C
        run: |
          mkdir -p frame_c_v22/frames
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path('jazz_dunk_source/clips').glob('*_489_*_SOURCE.mp4')):
              m=re.search(r'_489_(.+)_SOURCE\.mp4$',p.name)
              if m: rows.append({'label':m.group(1).replace('_',' '),'file':p.name,'freeze_time':8.275733})
          if len(rows)!=12: raise RuntimeError(f'Expected 12 angles, found {len(rows)}')
          cfg={'event':{'game_id':'0022500301','event_id':489},'source_fps':29.97003,'reference_angle':'Left Above Rim','angles':rows}
          Path('frame_c_v22/provisional_sync_map.json').write_text(json.dumps(cfg,indent=2))
          PY
          python freeze_spin/estimate_audio_sync_graph.py \
            --config frame_c_v22/provisional_sync_map.json --clips jazz_dunk_source/clips \
            --reference 'Left Above Rim' --max-lag-seconds 2.0 --out frame_c_v22/audio_sync_graph.json

      - name: Export exact same physical instant to all 12 cameras
        run: |
          python - <<'PY'
          import cv2,json
          from pathlib import Path
          locked_time=8.275733
          sync=json.load(open('frame_c_v22/audio_sync_graph.json'))
          cfg=json.load(open('frame_c_v22/provisional_sync_map.json'))
          offsets={r['label']:float(r['offset_seconds_vs_reference']) for r in sync['angles']}
          files={r['label']:r['file'] for r in cfg['angles']}
          if 'Right Slash' not in offsets: raise RuntimeError('Right Slash sync offset missing')
          tref=locked_time-offsets['Right Slash']
          ordered=['Broadcast','Other Broadcast','Mobile Broadcast','Play by Play','In Arena','High Tight',
                   'Left Slash','Right Slash','Left HandHeld','Right HandHeld','Left Above Rim','Right Above Rim']
          letters=list('ABCDEFGHIJKL'); rows=[]
          for letter,label in zip(letters,ordered):
              t=tref+offsets[label]
              p=Path('jazz_dunk_source/clips')/files[label]
              cap=cv2.VideoCapture(str(p)); cap.set(cv2.CAP_PROP_POS_MSEC,t*1000.0)
              ok,im=cap.read(); fi=int(round(cap.get(cv2.CAP_PROP_POS_FRAMES)-1)); cap.release()
              if not ok: raise RuntimeError(f'Cannot decode {label} at {t:.6f}')
              if im.shape[:2]!=(540,960): raise RuntimeError(f'{label} unexpected shape {im.shape}')
              fn=f'{letter}_{label.replace(" ","_")}_{t:.6f}s_frame{fi:04d}.png'
              cv2.imwrite(str(Path('frame_c_v22/frames')/fn),im)
              rows.append({'option':letter,'camera':label,'requested_local_time':round(float(t),6),'decoded_frame_index':fi,'file':fn})
          rs=next(r for r in rows if r['camera']=='Right Slash')
          if abs(float(rs['requested_local_time'])-8.275733)>5e-7 or int(rs['decoded_frame_index'])!=248:
              raise RuntimeError(f'FRAME C LOCK VIOLATED: {rs}')
          out={'event':{'game_id':'0022500301','event_id':489,'date':'2025-11-30'},
               'chosen_timing':{'source_camera':'Right Slash','option':'C','right_slash_local_time':8.275733,
                                'decoded_frame_index_from_manual_chooser':248},
               'common_reference_time_left_above_rim':tref,
               'policy':'Frame C is immutable. Audio only maps this exact physical instant to other cameras.',
               'options':rows}
          Path('frame_c_v22/options.json').write_text(json.dumps(out,indent=2))
          print('FRAME_C_LOCK',rs)
          print('REFERENCE_TIME',tref)
          for r in rows: print('SYNC_FRAME',r)
          PY

      - name: Solve reciprocal cameras and render rigid constant-radius orbit
        run: |
          python freeze_spin/build_frame_c_true_orbit_v22.py \
            --frames-dir frame_c_v22/frames --options-json frame_c_v22/options.json \
            --out frame_c_true_orbit_v22 --reference 'Left Slash' \
            --pivot-u 500 --pivot-v 104 --tokens 1600 --max-degree 5.0 --frames 31

      - name: Enforce hard no-zoom and source-pose QA
        run: |
          python - <<'PY'
          import json
          q=json.load(open('frame_c_true_orbit_v22/frame_c_true_orbit_qa_v22.json'))
          lock=q['freeze_timing_lock']
          assert lock['authority_camera']=='Right Slash' and lock['chooser_option']=='C'
          assert abs(lock['right_slash_local_time']-8.275733)<5e-7 and lock['decoded_right_slash_frame_index']==248
          assert q['source_resolution']==[960,540] and q['render_resolution']==[960,540]
          assert q['max_radius_drift']<=1e-6
          assert q['max_pivot_drift_px']<=0.05
          assert q['focal_constant'] and q['fov_constant']
          assert q['actual_max_angular_displacement_deg']>=3.0
          assert q['secondary_fill_policy'].startswith('STATIC ONLY')
          for s in q['stills']:
              for f in s['fills']: assert f['dynamic_fill']==0
          print('REFERENCE',q['reference_camera'])
          print('TARGET_REAL_CAMERA',q['target_direction_camera'])
          print('TARGET_REAL_BASELINE_DEG',q['target_real_baseline_angle_deg'])
          print('COVERAGE_STATUS',q['coverage_status'])
          print('RENDER_MAX_DEG',q['render_max_degree'])
          print('ACTUAL_MAX_DEG',q['actual_max_angular_displacement_deg'])
          print('MAX_RADIUS_DRIFT',q['max_radius_drift'])
          print('MAX_PIVOT_DRIFT_PX',q['max_pivot_drift_px'])
          print('FOCAL',q['reference_focal_px'],'FOV',q['reference_fov_deg'])
          print('PASSED_BASELINES',q['passed_camera_baselines_deg'])
          for s in q['stills']:
              print('STILL_QA',s['nominal_degree'],'actual',s['actual_degree'],'resolved',round(s['resolved_fraction'],6),'holes',s['unresolved_pixels'])
          PY

      - name: Encode native 960x540 orbit preview
        run: |
          ffmpeg -y -framerate 30 -i frame_c_true_orbit_v22/motion_%03d.png \
            -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart \
            frame_c_true_orbit_v22/adams_jazz_frame_c_true_orbit_native_960x540.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 frame_c_true_orbit_v22/adams_jazz_frame_c_true_orbit_native_960x540.mp4)" = "960" || exit 1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 frame_c_true_orbit_v22/adams_jazz_frame_c_true_orbit_native_960x540.mp4)" = "540" || exit 1

      - name: Package visual and diagnostic proof
        if: always()
        run: |
          mkdir -p delivery
          cp frame_c_true_orbit_v22/frame_c_true_orbit_00deg_native.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/frame_c_true_orbit_03deg_native.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/frame_c_true_orbit_05deg_native.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/frame_c_unresolved_03deg.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/frame_c_unresolved_05deg.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/frame_c_true_orbit_qa_v22.json delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/adams_jazz_frame_c_true_orbit_native_960x540.mp4 delivery/ 2>/dev/null || true
          cp frame_c_v22/options.json delivery/frame_c_synchronized_options.json 2>/dev/null || true
          cp frame_c_v22/audio_sync_graph.json delivery/ 2>/dev/null || true
          cp jazz_dunk_source/qa.json delivery/source_qa.json 2>/dev/null || true
          cp frame_c_v22/frames/G_Left_Slash_*.png delivery/ 2>/dev/null || true
          cp frame_c_v22/frames/H_Right_Slash_*.png delivery/ 2>/dev/null || true
          cp frame_c_v22/frames/I_Left_HandHeld_*.png delivery/ 2>/dev/null || true
          cp frame_c_true_orbit_v22/*_dynamic_mask.png delivery/ 2>/dev/null || true
          (cd delivery && zip -q adams_jazz_frame_c_true_orbit_v22_diagnostics.zip ./* || true)

      - name: Upload Frame C true-orbit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-frame-c-true-orbit-v22-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

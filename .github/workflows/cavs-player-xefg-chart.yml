name: Cavaliers Player xEFG Chart 2025-26

on:
  push:
    paths:
      - '.github/workflows/cavs-player-xefg-chart.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic render dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pandas requests pillow

      - name: Render all Cavaliers players with official NBA CDN headshots
        run: python3 render_cavs_player_xefg_final.py

      - name: Commit durable final chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/cavs_player_xefg_quadrant_2025_26_final.png
          git diff --cached --quiet || git commit -m "Add final Cavaliers player xEFG headshot chart"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: cavs-player-xefg-final-${{ github.run_id }}
          path: |
            outputs/cavs_player_xefg_2025_26.csv
            outputs/cavs_player_xefg_qa_2025_26.json
            outputs/cavs_player_xefg_quadrant_2025_26_final.png
          retention-days: 14
          compression-level: 0

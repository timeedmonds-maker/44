name: Cavaliers Player xEFG Chart 2025-26

on:
  push:
    paths:
      - '.github/workflows/cavs-player-xefg-chart.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pandas pyreadr requests pillow

      - name: Build exact CLE player xEFG dataset and deterministic Pillow chart
        run: python3 render_cavs_player_xefg.py

      - name: Commit durable outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/cavs_player_xefg_2025_26.csv \
                  outputs/cavs_player_xefg_manifest_2025_26.csv \
                  outputs/cavs_player_xefg_qa_2025_26.json \
                  outputs/cavs_player_xefg_errors_2025_26.csv \
                  outputs/cavs_player_xefg_quadrant_2025_26.png
          git diff --cached --quiet || git commit -m "Add Cavaliers 2025-26 player xEFG chart"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: cavs-player-xefg-chart-${{ github.run_id }}
          path: |
            outputs/cavs_player_xefg_2025_26.csv
            outputs/cavs_player_xefg_manifest_2025_26.csv
            outputs/cavs_player_xefg_qa_2025_26.json
            outputs/cavs_player_xefg_errors_2025_26.csv
            outputs/cavs_player_xefg_quadrant_2025_26.png
          retention-days: 14
          compression-level: 0

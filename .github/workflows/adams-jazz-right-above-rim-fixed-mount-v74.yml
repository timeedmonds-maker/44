name: Adams Jazz Right Above Rim fixed-mount anchor v74

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/lock_right_above_rim_fixed_mount_v74.py'
      - '.github/workflows/adams-jazz-right-above-rim-fixed-mount-v74.yml'
  pull_request:
    branches: [main]
    paths:
      - 'freeze_spin/lock_right_above_rim_fixed_mount_v74.py'
      - '.github/workflows/adams-jazz-right-above-rim-fixed-mount-v74.yml'

permissions:
  contents: read
  actions: read

jobs:
  lock-fixed-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic geometry runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84

      - name: Recover certified v73 metric-camera evidence
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-above-rim-metric-camera-v73-33911842169
          path: v73
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33911842169

      - name: Verify v73 report is present
        run: |
          test -f v73/right_above_rim_metric_camera_v73.json
          python - <<'PY'
          import json
          q=json.load(open('v73/right_above_rim_metric_camera_v73.json'))
          assert q['status']=='PASS_RIGHT_ABOVE_RIM_METRIC_CAMERA_V73'
          assert q['permissions']['physical_camera_center_allowed'] is True
          assert q['permissions']['metric_event_camera_allowed'] is True
          assert all(q['gates'].values())
          PY

      - name: Lock fixed-centre PTZ anchor and emit projection matrix
        run: |
          python -m freeze_spin.lock_right_above_rim_fixed_mount_v74 \
            --v73-report v73/right_above_rim_metric_camera_v73.json \
            --out v74

      - name: Enforce fail-closed v74 verdict
        run: |
          python - <<'PY'
          import json
          q=json.load(open('v74/right_above_rim_fixed_mount_anchor_v74.json'))
          assert q['status']=='PASS_RIGHT_ABOVE_RIM_FIXED_MOUNT_ANCHOR_V74', q['status']
          assert q['permissions']['fixed_center_ptz_anchor_allowed'] is True
          assert q['permissions']['current_frame_projection_matrix_allowed'] is True
          assert q['permissions']['cross_arena_exact_mount_transfer_allowed'] is False
          assert q['permissions']['static_novel_view_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          assert all(q['gates'].values()), q['gates']
          PY

      - name: Package v74 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v74/*.json delivery/ 2>/dev/null || true
          cp v73/right_above_rim_frame_c_overlay_v73.png delivery/ 2>/dev/null || true
          cp v73/L_Right_Above_Rim_8.562013s_frame0257.png delivery/ 2>/dev/null || true

      - name: Upload v74 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-above-rim-fixed-mount-v74-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

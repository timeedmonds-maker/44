name: Adams LAL Christmas broadcast V7

on:
  workflow_dispatch:
  push:
    branches: [codex/adams-screen-okc-opener]
    paths:
      - 'tools/christmas_event94_broadcast_v7.py'
      - 'tools/player_conditioned_xfg.py'
      - '.github/workflows/adams-lal-christmas-broadcast-v7.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CV and data stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install pyreadr requests ultralytics scipy pandas 'numpy<2' pillow
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download tracking models
        run: |
          mkdir -p artifacts/models
          curl -L --retry 3 -o artifacts/models/rfdetr_m_640.onnx \
            https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --retry 3 -o artifacts/models/court_yolo11m_pose.pt \
            https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Compute reproducible KD player-conditioned xFG
        run: |
          python tools/player_conditioned_xfg.py \
            --player-id 201142 \
            --game-id 0022500012 \
            --event-num 94 \
            --distance-window-ft 1.0 \
            --xfg-window-pp 2.5 \
            --workers 4 \
            --out artifacts/kd_event94_player_xfg
      - name: Assert player-conditioned xFG proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('artifacts/kd_event94_player_xfg/player_conditioned_xfg.json').read_text())
          assert j['target']['game_id']=='0022500012'
          assert j['target']['event_num']==94
          assert abs(j['target']['league_xfg_pct']-42.6)<0.2
          assert j['sample_fga']>0
          assert j['player_conditioned_xfg_pct'] is not None
          print(json.dumps(j,indent=2))
          PY
      - name: Rebuild deterministic event 94 tracks
        run: |
          python tools/adams_screen_prod_v3.py \
            --game 0022500012 --event 94 \
            --start-s 6.8 --end-s 12.4 \
            --analysis-fps 15 --number-fps 6 --court-fps 1 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --out artifacts/adams_lal_christmas_event94
      - name: Render deterministic V7
        env:
          PLAYER_XFG_JSON: artifacts/kd_event94_player_xfg/player_conditioned_xfg.json
          PLAYER_XFG_LABEL: KD
        run: |
          python tools/christmas_event94_broadcast_v7.py \
            --source artifacts/adams_lal_christmas_event94/source_native.mp4 \
            --tracks artifacts/adams_lal_christmas_event94/tracks.csv \
            --out artifacts/christmas_broadcast_v7
      - name: Assert V7 metric and UHD duration
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path('artifacts/christmas_broadcast_v7')
          native=out/'durant_adams_christmas_broadcast_v7_native.mp4'
          uhd=out/'durant_adams_christmas_broadcast_v7_UHD.mp4'
          q=json.loads((out/'qa.json').read_text())
          def dur(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nk=1:nw=1',str(p)],text=True).strip())
          nd,ud=dur(native),dur(uhd)
          m=q['player_conditioned_xfg']
          print(json.dumps({'native_duration_s':nd,'uhd_duration_s':ud,'player_xfg':m},indent=2))
          assert abs(m['pct']-50.0)<0.01, m
          assert m['sample_fga']==30, m
          if ud < nd-0.10: raise SystemExit(f'UHD truncated: native={nd:.3f}s uhd={ud:.3f}s')
          if ud < 6.8: raise SystemExit(f'UHD too short: {ud:.3f}s')
          PY
      - name: Report QA
        if: always()
        run: |
          cat artifacts/christmas_broadcast_v7/qa.json || true
          cat artifacts/kd_event94_player_xfg/player_conditioned_xfg.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adams-lal-christmas-broadcast-v7
          path: |
            artifacts/christmas_broadcast_v7
            artifacts/kd_event94_player_xfg
            artifacts/adams_lal_christmas_event94/context.json
            artifacts/adams_lal_christmas_event94/qa.json
          if-no-files-found: warn
          retention-days: 30

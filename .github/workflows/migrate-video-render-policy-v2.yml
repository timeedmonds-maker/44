name: Migrate remaining video render path v2

on:
  push:
    branches: [codex/adams-screen-okc-opener]
    paths:
      - '.github/workflows/migrate-video-render-policy-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adams-screen-okc-opener
          fetch-depth: 0
      - name: Patch production overlay renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/adams_screen_prod_poc.py')
          s = p.read_text()
          anchor = 'from fetch_official_nba_event_clip import parse as resolve_clip, UA\n'
          imp = 'from render_deterministic_master import render as render_presentation\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)

          start = "    uhd=a.out/'adams_screen_overlay_2160p.mp4'\n"
          qa_start = "    qa={'game_id':a.game"
          i = s.find(start)
          j = s.find(qa_start, i)
          if i < 0 or j < 0:
              raise SystemExit('render block anchors not found')
          s = s[:i] + start + "    render_presentation(final, uhd, 'uhd')\n" + s[j:]

          old_note = "'note':'2160p is deterministic Lanczos presentation upscale; source imagery remains official native NBA clip.'"
          new_note = "'note':'2160p uses the repository-standard deterministic presentation render; official NBA source detail is not altered or invented.'"
          if old_note in s:
              s = s.replace(old_note, new_note, 1)
          elif new_note not in s:
              raise SystemExit('QA note anchor not found')
          p.write_text(s)
          PY
          git diff -- tools/adams_screen_prod_poc.py
      - name: Remove one-shot workflow
        run: git rm .github/workflows/migrate-video-render-policy-v2.yml
      - name: Verify policy before commit
        run: python tools/audit_video_render_policy.py
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/adams_screen_prod_poc.py
          git add -u .github/workflows/migrate-video-render-policy-v2.yml
          git status --short
          git diff --cached --exit-code && { echo 'No staged migration changes'; exit 1; } || true
          git commit -m 'Use approved renderer in Adams screen overlay'
          git push origin HEAD:codex/adams-screen-okc-opener

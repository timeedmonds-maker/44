name: Adams Jazz three-camera photometric v17

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_mesh_v12.py'
      - 'freeze_spin/build_three_camera_mesh_v12b.py'
      - 'freeze_spin/build_three_camera_mesh_v13.py'
      - 'freeze_spin/build_three_camera_mesh_v14.py'
      - 'freeze_spin/build_three_camera_mesh_v15.py'
      - 'freeze_spin/build_three_camera_mesh_v16.py'
      - 'freeze_spin/build_three_camera_mesh_v17.py'
      - '.github/workflows/adams-jazz-three-camera-photometric-v17.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-photometric-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install reconstruction runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve v11 exact-state evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11 three_camera_v17
          gh run download 34535691949 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-three-camera-exact-sync-v11-34535691949 \
            --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json
          test -s "$(find inputs_v11 -type f -name 'K_Left_Above_Rim_v11_*.png' | head -n 1)"
          test -s "$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          test -s "$(find inputs_v11 -type f -name 'L_Right_Above_Rim_v11_*.png' | head -n 1)"

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render photometrically calibrated native proof
        run: |
          set -euxo pipefail
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.build_three_camera_mesh_v17 \
            --frames-dir inputs_v11 \
            --sync-qa inputs_v11/exact_visual_state_v11_qa.json \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v17 \
            --tokens 900 \
            --voxel-cm 2.5 \
            2>&1 | tee three_camera_v17/render.log

      - name: Assert native-only photometric renderer
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2, numpy as np
          root=Path('three_camera_v17')
          q=json.load(open(root/'three_camera_mesh_v12_qa.json'))
          assert q['accepted_mesh_count'] >= 2
          assert q['tracks_using_right_above_rim'] >= 1
          r=q['v17_renderer']
          assert r['resolution'] == [960,540]
          assert r['upscale'] is False and r['uhd'] is False and r['generated_texture'] is False
          for a in (0,5,10,15,20,25):
              im=cv2.imread(str(root/f'v12_{a:02d}deg.png'))
              assert im is not None and im.shape[:2] == (540,960)
          src=cv2.imread(str(next(Path('inputs_v11').glob('K_Left_Above_Rim_v11_*.png'))))
          anchor=cv2.imread(str(root/'v12_00deg.png'))
          assert np.array_equal(src,anchor)
          print('V17_NATIVE_ONLY_OK')
          print('V17_ANCHOR_BIT_EXACT_OK')
          print('PHOTO_QA',json.dumps(r['floor_photometric_qa']))
          print('MESHES',q['accepted_mesh_count'],'RAR_TRACKS',q['tracks_using_right_above_rim'],'BALL',q['ball']['status'])
          PY

      - name: Package v17 evidence even on failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp three_camera_v17/render.log delivery/ 2>/dev/null || true
          cp three_camera_v17/three_camera_mesh_v12_qa.json delivery/ 2>/dev/null || true
          cp three_camera_v17/v12_key_arc_montage.png delivery/ 2>/dev/null || true
          cp three_camera_v17/v12_*deg.png delivery/ 2>/dev/null || true
          cp three_camera_v17/v12_pose_mask_*.png delivery/ 2>/dev/null || true
          cp three_camera_v17/v12_track_*_mesh.npz delivery/ 2>/dev/null || true
          cp inputs_v11/exact_visual_state_v11_qa.json delivery/ 2>/dev/null || true
          find inputs_v11 -maxdepth 1 -type f \( -name 'K_Left_Above_Rim_v11_*.png' -o -name 'A_Broadcast_v11_*.png' -o -name 'L_Right_Above_Rim_v11_*.png' \) -exec cp {} delivery/ \; 2>/dev/null || true
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_three_camera_photometric_v17_package.zip ./*)

      - name: Upload v17 photometric proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-photometric-v17-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

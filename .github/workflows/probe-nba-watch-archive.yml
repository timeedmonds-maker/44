name: Probe NBA Watch Archive
on:
  push:
    branches: [agent/adams-westbrook-old-video-probe]
    paths:
      - 'probe_nba_watch_archive.py'
      - '.github/workflows/probe-nba-watch-archive.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python3 probe_nba_watch_archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-watch-archive-${{ github.run_id }}
          path: nba_watch_archive_probe.json
          retention-days: 1

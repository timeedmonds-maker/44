name: Probe Official NBA PBP Video
on:
  push:
    branches: [agent/adams-westbrook-old-video-probe]
    paths:
      - 'probe_official_pbp_video.py'
      - '.github/workflows/probe-official-pbp-video.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe official PBP event video
        run: python3 probe_official_pbp_video.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-pbp-video-${{ github.run_id }}
          path: |
            official_pbp_probe.json
            official_pbp_probe.png
            next_data.json
          if-no-files-found: warn
          retention-days: 2

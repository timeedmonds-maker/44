name: Sheppard Adams locked V1 with xFG

on:
  workflow_dispatch:
  push:
    branches: [codex/sheppard-adams-locked-v1-xfg]
    paths:
      - '.github/workflows/sheppard-adams-locked-v1-xfg.yml'
      - 'configs/locked_broadcast_screen_v1_toronto_event483.json'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CV and data stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git fonts-dejavu-core zip
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install requests ultralytics scipy pandas 'numpy<2' pillow pyreadr
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download tracking models
        run: |
          mkdir -p artifacts/models
          curl -L --fail --retry 3 -o artifacts/models/rfdetr_m_640.onnx https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --fail --retry 3 -o artifacts/models/court_yolo11m_pose.pt https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Lock validated Toronto identities
        run: |
          mkdir -p artifacts
          cat > artifacts/event483_overrides.json <<'JSON'
          {
            "adams": 10,
            "ballhandler": 7,
            "screened_defender": 3,
            "adams_defender": 4,
            "names": {"10": "ADAMS", "7": "SHEPPARD"}
          }
          JSON
      - name: Resolve and validate exact official xFG
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests
          GAME_ID='0022500131'; PLAYER_ID=1642263; EVENT_NUM=483
          url='https://stats.gleague.nba.com/stats/shotqualityvideologs'
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://www.nba.com/','Origin':'https://www.nba.com',
            'Accept':'application/json, text/plain, */*','Accept-Language':'en-US,en;q=0.9','Connection':'keep-alive'}
          s=requests.Session(); s.headers.update(headers)
          payload=None; last=None
          for attempt in range(1,6):
            try:
              r=s.get(url,params={'GameID':GAME_ID,'PlayerID':PLAYER_ID},timeout=(8,35))
              if r.status_code==200:
                payload=r.json()
                if str(payload.get('gameId') or '').zfill(10)==GAME_ID and int(payload.get('playerId') or 0)==PLAYER_ID: break
              last=f'HTTP {r.status_code}: {r.text[:250]}'
            except Exception as exc: last=repr(exc)
            if attempt<5: time.sleep(min(6.0,0.7*(2**(attempt-1))))
          else: raise RuntimeError(last)
          rows=[x for x in payload.get('shotList',[]) if int(x.get('eventNum') or -1)==EVENT_NUM]
          assert len(rows)==1, len(rows)
          sh=rows[0]; xfg=float(sh['shotQuality']); assert abs(xfg-0.417)<1e-9, xfg
          exact={'game_id':GAME_ID,'event_num':EVENT_NUM,'player_id':PLAYER_ID,'player_name':'Reed Sheppard',
                 'xfg':xfg,'xfg_pct':round(xfg*100,1),'source_host':'stats.gleague.nba.com',
                 'source_resource':'shotqualityvideologs','guid':sh.get('guid'),'shot_type':sh.get('shotType'),
                 'action_type':sh.get('actionType'),'period':sh.get('period'),'game_clock':sh.get('gameClock')}
          Path('artifacts/event483_xfg.json').write_text(json.dumps({'xfg':exact},indent=2))
          cfg=json.loads(Path('configs/locked_broadcast_screen_v1_toronto_event483.json').read_text())
          assert float(cfg['shot']['league_xfg_pct'])==41.7
          assert cfg['shot']['xfg_event_num']==EVENT_NUM and cfg['shot']['xfg_player_id']==PLAYER_ID
          print(json.dumps(exact,indent=2))
          PY
      - name: Recreate official source and validated tracks
        run: |
          python tools/adams_screen_prod_v3.py \
            --game 0022500131 --event 483 \
            --start-s 3.5 --end-s 11.5 \
            --analysis-fps 15 --number-fps 6 --court-fps 1 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --overrides artifacts/event483_overrides.json \
            --xfg-row-json artifacts/event483_xfg.json \
            --out artifacts/toronto_tracking
      - name: Validate source and identity mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/toronto_tracking')
          qa=json.loads((p/'qa.json').read_text()); r=qa['roles']
          assert qa['game_id']=='0022500131' and qa['event_num']==483
          assert qa['source']['angle']=='Broadcast'
          assert qa['source']['variant']['width']==960 and qa['source']['variant']['height']==540
          assert r['adams']==10 and r['ballhandler']==7 and r['screened_defender']==3, r
          assert (p/'source_native.mp4').exists() and (p/'tracks.csv').exists()
          print(json.dumps(qa,indent=2))
          PY
      - name: Render exact LOCKED_BROADCAST_SCREEN_V1 presentation
        run: |
          test "$(python - <<'PY'
          import json
          print(json.load(open('tools/LOCKED_BROADCAST_SCREEN_V1.lock.json'))['tool_commit'])
          PY
          )" = "bda2af3106497e0675616d99a11dad1a4e25ae27"
          git show bda2af3106497e0675616d99a11dad1a4e25ae27:tools/locked_broadcast_screen_v1.py > artifacts/locked_broadcast_screen_v1.py
          python artifacts/locked_broadcast_screen_v1.py \
            --source artifacts/toronto_tracking/source_native.mp4 \
            --tracks artifacts/toronto_tracking/tracks.csv \
            --config configs/locked_broadcast_screen_v1_toronto_event483.json \
            --out artifacts/locked_sheppard_adams_xfg
      - name: Validate locked output and package
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('artifacts/locked_sheppard_adams_xfg')
          q=json.loads((p/'qa.json').read_text())
          assert q['tool_id']=='LOCKED_BROADCAST_SCREEN_V1', q
          assert q['panel_style']=='neutral_translucent_grey_v1', q
          assert q['shot_distance_tag']=='17 FT', q
          assert q['deterministic_only'] is True and q['ai_image_generation'] is False and q['ai_super_resolution'] is False
          uhd=p/'adams_sheppard_toronto_locked_broadcast_v1_xfg_UHD.mp4'
          native=p/'adams_sheppard_toronto_locked_broadcast_v1_xfg_native.mp4'
          assert uhd.exists() and native.exists()
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,codec_name','-of','json',str(uhd)]))
          st=probe['streams'][0]; assert st['width']==3840 and st['height']==2160 and st['codec_name']=='h264', st
          print(json.dumps({'locked_qa':q,'uhd_probe':st},indent=2))
          PY
          cd artifacts
          zip -j -9 sheppard_adams_locked_broadcast_v1_xfg_UHD.zip \
            locked_sheppard_adams_xfg/adams_sheppard_toronto_locked_broadcast_v1_xfg_UHD.mp4 \
            locked_sheppard_adams_xfg/adams_sheppard_toronto_locked_broadcast_v1_xfg_native.mp4 \
            locked_sheppard_adams_xfg/release_freeze.jpg \
            locked_sheppard_adams_xfg/qa.json \
            event483_xfg.json \
            ../configs/locked_broadcast_screen_v1_toronto_event483.json
      - uses: actions/upload-artifact@v4
        with:
          name: sheppard-adams-locked-broadcast-v1-xfg
          path: |
            artifacts/locked_sheppard_adams_xfg/adams_sheppard_toronto_locked_broadcast_v1_xfg_UHD.mp4
            artifacts/locked_sheppard_adams_xfg/adams_sheppard_toronto_locked_broadcast_v1_xfg_native.mp4
            artifacts/locked_sheppard_adams_xfg/release_freeze.jpg
            artifacts/locked_sheppard_adams_xfg/preview_7.10.jpg
            artifacts/locked_sheppard_adams_xfg/preview_8.93.jpg
            artifacts/locked_sheppard_adams_xfg/qa.json
            artifacts/event483_xfg.json
            artifacts/sheppard_adams_locked_broadcast_v1_xfg_UHD.zip
          if-no-files-found: error
          retention-days: 30

name: Adams Jazz volumetric v8 instrumented run

on:
  push:
    branches: [codex/three-camera-volumetric-v8-run]
    paths:
      - '.github/workflows/adams-jazz-three-camera-volumetric-v8-debug.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84 requests pillow
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Import boundary diagnostics
        run: |
          set -o pipefail
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee import_boundary.log
          import importlib
          names = [
            'cv2','numpy','torch','scipy.ndimage','moge.model.v2','torchvision.models.detection',
            'freeze_spin.build_portable_moge_pnp_freeview_v12',
            'freeze_spin.build_three_camera_diagnostic_v1',
            'freeze_spin.build_three_camera_diagnostic_v3',
            'freeze_spin.build_three_camera_diagnostic_v4',
            'freeze_spin.build_three_camera_diagnostic_v5',
            'freeze_spin.build_three_camera_diagnostic_v6',
            'freeze_spin.build_three_camera_volumetric_v8',
          ]
          for n in names:
              print('IMPORT_BEGIN', n, flush=True)
              importlib.import_module(n)
              print('IMPORT_OK', n, flush=True)
          PY

      - name: Retrieve exact event-489 source and locked Frame C
        run: |
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out target_source --workers 8
          python freeze_spin/prepare_locked_frame_c_sources.py \
            --clips target_source/clips \
            --out frame_c_target
          find frame_c_target -maxdepth 2 -type f -name '*.png' -printf '%p\n' | sort

      - name: Retrieve accepted Right Above Rim v73 metric report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs_v73
          gh run download 33911842169 \
            --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -f inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Render volumetric diagnostic with full logging
        run: |
          mkdir -p three_camera_v8
          BCAST="$(find frame_c_target -type f -name '*A_Broadcast*.png' | head -n 1)"
          echo "BCAST=$BCAST"
          test -n "$BCAST"
          set +e
          PYTHONPATH=. python -X dev -u -m freeze_spin.build_three_camera_volumetric_v8 \
            --frames-dir frame_c_target \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --out three_camera_v8 \
            --tokens 1200 \
            --voxel-cm 4.0 2>&1 | tee three_camera_v8/render.log
          rc=${PIPESTATUS[0]}
          echo "RENDER_EXIT=$rc"
          exit "$rc"

      - name: Encode native and UHD
        if: success()
        run: |
          ffmpeg -y -framerate 30 -i three_camera_v8/frame_%03d.png \
            -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart \
            three_camera_v8/adams_jazz_three_camera_volumetric_v8_native.mp4
          ffmpeg -y -i three_camera_v8/adams_jazz_three_camera_volumetric_v8_native.mp4 \
            -vf "hqdn3d=0.6:0.6:2.0:2.0,scale=3840:2160:flags=lanczos,cas=0.22,fps=30" \
            -c:v libx264 -preset medium -crf 16 -profile:v high -maxrate 36M -bufsize 72M \
            -pix_fmt yuv420p -movflags +faststart \
            three_camera_v8/adams_jazz_three_camera_volumetric_v8_UHD.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size \
            -of json three_camera_v8/adams_jazz_three_camera_volumetric_v8_UHD.mp4 \
            > three_camera_v8/uhd_ffprobe.json

      - name: Key still montage
        if: success()
        run: |
          cp three_camera_v8/frame_011.png three_camera_v8/v8_00deg.png
          cp three_camera_v8/frame_026.png three_camera_v8/v8_05deg.png
          cp three_camera_v8/frame_041.png three_camera_v8/v8_10deg.png
          cp three_camera_v8/frame_056.png three_camera_v8/v8_15deg.png
          cp three_camera_v8/frame_071.png three_camera_v8/v8_20deg.png
          cp three_camera_v8/frame_087.png three_camera_v8/v8_25deg.png
          python - <<'PY'
          from PIL import Image
          names=['v8_00deg.png','v8_05deg.png','v8_10deg.png','v8_15deg.png','v8_20deg.png','v8_25deg.png']
          ims=[Image.open('three_camera_v8/'+n).convert('RGB') for n in names]
          canvas=Image.new('RGB',(ims[0].width*3,ims[0].height*2))
          for i,im in enumerate(ims): canvas.paste(im,((i%3)*im.width,(i//3)*im.height))
          canvas.save('three_camera_v8/v8_key_arc_montage.png')
          PY

      - name: Package outputs and diagnostics
        if: always()
        run: |
          mkdir -p delivery
          cp import_boundary.log delivery/ 2>/dev/null || true
          cp three_camera_v8/render.log delivery/ 2>/dev/null || true
          cp three_camera_v8/*.json delivery/ 2>/dev/null || true
          cp three_camera_v8/*.mp4 delivery/ 2>/dev/null || true
          cp three_camera_v8/v8_*.png delivery/ 2>/dev/null || true
          cp three_camera_v8/*_body_mask.png delivery/ 2>/dev/null || true
          cp frame_c_target/*Left_Above_Rim*.png delivery/ 2>/dev/null || true
          cp frame_c_target/*Right_Above_Rim*.png delivery/ 2>/dev/null || true
          cp frame_c_target/*A_Broadcast*.png delivery/ 2>/dev/null || true
          if [ -f delivery/adams_jazz_three_camera_volumetric_v8_UHD.mp4 ]; then
            cd delivery && zip -0 adams_jazz_three_camera_volumetric_v8_package.zip \
              adams_jazz_three_camera_volumetric_v8_UHD.mp4 \
              three_camera_volumetric_v8_qa.json uhd_ffprobe.json v8_key_arc_montage.png \
              v8_00deg.png v8_05deg.png v8_10deg.png v8_15deg.png v8_20deg.png v8_25deg.png
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-volumetric-v8-debug-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Probe NBA historical full-game replay
on:
  push:
    branches: ['codex/adams-westbrook-hls-final']
    paths:
      - 'analysis/probe_nba_full_game_replay_metadata.py'
      - '.github/workflows/probe-nba-full-game-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract NBA full-game replay destination and metadata
        run: python -u analysis/probe_nba_full_game_replay_metadata.py

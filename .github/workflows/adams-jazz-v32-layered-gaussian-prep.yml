name: Adams Jazz v32 sharp latent quality-cluster prep

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/prepare_v32_layered_scene.py'
      - 'freeze_spin/export_v32_4dgs_panoptic.py'
      - 'freeze_spin/select_v32_quality_cluster.py'
      - 'freeze_spin/export_v32_quality_4dgs_panoptic.py'
      - '.github/workflows/adams-jazz-v32-layered-gaussian-prep.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v32-stage-a-quality-cluster-prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install v32 preparation runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gh zip
          python -m pip install --quiet requests pillow scipy opencv-python-headless scikit-image
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Retrieve native event camera clips
        run: |
          set -euxo pipefail
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py \
            --request freeze_spin/adams_jazz_dunk_request.json \
            --out target_source --workers 8
          test -n "$(find target_source/clips -type f -name '*_489_*_SOURCE.mp4' -print -quit)"

      - name: Retrieve accepted v11 exact-state evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v11
          gh run download 34535691949 --repo timeedmonds-maker/44 \
            --name adams-jazz-three-camera-exact-sync-v11-34535691949 \
            --dir inputs_v11
          test -s inputs_v11/exact_visual_state_v11_qa.json

      - name: Retrieve accepted Right Above Rim metric camera
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v73
          gh run download 33911842169 --repo timeedmonds-maker/44 \
            --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 \
            --dir inputs_v73
          test -s inputs_v73/right_above_rim_metric_camera_v73.json

      - name: Retrieve v31 focal identity and three-view ball QA
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_v31
          gh run download 34586071296 --repo timeedmonds-maker/44 \
            --name adams-jazz-three-camera-focal-identity-v31-34586071296 \
            --dir inputs_v31
          test -s inputs_v31/three_camera_mesh_v12_qa.json

      - name: Build v32 sharp latent source package
        run: |
          set -euxo pipefail
          mkdir -p v32_stage_a
          BCAST="$(find inputs_v11 -type f -name 'A_Broadcast_v11_*.png' | head -n 1)"
          test -n "$BCAST"
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.prepare_v32_layered_scene \
            --clips-dir target_source/clips \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report inputs_v73/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame "$BCAST" \
            --v31-qa inputs_v31/three_camera_mesh_v12_qa.json \
            --out v32_stage_a \
            --candidate-radius 4 \
            --burst-radius 6 2>&1 | tee v32_stage_a/prep.log

      - name: Assert v32 source invariants
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('v32_stage_a')
          m=json.load(open(r/'v32_scene_manifest.json'))
          assert m['resolution']==[960,540]
          assert abs(m['freeze']['chosen_global_delta_frames']) <= 2
          assert m['burst_frames_per_camera']==13
          assert len(m['cameras'])==3
          assert m['gpu_stage_contract']['held_out_camera_test_required'] is True
          assert m['all_on_court_people']['observation_count'] >= 8
          assert m['ball']['carried_three_view_solution_from_v31']['status']=='BALL_TRIANGULATED_THREE_VIEW_ENHANCED'
          for cam, rows in m['burst'].items():
              assert len(rows)==13, (cam,len(rows))
              assert all((r/row['file']).is_file() for row in rows)
          print('V32_SOURCE_PACKAGE_OK')
          PY

      - name: Select high-quality action cluster
        run: |
          set -euxo pipefail
          python -u -m freeze_spin.select_v32_quality_cluster \
            --stage-a v32_stage_a \
            --v31-qa inputs_v31/three_camera_mesh_v12_qa.json \
            --out v32_stage_a/v32_quality_cluster.json \
            --radius-cm 600 \
            --min-cameras 2 \
            --min-median-mask-px 1400 | tee v32_stage_a/quality_cluster.log
          test -s v32_stage_a/v32_quality_cluster.json

      - name: Assert quality cluster contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          q=json.load(open('v32_stage_a/v32_quality_cluster.json'))
          assert q['focal_player']['identity'].startswith('Steven Adams')
          assert q['focal_player']['source_camera_count'] >= 2
          assert 3 <= q['quality_required_person_count'] <= 7, q['quality_required_person_count']
          assert q['excluded_person_track_count'] > 0
          assert all(p['camera_count'] >= 2 for p in q['supporting_players'])
          assert q['final_camera_contract']['peripheral_people_quality_required'] is False
          print('V32_QUALITY_CLUSTER_OK')
          print(json.dumps({
            'quality_required_person_count':q['quality_required_person_count'],
            'supporting_track_ids':[p['track_id'] for p in q['supporting_players']],
            'excluded_person_track_count':q['excluded_person_track_count'],
            'final_camera_contract':q['final_camera_contract'],
          },indent=2))
          PY

      - name: Export quality-focused 4DGaussians PanopticSports dataset
        run: |
          set -euxo pipefail
          python -u -m freeze_spin.export_v32_quality_4dgs_panoptic \
            --stage-a v32_stage_a \
            --out v32_4dgs_panoptic | tee v32_stage_a/4dgs_export.log
          test -s v32_4dgs_panoptic/train_meta.json
          test -s v32_4dgs_panoptic/test_meta.json
          test -s v32_4dgs_panoptic/init_pt_cld.npz
          test -s v32_4dgs_panoptic/v32_4dgs_backend.json

      - name: Assert 4DGS held-out-camera dataset contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          r=Path('v32_4dgs_panoptic')
          b=json.load(open(r/'v32_4dgs_backend.json'))
          q=json.load(open('v32_stage_a/v32_quality_cluster.json'))
          tr=json.load(open(r/'train_meta.json'))
          assert b['native_resolution']==[960,540]
          assert b['time_steps']==13 and b['training_images']==39
          assert b['quality_required_person_count']==q['quality_required_person_count']
          assert b['person_quality_policy'].startswith('quality-qualified')
          assert len(tr['fn'])==13 and all(len(x)==3 for x in tr['fn'])
          assert all((r/'ims'/fn).is_file() for row in tr['fn'] for fn in row)
          d=np.load(r/'init_pt_cld.npz')['data']
          assert d.ndim==2 and d.shape[1]>=6 and len(d)>1000
          for cam,h in b['held_out_camera_manifests'].items():
              a=json.load(open(r/h['train_meta'])); t=json.load(open(r/h['test_meta']))
              assert len(a['fn'])==13 and all(len(x)==2 for x in a['fn'])
              assert len(t['fn'])==13 and all(len(x)==1 for x in t['fn'])
          print('V32_4DGS_QUALITY_CLUSTER_DATASET_OK')
          print(json.dumps(b,indent=2))
          PY

      - name: Package v32 quality-cluster GPU-ready inputs
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp -a v32_stage_a delivery/stage_a 2>/dev/null || true
          cp -a v32_4dgs_panoptic delivery/4dgs_panoptic 2>/dev/null || true
          test -s delivery/stage_a/v32_scene_manifest.json
          test -s delivery/stage_a/v32_quality_cluster.json
          test -s delivery/4dgs_panoptic/v32_4dgs_backend.json
          (cd delivery && zip -0 -r v32_sharp_latent_quality_cluster_4dgs_package.zip . \
            -x 'v32_sharp_latent_quality_cluster_4dgs_package.zip')

      - name: Upload v32 quality-cluster GPU-ready dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Discover Steven Adams Dunks 2025-26

on:
  push:
    paths:
      - 'discover_steven_adams_dunks_2025_26.py'
      - 'discover_adams_westbrook_dunk_events.py'
      - '.github/workflows/discover-steven-adams-dunks-2025-26.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact PBP parser
        run: pip install pandas pyreadr requests
      - name: Resolve exact Adams-Westbrook dunk events
        run: python3 discover_adams_westbrook_dunk_events.py
      - name: Upload exact event links
        uses: actions/upload-artifact@v4
        with:
          name: adams-westbrook-dunk-event-links-${{ github.run_id }}
          path: |
            adams_westbrook_dunk_event_links.csv
            adams_westbrook_dunk_event_links.json
          retention-days: 1

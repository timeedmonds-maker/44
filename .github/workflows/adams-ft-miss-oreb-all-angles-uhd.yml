name: Steven Adams FT-Miss OREB All Angles UHD

on:
  push:
    paths:
      - '.github/workflows/adams-ft-miss-oreb-all-angles-uhd.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public worker repo
        uses: actions/checkout@v4

      - name: Prepare FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor bin
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target vendor imageio-ffmpeg==0.6.0
          FFMPEG_EXE=$(PYTHONPATH=vendor python3 - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
          ln -sf "$FFMPEG_EXE" bin/ffmpeg
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Resolve strict Adams FT-miss OREB event IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, json, re, urllib.request
          from pathlib import Path

          URL = 'https://raw.githubusercontent.com/ramirobentes/nba_pbp_data/main/pbp-final-2026/data.csv'
          UA = 'timeedmonds-maker-44-adams-ft-miss-oreb'
          ADAMS_ID = '203500'
          HOU = 'HOU'
          ACTOR_RE = re.compile(r'^\s*(\d+)\s+(.+?)\s*$')

          def scalar(v):
              return '' if v is None else str(v).strip()

          def integer(v):
              try:
                  return int(float(v))
              except Exception:
                  return None

          def actor(v):
              s = scalar(v)
              m = ACTOR_RE.match(s)
              return (m.group(1), m.group(2).strip()) if m else ('', s)

          def gid(v):
              s = scalar(v)
              try:
                  s = str(int(float(s)))
              except Exception:
                  s = re.sub(r'\D', '', s)
              return s.zfill(10)

          request = urllib.request.Request(URL, headers={'User-Agent': UA})
          rows = []
          with urllib.request.urlopen(request, timeout=180) as response:
              text = io.TextIOWrapper(response, encoding='utf-8-sig', newline='')
              reader = csv.DictReader(text)
              fields = reader.fieldnames or []
              evc = next((c for c in ('event_num', 'event_id', 'eventnum', 'event_no', 'event_number') if c in fields), None)
              if not evc:
                  raise SystemExit(f'No event id column. fields={fields}')
              for source_row, row in enumerate(reader):
                  ngid = gid(row.get('game_id'))
                  if not ngid.startswith('002'):
                      continue
                  rows.append({
                      'source_row': source_row,
                      'game_id': ngid,
                      'event_id': integer(row.get(evc)),
                      'period': integer(row.get('period')),
                      'msg_type': integer(row.get('msg_type')),
                      'team': scalar(row.get('team_abb')).upper(),
                      'player1_name': scalar(row.get('player1_name')),
                      'description': scalar(row.get('description')),
                      'clock': scalar(row.get('clock')),
                      'game_date': scalar(row.get('game_date') or row.get('date')),
                      'team_home': scalar(row.get('team_home')),
                      'team_away': scalar(row.get('team_away')),
                  })

          rows.sort(key=lambda x: (x['game_id'], x['event_id'] if x['event_id'] is not None else 10**9, x['source_row']))
          events = []
          for i in range(len(rows) - 1):
              ft = rows[i]
              rb = rows[i + 1]
              if ft['msg_type'] != 3 or 'MISS' not in ft['description'].upper() or ft['team'] != HOU:
                  continue
              shooter_id, shooter_name = actor(ft['player1_name'])
              if shooter_id == ADAMS_ID:
                  continue
              if rb['game_id'] != ft['game_id'] or rb['period'] != ft['period']:
                  continue
              if rb['msg_type'] != 4:
                  continue
              rebounder_id, rebounder_name = actor(rb['player1_name'])
              if rebounder_id != ADAMS_ID or rb['team'] != ft['team']:
                  continue
              events.append({
                  'rank': len(events) + 1,
                  'game_id': rb['game_id'],
                  'event_id': rb['event_id'],
                  'ft_event_id': ft['event_id'],
                  'game_date': rb['game_date'],
                  'matchup': f"{rb['team_away']} @ {rb['team_home']}" if rb['team_away'] and rb['team_home'] else '',
                  'period': rb['period'],
                  'clock': rb['clock'],
                  'ft_shooter_id': shooter_id,
                  'ft_shooter': shooter_name,
                  'ft_description': ft['description'],
                  'rebounder_id': rebounder_id,
                  'rebounder': rebounder_name,
                  'rebound_description': rb['description'],
              })

          if not events:
              raise SystemExit('No qualifying events resolved')

          payload = {
              'label': 'Steven Adams 2025-26 OREB immediately after teammate missed FT - all camera angles UHD',
              'definition': '2025-26 regular season; HOU missed FT by non-Adams teammate; the very next ordered PBP row is a rebound credited to Steven Adams for HOU in the same game and period',
              'source': 'ramirobentes/nba_pbp_data pbp-final-2026/data.csv',
              'expected_count': len(events),
              'workers': 8,
              'events': events,
          }
          Path('request.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(f'QUALIFYING_EVENTS={len(events)}')
          for event in events:
              print(json.dumps(event, ensure_ascii=False))
          PY
          cat request.json

      - name: Feed exact event IDs to existing all-angle worker
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BINARY="$PWD/bin/ffmpeg" python3 build_kd_top10_all_angles.py --request request.json --out output --workers 8

      - name: Render deterministic UHD masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uhd
          for f in output/clips/*.mp4; do
            base=$(basename "$f" .mp4)
            ffmpeg -nostdin -y -v error -i "$f" \
              -map 0:v:0 -map 0:a:0? \
              -vf 'hqdn3d=0.6:0.6:2.0:2.0,scale=3840:2160:flags=lanczos,cas=0.22,fps=30' \
              -c:v libx264 -preset fast -crf 16 -maxrate 36M -bufsize 72M -profile:v high -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart \
              "uhd/${base}_UHD.mp4"
          done
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          files = sorted(Path('uhd').glob('*.mp4'))
          if not files:
              raise SystemExit('No UHD files')
          qa = []
          for path in files:
              probe = subprocess.run(['ffmpeg', '-hide_banner', '-i', str(path), '-f', 'null', '-'], capture_output=True, text=True)
              text = probe.stderr or ''
              ok = '3840x2160' in text and 'Video:' in text
              qa.append({'file': path.name, 'bytes': path.stat().st_size, 'uhd_3840x2160': ok})
              if not ok:
                  raise SystemExit(f'UHD QA failed: {path}')
          Path('uhd_qa.json').write_text(json.dumps(qa, indent=2))
          print(f'UHD_FILES={len(files)}')
          PY

      - name: Package approximately 95 MB download parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          MAX = 95_000_000
          files = sorted(Path('uhd').glob('*.mp4'))
          groups = []
          current = []
          current_bytes = 0
          for path in files:
              size = path.stat().st_size
              if current and current_bytes + size > MAX:
                  groups.append(current)
                  current = []
                  current_bytes = 0
              current.append(path)
              current_bytes += size
          if current:
              groups.append(current)
          manifest = []
          for i, group in enumerate(groups, 1):
              zpath = Path('parts') / f'steven_adams_ft_miss_oreb_all_angles_UHD_part_{i:02d}.zip'
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as archive:
                  for path in group:
                      archive.write(path, arcname=f'videos/{path.name}')
                  archive.write('request.json', arcname='event_manifest.json')
                  archive.write('output/qa.json', arcname='video_qa.json')
                  archive.write('uhd_qa.json', arcname='uhd_qa.json')
              manifest.append({
                  'part': i,
                  'filename': zpath.name,
                  'bytes': zpath.stat().st_size,
                  'mb_decimal': round(zpath.stat().st_size / 1_000_000, 2),
                  'video_files': len(group),
              })
          Path('parts/parts.json').write_text(json.dumps(manifest, indent=2))
          print('DOWNLOAD_PARTS=' + json.dumps(manifest))
          PY
          ls -lh parts

      - name: Upload all approximately 95 MB parts and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-ft-miss-oreb-all-angles-UHD-${{ github.run_id }}
          path: |
            parts/*.zip
            parts/parts.json
            request.json
            output/qa.json
            uhd_qa.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

name: Steven Adams FT-Miss OREB All Angles UHD

on:
  push:
    paths:
      - '.github/workflows/adams-ft-miss-oreb-all-angles-uhd.yml'
      - 'resolve_adams_ft_miss_oreb_request.py'
      - 'build_kd_top10_all_angles.py'
      - 'nba_video_worker.py'
      - 'tools/render_deterministic_master.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public worker repo
        uses: actions/checkout@v4

      - name: Prepare dependencies and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir pandas pyreadr requests
          mkdir -p vendor bin
          python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --target vendor imageio-ffmpeg==0.6.0
          FFMPEG_EXE=$(PYTHONPATH=vendor python3 - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
          ln -sf "$FFMPEG_EXE" bin/ffmpeg
          ln -sf "$FFMPEG_EXE" bin/ffprobe || true
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Resolve strict Adams FT-miss OREB event IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 resolve_adams_ft_miss_oreb_request.py
          cat request.json

      - name: Feed exact event IDs to existing all-angle worker
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BINARY="$PWD/bin/ffmpeg" python3 build_kd_top10_all_angles.py --request request.json --out output --workers 8

      - name: Render deterministic UHD masters with repository standard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uhd qa_uhd
          for f in output/clips/*.mp4; do
            base=$(basename "$f" .mp4)
            python3 tools/render_deterministic_master.py \
              "$f" "uhd/${base}_UHD.mp4" \
              --profile uhd \
              --qa-json "qa_uhd/${base}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('uhd').glob('*.mp4'))
          qa_files = sorted(Path('qa_uhd').glob('*.json'))
          if not files:
              raise SystemExit('No UHD files')
          if len(files) != len(qa_files):
              raise SystemExit(f'UHD QA count mismatch: files={len(files)} qa={len(qa_files)}')
          qa = [json.loads(p.read_text()) for p in qa_files]
          Path('uhd_qa.json').write_text(json.dumps(qa, indent=2))
          print(f'UHD_FILES={len(files)}')
          PY

      - name: Package approximately 95 MB download parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          MAX = 95_000_000
          files = sorted(Path('uhd').glob('*.mp4'))
          groups = []
          current = []
          current_bytes = 0
          for path in files:
              size = path.stat().st_size
              if current and current_bytes + size > MAX:
                  groups.append(current)
                  current = []
                  current_bytes = 0
              current.append(path)
              current_bytes += size
          if current:
              groups.append(current)
          manifest = []
          for i, group in enumerate(groups, 1):
              zpath = Path('parts') / f'steven_adams_ft_miss_oreb_all_angles_UHD_part_{i:02d}.zip'
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as archive:
                  for path in group:
                      archive.write(path, arcname=f'videos/{path.name}')
                  archive.write('request.json', arcname='event_manifest.json')
                  archive.write('output/qa.json', arcname='video_qa.json')
                  archive.write('uhd_qa.json', arcname='uhd_qa.json')
              manifest.append({
                  'part': i,
                  'filename': zpath.name,
                  'bytes': zpath.stat().st_size,
                  'mb_decimal': round(zpath.stat().st_size / 1_000_000, 2),
                  'video_files': len(group),
              })
          Path('parts/parts.json').write_text(json.dumps(manifest, indent=2))
          print('DOWNLOAD_PARTS=' + json.dumps(manifest))
          PY
          ls -lh parts

      - name: Upload all approximately 95 MB parts and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-ft-miss-oreb-all-angles-UHD-${{ github.run_id }}
          path: |
            parts/*.zip
            parts/parts.json
            request.json
            output/qa.json
            uhd_qa.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

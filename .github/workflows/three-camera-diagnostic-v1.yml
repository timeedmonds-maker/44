name: Three-camera freeview diagnostic v1

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/build_three_camera_diagnostic_v1.py'
      - 'freeze_spin/build_three_camera_diagnostic_v2.py'
      - 'freeze_spin/build_three_camera_diagnostic_v3.py'
      - '.github/workflows/three-camera-diagnostic-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
          python - <<'PY' || python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git

      - name: Recover certified Left Above Rim v35 source
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-wide-court-v35-33654394334
          path: lar_source
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33654394334

      - name: Recover certified Right Above Rim v73 source and pose
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-right-above-rim-metric-camera-v73-33911842169
          path: rar_source
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33911842169

      - name: Recover certified Broadcast v90 source evidence
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-broadcast-shared-center-v90-33954197537
          path: broadcast_source
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33954197537

      - name: Bind immutable central Frame C images
        run: |
          mkdir -p three_frames
          cp lar_source/K_Left_Above_Rim_8.653093s_frame0259.png three_frames/
          cp rar_source/L_Right_Above_Rim_8.562013s_frame0257.png three_frames/
          cp broadcast_source/A_Broadcast_9.194613s_frame0276.png three_frames/
          test -f rar_source/right_above_rim_metric_camera_v73.json
          test -f broadcast_source/b21_7.952s.png
          sha256sum three_frames/*.png

      - name: Render honest three-camera 0-to-25 degree diagnostic
        run: |
          PYTHONPATH="$PWD/freeze_spin:$PWD" python -m freeze_spin.build_three_camera_diagnostic_v3 \
            --frames-dir three_frames \
            --registry freeze_spin/adams_jazz_game_camera_registry_v5.json \
            --rar-report rar_source/right_above_rim_metric_camera_v73.json \
            --broadcast-event-frame broadcast_source/b21_7.952s.png \
            --out three_camera_v1 \
            --tokens 1400

      - name: Encode native-resolution deliverable
        run: |
          ffmpeg -y -framerate 30 -i three_camera_v1/frame_%03d.png \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -movflags +faststart \
            three_camera_v1/adams_jazz_three_camera_diagnostic_native.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json \
            three_camera_v1/adams_jazz_three_camera_diagnostic_native.mp4 > three_camera_v1/native_probe.json
          cd three_camera_v1
          zip -9 adams_jazz_three_camera_diagnostic_native.zip adams_jazz_three_camera_diagnostic_native.mp4 three_camera_diagnostic_qa.json native_probe.json

      - name: Upload native diagnostic video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-three-camera-diagnostic-native-v3-${{ github.run_id }}
          path: |
            three_camera_v1/adams_jazz_three_camera_diagnostic_native.mp4
            three_camera_v1/adams_jazz_three_camera_diagnostic_native.zip
            three_camera_v1/three_camera_diagnostic_qa.json
            three_camera_v1/native_probe.json
            three_camera_v1/frame_000.png
            three_camera_v1/frame_050.png
            three_camera_v1/frame_105.png
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

# native-resolution presentation only; no upscale; v3 per-camera forward-axis sign normalization

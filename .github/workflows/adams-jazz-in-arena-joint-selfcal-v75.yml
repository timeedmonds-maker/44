name: Adams Jazz In Arena joint selfcal live v75

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-jazz-in-arena-joint-selfcal-v75.yml'
      - 'freeze_spin/solve_in_arena_joint_selfcal_v56a.py'
      - 'freeze_spin/solve_in_arena_direct_camera_v55a.py'
      - 'freeze_spin/prove_in_arena_noncoplanar_center_v54.py'

permissions:
  contents: read
  actions: read

jobs:
  selfcal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic geometry runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 scipy==1.14.1

      - name: Recover sealed v53b target/floor/family
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-in-arena-static-scene-v53b-33723851368
          path: sealed
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33723851368

      - name: Recover sealed v53a native optical states
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-in-arena-same-game-scan-v53a-33718582878
          path: states
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33718582878

      - name: Verify immutable evidence
        run: |
          test -f sealed/E_In_Arena_9.062573s_frame0272.png
          test -f sealed/in_arena_floor_v52.json
          test -f sealed/in_arena_static_scene_family_v53b.json
          echo 'a3ae19c3b7439e21ca33a49f2140a9da605e2f62fa1b6759fb5233341d8e38f4  sealed/E_In_Arena_9.062573s_frame0272.png' | sha256sum -c -
          python - <<'PY'
          import json
          a=json.load(open('sealed/in_arena_floor_v52.json'))
          b=json.load(open('sealed/in_arena_static_scene_family_v53b.json'))
          assert a['status']=='PASS_IN_ARENA_FLOOR_V52'
          assert b['status']=='PASS_IN_ARENA_STATIC_SCENE_FAMILY_V53B'
          for r in b['selected_candidates']:
              assert __import__('pathlib').Path('states',r['file']).is_file(), r['file']
          print('SEALED V75 INPUTS OK',[(r['event_probe'],r['frame']) for r in b['selected_candidates']])
          PY

      - name: Run rotational joint self-calibration
        run: |
          python -m freeze_spin.solve_in_arena_joint_selfcal_v56a \
            --target sealed/E_In_Arena_9.062573s_frame0272.png \
            --states states \
            --floor-proof sealed/in_arena_floor_v52.json \
            --family-proof sealed/in_arena_static_scene_family_v53b.json \
            --observations freeze_spin/adams_jazz_in_arena_floor_v52.json \
            --out v75 \
            --root-limit 9 \
            --max-nfev 5000

      - name: Emit fail-closed live verdict
        run: |
          python - <<'PY'
          import json
          p=json.load(open('v75/in_arena_joint_selfcal_v56a.json'))
          assert p['status']=='DIAGNOSTIC_IN_ARENA_JOINT_SELFCAL_V56A'
          assert p['permissions']['metric_event_camera_allowed'] is False
          assert p['permissions']['replay_render_allowed'] is False
          q=p['best']; m=p['multistart']
          print('V75_DIAGNOSTIC_COMPLETE')
          print('center_cm',q['camera_center_cm'])
          print('pp_px',q['target_principal_point_px'])
          print('focal_px',q['target_focal_px'])
          print('line_p95_px',q['line_p95_px'])
          print('restricted_p95_px',q['restricted_p95_px'])
          print('ft_holdout_p95_px',q['free_throw_holdout_p95_px'])
          print('max_rim_center_error_px',q['max_rim_center_error_px'])
          print('rotation_homography_p95_px',q['rotation_homography_p95_px'])
          print('competitive_roots',m['competitive_root_count'])
          print('max_root_center_shift_cm',m['max_competitive_center_shift_cm'])
          print('max_root_action_volume_p95_px',m['max_competitive_action_volume_p95_px'])
          PY

      - name: Upload v75 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-in-arena-joint-selfcal-v75-${{ github.run_id }}
          path: v75/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

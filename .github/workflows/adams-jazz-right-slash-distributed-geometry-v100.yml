name: Adams Jazz Right Slash distributed geometry v100

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-jazz-right-slash-distributed-geometry-v100.yml'
      - 'freeze_spin/scan_distributed_same_game_camera_geometry_v100.py'
      - 'freeze_spin/scan_same_game_camera_priors.py'
      - 'nba_video_worker.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adams-jazz-right-slash-distributed-geometry-v100.yml'
      - 'freeze_spin/scan_distributed_same_game_camera_geometry_v100.py'

permissions:
  contents: read

jobs:
  geometry-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install native video runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy==1.26.4 opencv-python-headless==4.10.0.84 requests

      - name: Mine full-game distributed Right Slash geometry states
        run: |
          python -m freeze_spin.scan_distributed_same_game_camera_geometry_v100 \
            --game-id 0022500301 \
            --camera-label 'Right Slash' \
            --event-start 5 \
            --event-stop 1405 \
            --event-step 10 \
            --segments 6 \
            --per-segment 3 \
            --frames-per-clip 7 \
            --min-clips 12 \
            --out right_slash_geometry_v100

      - name: Enforce discovery-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('right_slash_geometry_v100/distributed_same_game_geometry_bank_v100.json').read_text())
          assert p['status']=='DISCOVERY_ONLY_NO_PROMOTION'
          assert p['game_id']=='0022500301'
          assert p['camera_label']=='Right Slash'
          assert p['successful_clip_count']>=12
          assert all(v is False for v in p['permissions'].values())
          segments=sorted({e['segment'] for e in p['events'] if e.get('status')=='ok'})
          assert len(segments)>=4, segments
          print('V100_DISTRIBUTED_GEOMETRY_BANK_OK',p['successful_clip_count'],'segments',segments)
          PY

      - name: Package native geometry evidence
        if: always()
        run: |
          mkdir -p delivery
          cp right_slash_geometry_v100/distributed_same_game_geometry_bank_v100.json delivery/ 2>/dev/null || true
          cp right_slash_geometry_v100/distributed_geometry_candidates_montage.png delivery/ 2>/dev/null || true
          cp right_slash_geometry_v100/event_*_Right_Slash_sheet.png delivery/ 2>/dev/null || true
          for d in right_slash_geometry_v100/event_*_frames; do
            [ -d "$d" ] || continue
            cp -a "$d" delivery/
          done

      - name: Upload v100 geometry bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-distributed-geometry-v100-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

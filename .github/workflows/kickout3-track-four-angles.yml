name: Screen Tracker - Kickout 3 four-angle tracking

on:
  push:
    branches: [screen-tracker-kickout-3]
    paths:
      - 'screen_tracker_kickout3/run_angle_tracking.py'
      - 'screen_tracker_kickout3/fetch_lineup_roster.py'
      - '.github/workflows/kickout3-track-four-angles.yml'
  workflow_dispatch:

jobs:
  track:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: cle_broadcast
            game: '0022500255'
            event: 247
            angle: 'Broadcast'
            start: '7.6'
            end: '12.3'
          - key: cle_in_arena
            game: '0022500255'
            event: 247
            angle: 'In Arena'
            start: '7.6'
            end: '12.3'
          - key: tor_broadcast
            game: '0022500131'
            event: 585
            angle: 'Broadcast'
            start: '7.5'
            end: '12.7'
          - key: tor_in_arena
            game: '0022500131'
            event: 585
            angle: 'In Arena'
            start: '7.5'
            end: '12.7'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git zip
      - name: Install Screen Tracker CV stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          git clone -q https://github.com/ortizeg/object-detection-eval.git /tmp/object-detection-eval
          pip install -e /tmp/object-detection-eval
          pip install git+https://github.com/roboflow/trackers.git
          pip install pyreadr requests ultralytics scipy 'numpy<2' pandas
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
      - name: Download deterministic CV models
        run: |
          mkdir -p artifacts/models
          curl -L --retry 3 -o artifacts/models/rfdetr_m_640.onnx https://huggingface.co/ortizeg/basketball-rf-detr-m-640/resolve/main/rfdetr_m_640.onnx
          echo '708789b50c42b5265cced64276a8beb1b7f294d324f954d359fd8a2d01f5a939  artifacts/models/rfdetr_m_640.onnx' | sha256sum -c -
          curl -L --retry 3 -o artifacts/models/court_yolo11m_pose.pt https://huggingface.co/AnzeZ/basketball-court-yolo11m-pose/resolve/main/best.pt
      - name: Build exact official-angle tracks
        run: |
          python screen_tracker_kickout3/run_angle_tracking.py \
            --angle-label '${{ matrix.angle }}' \
            --game '${{ matrix.game }}' --event '${{ matrix.event }}' \
            --start-s '${{ matrix.start }}' --end-s '${{ matrix.end }}' \
            --analysis-fps 12 --number-fps 4 --court-fps 2 \
            --detector-onnx artifacts/models/rfdetr_m_640.onnx \
            --object-eval-src /tmp/object-detection-eval/src \
            --court-model artifacts/models/court_yolo11m_pose.pt \
            --nbacv-src /tmp/nbacv/src \
            --out 'artifacts/${{ matrix.key }}/tracks'
      - name: Build exact ten-player roster
        run: |
          python screen_tracker_kickout3/fetch_lineup_roster.py \
            --game '${{ matrix.game }}' --event '${{ matrix.event }}' \
            --out 'artifacts/${{ matrix.key }}/roster.json'
      - name: Install jersey OCR dependencies
        run: |
          pip install timm pytorch-lightning pillow tqdm pyyaml gdown scikit-learn nltk
          mkdir -p /tmp/nbacv/models
          gdown -q 1uRln22tlhneVt3P6MePmVxBWSLMsL3bm -O /tmp/nbacv/models/parseq_soccernet.ckpt
          gdown -q 18HAuZbge3z8TSfRiX_FzsnKgiBs-RRNw -O /tmp/nbacv/models/legibility_soccernet.pth
      - name: Resolve identities from lineup-constrained jersey evidence
        run: |
          cd /tmp/nbacv
          python "$GITHUB_WORKSPACE/tools/adams_event_track_identity_ocr.py" \
            --tracks "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}/tracks/tracks.csv" \
            --source "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}/tracks/source_native.mp4" \
            --context "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}/tracks/context.json" \
            --roster "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}/roster.json" \
            --nbacv-src /tmp/nbacv/src \
            --out "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}/identity"
      - name: QA exact angle and emit summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, pandas as pd
          key='${{ matrix.key }}'; root=pathlib.Path('artifacts')/key
          ctx=json.load(open(root/'tracks/context.json'))
          ident=pd.read_csv(root/'identity/track_identity.csv') if (root/'identity/track_identity.csv').exists() else pd.DataFrame()
          summary={'key':key,'game_id':'${{ matrix.game }}','event_num':${{ matrix.event }},'angle':'${{ matrix.angle }}','track_rows':len(pd.read_csv(root/'tracks/tracks.csv')) if (root/'tracks/tracks.csv').exists() else 0,'named':ident[ident.name.notna()][['track_id','player_id','name','team','jersey']].to_dict('records') if len(ident) else [],'identity_qa':json.load(open(root/'identity/qa.json')) if (root/'identity/qa.json').exists() else None}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickout3-track-${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 30

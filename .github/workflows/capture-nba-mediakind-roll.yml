name: Capture NBA MediaKind roll
on:
  push:
    paths:
      - '.github/workflows/capture-nba-mediakind-roll.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose NBA player bootstrap
        shell: bash
        run: |
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const PAGE = 'https://www.nba.com/watch/video/assist-of-the-year-steven-adams';
          const interesting = [];
          const failures = [];
          const consoleEvents = [];
          function safeUrl(u){
            try {
              const x=new URL(u);
              for (const k of [...x.searchParams.keys()]) {
                if (/token|auth|sig|signature|hdnts|policy|key-pair-id|expires/i.test(k)) x.searchParams.set(k,'REDACTED');
              }
              return x.toString();
            } catch { return u; }
          }

          (async()=>{
            fs.mkdirSync('capture',{recursive:true});
            const browser = await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
            const context = await browser.newContext({
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              viewport:{width:1440,height:1000},
              locale:'en-US',
              timezoneId:'America/New_York',
              extraHTTPHeaders:{'Accept-Language':'en-US,en;q=0.9'}
            });
            await context.addInitScript(() => {
              try { Object.defineProperty(navigator,'webdriver',{get:()=>undefined}); } catch(e) {}
            });
            const page = await context.newPage();

            page.on('console', msg => {
              const rec={type:msg.type(),text:msg.text().slice(0,1500)};
              consoleEvents.push(rec);
              if (msg.type()==='error' || msg.type()==='warning') console.log('CONSOLE',rec.type,rec.text);
            });
            page.on('pageerror', err => { failures.push({type:'pageerror',text:String(err).slice(0,2000)}); console.log('PAGEERROR',String(err).slice(0,1500)); });
            page.on('requestfailed', req => {
              const rec={type:'requestfailed',url:safeUrl(req.url()),failure:req.failure()}; failures.push(rec);
              console.log('REQFAIL',rec.url,JSON.stringify(rec.failure));
            });
            page.on('request', req => {
              const u=req.url();
              if (/identity\.nba|ottapp|\/v1\/client\/roll|\.m3u8|\.mpd|akamaitoken/i.test(u)) {
                const hs=req.headers();
                const rec={type:'request',method:req.method(),url:safeUrl(u),headerNames:Object.keys(hs).sort(),postData:req.postData()||null};
                interesting.push(rec);
                console.log('REQ',rec.method,rec.url,'headers',rec.headerNames.join(','));
              }
            });
            page.on('response', async resp => {
              const u=resp.url();
              const ct=(await resp.allHeaders().catch(()=>({})))['content-type']||'';
              if (resp.status()>=400 && (/\.js(?:\?|$)/i.test(u) || /nba\.com/i.test(u))) {
                failures.push({type:'http',status:resp.status(),url:safeUrl(u),contentType:ct});
                console.log('HTTPFAIL',resp.status(),safeUrl(u),ct);
              }
              if (/identity\.nba|ottapp|\/v1\/client\/roll|\.m3u8|\.mpd|akamaitoken/i.test(u)) {
                const rec={type:'response',status:resp.status(),url:safeUrl(u),contentType:ct};
                if (/\/v1\/client\/roll|play-options/i.test(u)) {
                  try { rec.body=(await resp.text()).slice(0,30000); } catch(e) { rec.body=''; }
                }
                interesting.push(rec);
                console.log('RESP',rec.status,rec.url,rec.contentType);
              }
            });

            const mainResp=await page.goto(PAGE,{waitUntil:'domcontentloaded',timeout:90000});
            console.log('MAIN_STATUS',mainResp ? mainResp.status() : null,'FINAL_URL',page.url());
            await page.waitForTimeout(10000);
            console.log('TITLE',await page.title());
            const html=await page.content();
            console.log('HTML_LEN',html.length,'BODY_TEXT',JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).slice(0,3000)));
            fs.writeFileSync('capture/page.html',html);
            await page.screenshot({path:'capture/page.png',fullPage:true}).catch(()=>{});

            const selectors=['button[aria-label*="play" i]','button:has-text("Play")','[data-testid*="play" i]','video'];
            for (const sel of selectors) {
              try {
                const loc=page.locator(sel).first();
                console.log('SELECTOR_COUNT',sel,await loc.count());
                if (await loc.count()) { await loc.click({force:true,timeout:3000}); await page.waitForTimeout(5000); }
              } catch(e) { console.log('SELECTOR_ERR',sel,String(e).slice(0,500)); }
            }
            try { await page.keyboard.press('Space'); } catch(e) {}
            await page.waitForTimeout(15000);

            const cookies=await context.cookies();
            console.log('COOKIE_NAMES',cookies.map(c=>c.name+':'+c.value.length).join(','));
            fs.writeFileSync('capture/network_sanitized.json',JSON.stringify(interesting,null,2));
            fs.writeFileSync('capture/failures.json',JSON.stringify(failures,null,2));
            fs.writeFileSync('capture/console.json',JSON.stringify(consoleEvents,null,2));
            const vids=await page.locator('video').evaluateAll(vs=>vs.map(v=>({src:v.src,currentSrc:v.currentSrc,readyState:v.readyState,duration:v.duration,paused:v.paused}))).catch(()=>[]);
            fs.writeFileSync('capture/video_elements.json',JSON.stringify(vids,null,2));
            console.log('ROLL_RESPONSES',interesting.filter(x=>x.type==='response' && /\/v1\/client\/roll/i.test(x.url) && x.body).length);
            console.log('VIDEO_ELEMENTS',JSON.stringify(vids));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-mediakind-roll-capture
          path: capture/
          if-no-files-found: ignore
          retention-days: 7

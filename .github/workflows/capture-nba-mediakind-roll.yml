name: Capture NBA MediaKind roll
on:
  push:
    paths:
      - '.github/workflows/capture-nba-mediakind-roll.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture NBA player resolver
        shell: bash
        run: |
          cat > capture.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const PAGE = 'https://www.nba.com/watch/video/assist-of-the-year-steven-adams';
          const interesting = [];
          function safeUrl(u){
            try {
              const x=new URL(u);
              for (const k of [...x.searchParams.keys()]) {
                if (/token|auth|sig|signature|hdnts|policy|key-pair-id|expires/i.test(k)) x.searchParams.set(k,'REDACTED');
              }
              return x.toString();
            } catch { return u; }
          }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              viewport:{width:1440,height:1000}
            });
            const page = await context.newPage();

            page.on('request', req => {
              const u=req.url();
              if (/identity\.nba|ottapp|\/v1\/client\/roll|\.m3u8|\.mpd|akamaitoken/i.test(u)) {
                const hs=req.headers();
                const rec={type:'request',method:req.method(),url:safeUrl(u),headerNames:Object.keys(hs).sort(),postData:req.postData()||null};
                interesting.push(rec);
                console.log('REQ',rec.method,rec.url,'headers',rec.headerNames.join(','),'post',rec.postData||'');
              }
            });

            page.on('response', async resp => {
              const u=resp.url();
              if (/identity\.nba|ottapp|\/v1\/client\/roll|\.m3u8|\.mpd|akamaitoken/i.test(u)) {
                const h=await resp.allHeaders().catch(()=>({}));
                const rec={type:'response',status:resp.status(),url:safeUrl(u),contentType:h['content-type']||''};
                if (/\/v1\/client\/roll|play-options/i.test(u)) {
                  try { rec.body=(await resp.text()).slice(0,30000); } catch(e) { rec.body=''; }
                }
                interesting.push(rec);
                console.log('RESP',rec.status,rec.url,rec.contentType);
              }
            });

            await page.goto(PAGE,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(7000);
            const selectors=['button[aria-label*="play" i]','button:has-text("Play")','[data-testid*="play" i]','video'];
            for (const sel of selectors) {
              try {
                const loc=page.locator(sel).first();
                if (await loc.count()) {
                  await loc.click({force:true,timeout:3000});
                  await page.waitForTimeout(5000);
                }
              } catch(e) {}
            }
            try { await page.keyboard.press('Space'); } catch(e) {}
            await page.waitForTimeout(15000);

            const cookies=await context.cookies();
            console.log('COOKIE_NAMES',cookies.map(c=>c.name+':'+c.value.length).join(','));
            fs.mkdirSync('capture',{recursive:true});
            fs.writeFileSync('capture/network_sanitized.json',JSON.stringify(interesting,null,2));

            const rolls=interesting.filter(x=>x.type==='response' && /\/v1\/client\/roll/i.test(x.url) && x.body);
            console.log('ROLL_RESPONSES',rolls.length);
            for (let i=0;i<rolls.length;i++) {
              console.log('ROLL_BODY_'+i,rolls[i].body.slice(0,16000));
            }
            const vids=await page.locator('video').evaluateAll(vs=>vs.map(v=>({src:v.src,currentSrc:v.currentSrc,readyState:v.readyState,duration:v.duration,paused:v.paused}))).catch(()=>[]);
            fs.writeFileSync('capture/video_elements.json',JSON.stringify(vids,null,2));
            console.log('VIDEO_ELEMENTS',JSON.stringify(vids));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.js
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-mediakind-roll-capture
          path: capture/
          if-no-files-found: ignore
          retention-days: 7

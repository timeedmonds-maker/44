name: Adams Jazz Right Slash all-pair radial v104

on:
  workflow_dispatch:
  push:
    branches: [right-slash-v100b-run]
    paths:
      - 'freeze_spin/diagnose_right_slash_allpair_radial_v104.py'
      - '.github/workflows/adams-jazz-right-slash-allpair-radial-v104.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose-allpair-radial:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable v100b geometry bank
        uses: actions/download-artifact@v4
        with:
          name: right-slash-distributed-geometry-v100b-33980277033
          path: bank
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33980277033
      - name: Verify immutable source bank
        run: |
          python - <<'PY'
          import json
          q=json.load(open('bank/distributed_same_game_geometry_bank_v100.json'))
          assert q['status']=='DISCOVERY_ONLY_NO_PROMOTION'
          assert q['game_id']=='0022500301'
          assert q['camera_label']=='Right Slash'
          assert int(q['successful_clip_count'])==18
          assert all(v is False for v in q['permissions'].values())
          print('BANK_OK',q['successful_clip_count'])
          PY
      - name: Run all-pair graph plus minimal radial model
        run: python -m freeze_spin.diagnose_right_slash_allpair_radial_v104 --bank bank --out v104 --top-event-pairs 50 --top-frame-pairs 10
      - name: Enforce diagnostic-only semantics
        run: |
          python - <<'PY'
          import json
          q=json.load(open('v104/right_slash_allpair_radial_v104.json'))
          assert q['metric_event_camera_allowed'] is False
          assert q['replay_render_allowed'] is False
          print('STATUS',q['status'])
          print('COMPONENT',q.get('component_containing_415_540'))
          print('CORE',q.get('robust_core_events'))
          print('PP',q.get('physical_full_fit',{}).get('pp'))
          print('K1',q.get('physical_full_fit',{}).get('k1'))
          print('MAX_PP_LOO',q.get('max_leave_one_event_out_pp_shift_px'))
          print('MAX_K1_LOO',q.get('max_leave_one_event_out_k1_abs_shift'))
          print('PRIOR_ALLOWED',q.get('principal_point_prior_allowed'))
          PY
      - name: Package v104 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v104/*.json delivery/ 2>/dev/null || true
          cp bank/distributed_same_game_geometry_bank_v100.json delivery/v100b_source_manifest.json
      - name: Upload v104 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-allpair-radial-v104-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

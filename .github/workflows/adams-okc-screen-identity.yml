name: Adams OKC targeted screen identity
on:
  workflow_dispatch:
  push:
    branches: [codex/adams-screen-okc-opener]
    paths:
      - 'tools/adams_screen_candidate_crops.py'
      - 'tools/adams_screen_parseq_identity.py'
      - '.github/workflows/adams-okc-screen-identity.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact game universe
        run: |
          pip install pandas pyreadr requests
          python tools/build_adams_okc_opener_possessions.py
      - name: Download temporal candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: adams-okc-temporal-merged
          path: artifacts/temporal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: timeedmonds-maker/44
          run-id: 34743127689
      - name: Correct persistence and build four identity shards
        run: |
          mkdir -p artifacts/identity_plan/shards
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          s=pd.read_csv('artifacts/temporal/adams_okc_screen_sequences.csv',dtype={'game_id':str})
          s=s[s.end_sample>s.start_sample].copy()
          u=pd.read_csv('artifacts/adams_okc_opener/adams_okc_opener_possessions.csv',dtype={'game_id':str})
          keep=['possession_uid','period','start_time','end_time','pts_poss','type_end','lineup_team','lineup_opp']
          d=s.merge(u[keep],on='possession_uid',how='left').sort_values(['period','start_time','event_num','start_sample'],ascending=[True,False,True,True]).reset_index(drop=True)
          d.insert(0,'candidate_id',[f'OKC-{i+1:02d}' for i in range(len(d))])
          d.to_csv('artifacts/identity_plan/adams_okc_identity_candidates.csv',index=False)
          for i in range(4): d.iloc[i::4].to_csv(f'artifacts/identity_plan/shards/shard_{i}.csv',index=False)
          print({'distinct_frame_candidates':len(d),'possessions':d.possession_uid.nunique(),'events':d.event_num.nunique()})
          PY
      - name: Export tiny detector once
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install ultralytics onnx onnxslim
          mkdir -p artifacts/models
          python - <<'PY'
          from ultralytics import YOLO
          from pathlib import Path
          p=Path(YOLO('yolo11n.pt').export(format='onnx',imgsz=640,opset=12,dynamic=False,simplify=True,nms=False))
          Path('artifacts/models/yolo11n.onnx').write_bytes(p.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adams-okc-identity-bundle
          path: |
            artifacts/identity_plan
            artifacts/models/yolo11n.onnx
          if-no-files-found: error

  crop:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight video stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install pandas requests opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          name: adams-okc-identity-bundle
          path: artifacts/bundle
      - name: Build participant jersey crops and evidence sheets
        run: |
          python tools/adams_screen_candidate_crops.py \
            --input "artifacts/bundle/identity_plan/shards/shard_${{ matrix.shard }}.csv" \
            --onnx-model artifacts/bundle/models/yolo11n.onnx \
            --out "artifacts/crops/shard_${{ matrix.shard }}" \
            --sample-fps 6.0 --max-seconds 14 --target-hls-width 640
      - uses: actions/upload-artifact@v4
        with:
          name: adams-okc-screen-crops-${{ matrix.shard }}
          path: artifacts/crops/shard_${{ matrix.shard }}
          if-no-files-found: error

  identity:
    needs: [prepare, crop]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: adams-okc-identity-bundle
          path: artifacts/bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: adams-okc-screen-crops-*
          path: artifacts/all_crops
          merge-multiple: true
      - name: Install CPU jersey OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install pandas numpy opencv-python-headless timm pytorch-lightning pillow tqdm pyyaml gdown scipy scikit-learn nltk
          git clone -q https://github.com/cyrushadavi1/nba_video_analysis_v2.git /tmp/nbacv
          cd /tmp/nbacv && git checkout -q b7b115c7ace11348512c0ebfb679b48cad35f1fb
          mkdir -p /tmp/nbacv/models
          gdown -q 1uRln22tlhneVt3P6MePmVxBWSLMsL3bm -O /tmp/nbacv/models/parseq_soccernet.ckpt
          gdown -q 18HAuZbge3z8TSfRiX_FzsnKgiBs-RRNw -O /tmp/nbacv/models/legibility_soccernet.pth
      - name: Read jerseys and map to exact lineups
        run: |
          cd /tmp/nbacv
          python "$GITHUB_WORKSPACE/tools/adams_screen_parseq_identity.py" \
            --candidates "$GITHUB_WORKSPACE/artifacts/bundle/identity_plan/adams_okc_identity_candidates.csv" \
            --crop-root "$GITHUB_WORKSPACE/artifacts/all_crops/crops" \
            --roster "$GITHUB_WORKSPACE/data/rosters/0022500001.json" \
            --nbacv-src /tmp/nbacv/src \
            --out "$GITHUB_WORKSPACE/artifacts/identity"
      - uses: actions/upload-artifact@v4
        with:
          name: adams-okc-screen-identity
          path: |
            artifacts/identity
            artifacts/bundle/identity_plan/adams_okc_identity_candidates.csv
            artifacts/all_crops/contacts
            artifacts/all_crops/evidence
            artifacts/all_crops/crop_metadata.csv
          if-no-files-found: warn

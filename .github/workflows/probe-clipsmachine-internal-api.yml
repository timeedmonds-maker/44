name: Probe Clips Machine Internal API
on:
  push:
    branches: [agent/adams-westbrook-old-video-probe]
    paths:
      - 'probe_clipsmachine_internal_api.py'
      - '.github/workflows/probe-clipsmachine-internal-api.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 probe_clipsmachine_internal_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipsmachine-internal-api-${{ github.run_id }}
          path: clipsmachine_internal_api_probe.json
          retention-days: 2

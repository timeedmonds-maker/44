name: Adams Jazz Broadcast conditioning v85

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/diagnose_broadcast_homography_conditioning_v85.py'
      - '.github/workflows/adams-jazz-broadcast-conditioning-v85.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic geometry runtime
        run: python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable synchronized Frame C chooser
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692
      - name: Verify exact Broadcast Frame C
        run: |
          test -f frame_c/A_Broadcast_9.194613s_frame0276.png
          echo '7cd80d1c24c9eefa025e50a55a7cf6cdc3d64ea1ac168ff66bb7aadb307d5b3c  frame_c/A_Broadcast_9.194613s_frame0276.png' | sha256sum -c -
      - name: Run v85 conditioning diagnostic
        run: |
          python -m freeze_spin.diagnose_broadcast_homography_conditioning_v85 \
            --frame frame_c/A_Broadcast_9.194613s_frame0276.png \
            --observations freeze_spin/adams_jazz_frame_c_broadcast_floor_v82.json \
            --out broadcast_v85
      - name: Summarize machine-readable diagnosis
        run: |
          python - <<'PY'
          import json
          p=json.load(open('broadcast_v85/broadcast_homography_conditioning_v85.json'))
          q=p['single_observation_leave_one_out']
          r=p['half_pixel_perturbation_64']
          print('STATUS',p['status'])
          print('NOMINAL_HELDOUT',p['nominal']['max_heldout_feature_p95_px'])
          print('SIMULTANEOUS_REDUCTION',p['exact_v44_simultaneous_last_point_reduction']['max_curve_p95_shift_px'])
          print('LOO_MAX',q['max_curve_p95_shift_px'],'COUNT_OVER_2',q['count_over_2px'])
          print('WORST_LOO',q['worst_10'][0]['feature'],q['worst_10'][0]['original_observation_index'],q['worst_10'][0]['removed_pixel'])
          print('PERTURB_MAX',r['max_curve_p95_shift_px'],'COUNT_OVER_2',r['count_over_2px'])
          print('WORST_PERTURB',r['worst_10'][0]['trial'],r['worst_10'][0]['worst_feature'])
          print('JAC_CONDITION',p['jacobian_conditioning']['condition_number'])
          print('DIAGNOSIS',p['diagnosis'])
          assert all(v is False for v in p['permissions'].values())
          PY
      - name: Package v85 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp broadcast_v85/*.json delivery/ 2>/dev/null || true
          cp freeze_spin/adams_jazz_frame_c_broadcast_floor_v82.json delivery/v82_observations.json
          cp frame_c/A_Broadcast_9.194613s_frame0276.png delivery/
      - name: Upload v85 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-broadcast-conditioning-v85-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

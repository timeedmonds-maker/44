name: Trace NBAPlayDB historical play media
on:
  push:
    branches: ['codex/adams-westbrook-hls-final']
    paths:
      - 'analysis/trace_nbaplaydb_play_media.py'
      - '.github/workflows/trace-nbaplaydb-play-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Trace runtime video resolution
        run: python -u analysis/trace_nbaplaydb_play_media.py

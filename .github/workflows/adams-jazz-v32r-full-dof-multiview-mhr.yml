name: Adams Jazz v32r full-DOF multiview MHR solve

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/run_v32r_full_dof_multiview.py'
      - '.github/workflows/adams-jazz-v32r-full-dof-multiview-mhr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-dof-multiview-mhr:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install observation and MHR runtime
        run: |
          set -euxo pipefail
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1' 'pymomentum-core>=0.1.111' 'git+https://github.com/facebookresearch/MHR.git'
      - name: Download exact B32 source package
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507
          path: inputs_b32
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 34669584507
      - name: Run v32r full-DOF solve
        shell: bash
        run: |
          set +e
          mkdir -p v32r work_v32r
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v32r_full_dof_multiview \
            --b32-root inputs_b32 --work work_v32r --out v32r --max-nfev 320 2>&1 | tee v32r/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v32r/solver_exit_code.txt
          exit 0
      - name: Print v32r diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v32r/v32q_qa.json')
          if not p.exists(): print('NO_QA_JSON'); raise SystemExit(0)
          q=json.load(open(p))
          keys=['status','observed_joints','active_model_parameter_count','multistart_trials','optimizer','per_camera_reprojection','left_best_validation','gate']
          print(json.dumps({k:q[k] for k in keys},indent=2))
          PY
      - name: Package evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v32r/* delivery/ 2>/dev/null || true
          rm -f delivery/*.zip
          test -n "$(find delivery -maxdepth 1 -type f -print -quit)"
          (cd delivery && zip -0 adams_jazz_v32r_full_dof_multiview_mhr.zip ./*)
      - name: Upload v32r evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v32r-full-dof-multiview-mhr-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce fail-closed v32r gate
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v32r/solver_exit_code.txt 2>/dev/null || echo 99)" = "0"

name: Adams Jazz Frame C Right Above Rim lane v48

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/adams_jazz_frame_c_right_above_rim_lane_v48.json'
      - 'freeze_spin/prove_right_above_rim_lane_camera_v48.py'
      - '.github/workflows/adams-jazz-frame-c-right-above-rim-v48.yml'

permissions:
  contents: read
  actions: read

jobs:
  prove-right-above-rim-lane-v48:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable Frame C
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c_archive
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692
      - name: Verify immutable Right Above Rim source
        run: |
          test -f frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png
          echo '0740ccde03fd7839ae92a0dd617312472559ceedafe94b5825fe8ad512d96a4a  frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('frame_c_archive/options.json').read_text())
          rows = p if isinstance(p, list) else p.get('options', p.get('cameras', []))
          m = [r for r in rows if str(r.get('camera', r.get('label', r.get('camera_label', '')))) == 'Right Above Rim']
          assert len(m) == 1, m
          r = m[0]
          assert r['file'] == 'L_Right_Above_Rim_8.562013s_frame0257.png'
          assert int(r['decoded_frame_index']) == 257
          assert abs(float(r['requested_local_time']) - 8.562013) < 1e-6
          spec = json.loads(Path('freeze_spin/adams_jazz_frame_c_right_above_rim_lane_v48.json').read_text())
          assert spec['reference_file'] == r['file']
          assert int(spec['decoded_frame_index']) == 257
          assert spec['lane_observation_derivation']['player_ball_pixels_used'] is False
          PY
      - name: Run lane-constrained functional proof
        id: proof
        continue-on-error: true
        run: |
          python -m freeze_spin.prove_right_above_rim_lane_camera_v48 \
            --observations freeze_spin/adams_jazz_frame_c_right_above_rim_lane_v48.json \
            --image frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png \
            --registry freeze_spin/adams_jazz_game_camera_registry_v3.json \
            --out v48
      - name: Package v48 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v48/*.json delivery/ 2>/dev/null || true
          cp v48/*.png delivery/ 2>/dev/null || true
          cp frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png delivery/ 2>/dev/null || true
          cp freeze_spin/adams_jazz_frame_c_right_above_rim_lane_v48.json delivery/ 2>/dev/null || true
          cp freeze_spin/adams_jazz_game_camera_registry_v3.json delivery/ 2>/dev/null || true
      - name: Upload v48 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-frame-c-right-above-rim-lane-v48-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce v48 verdict
        if: always()
        run: |
          test -f v48/right_above_rim_lane_camera_v48.json
          python - <<'PY'
          import json
          q = json.load(open('v48/right_above_rim_lane_camera_v48.json'))
          print(json.dumps(q, indent=2))
          assert q['status'] == 'PASS_RIGHT_ABOVE_RIM_LANE_CAMERA_V48'
          assert all(q['gates'].values())
          assert q['permissions']['right_above_rim_metric_event_camera_allowed'] is True
          assert q['permissions']['two_distinct_physical_cameras_validated'] is True
          assert q['permissions']['static_novel_view_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          PY

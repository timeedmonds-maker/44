name: Adams Jazz v33h2 occlusion-aware ball QA

on:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - '.github/workflows/adams-jazz-v33h2-occlusion-ball-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  occlusion-ball-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic observation runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip gh
          python -m pip install --quiet numpy scipy opencv-python-headless pillow 'rfdetr>=1.8.1'
          python -m pip install --quiet git+https://github.com/microsoft/MoGe.git
      - name: Reacquire native event-489 camera clips
        run: |
          set -euxo pipefail
          FFMPEG_BINARY="$(command -v ffmpeg)" python build_kd_top10_all_angles.py --request freeze_spin/adams_jazz_dunk_request.json --out target_source --workers 8
          test -n "$(find target_source/clips -type f -name '*_489_Left_Above_Rim_SOURCE.mp4' -print -quit)"
          test -n "$(find target_source/clips -type f -name '*_489_Right_Above_Rim_SOURCE.mp4' -print -quit)"
          test -n "$(find target_source/clips -type f -name '*_489_Broadcast_SOURCE.mp4' -print -quit)"
      - name: Download locked calibration and v33e evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          mkdir -p inputs_b32 inputs_v73 inputs_v33e
          gh run download 34669584507 --repo timeedmonds-maker/44 --name adams-jazz-v32-sharp-latent-quality-cluster-4dgs-34669584507 --dir inputs_b32
          gh run download 33911842169 --repo timeedmonds-maker/44 --name adams-jazz-right-above-rim-metric-camera-v73-33911842169 --dir inputs_v73
          gh run download 34727285810 --repo timeedmonds-maker/44 --name adams-jazz-v33e-wide-locked-three-camera-34727285810 --dir inputs_v33e
      - name: Run v33h2 occlusion-aware source ball QA
        shell: bash
        run: |
          set +e
          mkdir -p v33h2
          /usr/bin/time -v python -u -X faulthandler -m freeze_spin.run_v33h2_occlusion_aware_single_view_ball_qa \
            --clips-dir target_source/clips --b32-root inputs_b32 \
            --v73-frame0257 inputs_v73/L_Right_Above_Rim_8.562013s_frame0257.png \
            --v33e-json inputs_v33e/v33e_locked_three_camera_wide_flow_state_search.json --out v33h2 2>&1 | tee v33h2/run.log
          rc=${PIPESTATUS[0]}; echo "$rc" > v33h2/solver_exit_code.txt; exit 0
      - name: Print decisive result
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v33h2/v33h2_ball_qa.json')
          if p.exists():
              q=json.load(open(p)); print(json.dumps({k:q.get(k) for k in ['status','exact_state','ball','view_evidence','gate']},indent=2))
          else: print('v33h2 JSON missing')
          PY
      - name: Package evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p delivery
          cp v33h2/run.log delivery/ 2>/dev/null || true
          cp v33h2/solver_exit_code.txt delivery/ 2>/dev/null || true
          cp v33h2/v33h2_ball_qa.json delivery/ 2>/dev/null || true
          cp v33h2/v33h2_*_ball_qa.png delivery/ 2>/dev/null || true
          cp v33h2/v33h2_three_camera_ball_montage.png delivery/ 2>/dev/null || true
          test -s delivery/v33h2_ball_qa.json
          (cd delivery && zip -0 adams_jazz_v33h2_occlusion_ball_qa.zip ./*)
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-v33h2-occlusion-ball-qa-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce fail closed
        if: always()
        run: |
          set -euxo pipefail
          test "$(cat v33h2/solver_exit_code.txt 2>/dev/null || echo 99)" = 0

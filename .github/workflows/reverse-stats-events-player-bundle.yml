name: Reverse NBA Stats Events player bundle
on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - analysis/reverse_stats_events_player_bundle.py
      - .github/workflows/reverse-stats-events-player-bundle.yml
  workflow_dispatch:
jobs:
  reverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - run: python -u analysis/reverse_stats_events_player_bundle.py

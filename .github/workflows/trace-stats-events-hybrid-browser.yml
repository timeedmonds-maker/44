name: Trace Stats Events hybrid browser
on:
  push:
    branches: [codex/adams-westbrook-hls-final]
    paths:
      - analysis/trace_stats_events_hybrid_browser.py
      - .github/workflows/trace-stats-events-hybrid-browser.yml
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi playwright
      - run: playwright install --with-deps chromium
      - run: python -u analysis/trace_stats_events_hybrid_browser.py

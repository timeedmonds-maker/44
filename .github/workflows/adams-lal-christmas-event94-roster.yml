name: Adams LAL Christmas event 94 roster

on:
  push:
    branches:
      - codex/adams-screen-okc-opener
    paths:
      - '.github/workflows/adams-lal-christmas-event94-roster.yml'
  workflow_dispatch:

jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official live boxscore roster
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          GAME='0022500012'
          ids={1629028,1629029,1629060,1631222,203935,1627827,1641708,1642263,201142,203500}
          url=f'https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{GAME}.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.nba.com/'})
          with urllib.request.urlopen(req,timeout=60) as r: j=json.load(r)
          game=j['game']; rows=[]
          for side in ['homeTeam','awayTeam']:
              team=game[side]
              for p in team.get('players',[]):
                  pid=int(p.get('personId') or 0)
                  if pid in ids:
                      rows.append({'player_id':pid,'name':p.get('name'),'name_i':p.get('nameI'),'first_name':p.get('firstName'),'family_name':p.get('familyName'),'jersey_num':str(p.get('jerseyNum') or ''),'team_id':team.get('teamId'),'team_city':team.get('teamCity'),'team_name':team.get('teamName'),'team_tricode':team.get('teamTricode')})
          if len(rows)!=10: raise RuntimeError(f'Expected 10 exact-lineup roster rows, got {len(rows)}: {rows}')
          rows=sorted(rows,key=lambda x:(x['team_tricode'],int(x['jersey_num']) if x['jersey_num'].isdigit() else 999,x['player_id']))
          out=Path('artifacts/christmas_roster');out.mkdir(parents=True,exist_ok=True);(out/'event94_roster.json').write_text(json.dumps(rows,indent=2))
          print('ROSTER='+json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adams-lal-christmas-event94-roster
          path: artifacts/christmas_roster/event94_roster.json
          if-no-files-found: error
          retention-days: 30

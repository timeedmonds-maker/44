name: Multiview MoGe native hole fill v11

on:
  workflow_dispatch:
  push:
    paths:
      - "freeze_spin/infer_moge_all_views_v2.py"
      - "freeze_spin/build_multiview_moge_holefill_v11.py"
      - ".github/workflows/multiview-moge-native-v11.yml"

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native geometry and MoGe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
          python - <<'PY' || python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          import torch, torchvision
          print(torch.__version__, torchvision.__version__)
          PY
          python -m pip install git+https://github.com/microsoft/MoGe.git

      - name: Retrieve official NBA angles
        run: |
          python build_kd_top10_all_angles.py \
            --request freeze_spin/sidy_cissoko_request.json \
            --out source_output \
            --workers 2 \
          || {
            sleep 3
            python build_kd_top10_all_angles.py \
              --request freeze_spin/sidy_cissoko_request.json \
              --out source_output \
              --workers 1
          }

      - name: Synchronize and export exact-state metric inputs
        run: |
          python freeze_spin/estimate_audio_sync_graph.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --clips source_output/clips \
            --out diagnostics/audio_sync_graph.json
          python freeze_spin/export_contact_windows.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --sync diagnostics/audio_sync_graph.json \
            --clips source_output/clips \
            --before 0.50 --after 1.10 \
            --out contact_windows
          python freeze_spin/prepare_kalicalib_inputs.py \
            --windows contact_windows \
            --out impact_images
          python -m freeze_spin.solve_nba_geometry_proof_v3 \
            --landmarks freeze_spin/sidy_basket_landmarks_v3.json \
            --images impact_images \
            --out geometry_proof_v3
          python -m freeze_spin.export_calibrated_cameras_v3 \
            --landmarks freeze_spin/sidy_basket_landmarks_v3.json \
            --out geometry_proof_v3/calibrated_cameras_v3.json
          python freeze_spin/export_locked_exact_state.py \
            --windows contact_windows \
            --state freeze_spin/sidy_exact_state_v1.json \
            --out locked_exact_state

      - name: Triangulate locked basketball
        run: |
          mkdir -p foreground_v1
          python -m freeze_spin.triangulate_locked_ball_v1 \
            --cameras geometry_proof_v3/calibrated_cameras_v3.json \
            --foreground freeze_spin/sidy_foreground_landmarks_v1.json \
            --state freeze_spin/sidy_exact_state_v1.json \
            --anchor-images impact_images \
            --locked-images locked_exact_state \
            --out foreground_v1/ball_triangulation_v1.json

      - name: Segment complete action foreground in four cameras
        run: |
          python freeze_spin/segment_action_bodies_v1.py \
            --locked-images locked_exact_state \
            --ball-report foreground_v1/ball_triangulation_v1.json \
            --max-action-instances 3 \
            --out body_masks

      - name: Infer MoGe geometry for all four exact-state views
        run: |
          python freeze_spin/infer_moge_all_views_v2.py \
            --cameras geometry_proof_v3/calibrated_cameras_v3.json \
            --locked-images locked_exact_state \
            --ball-report foreground_v1/ball_triangulation_v1.json \
            --out moge_all_views \
            --pretrained Ruicheng/moge-2-vits-normal \
            --num-tokens 1400

      - name: Render four-camera real-pixel hole-fill proof at native resolution
        run: |
          python freeze_spin/build_multiview_moge_holefill_v11.py \
            --cameras geometry_proof_v3/calibrated_cameras_v3.json \
            --locked-images locked_exact_state \
            --ball-report foreground_v1/ball_triangulation_v1.json \
            --body-masks body_masks \
            --moge-dir moge_all_views \
            --out multiview_v11 \
            --frames 31 --max-degree 5.0
          ffmpeg -y -framerate 30 -i multiview_v11/motion_%03d.png \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
            multiview_v11/sidy_multiview_0_to_5_to_0_native.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames \
            -show_entries format=duration,size -of json \
            multiview_v11/sidy_multiview_0_to_5_to_0_native.mp4 \
            > multiview_v11/native_video_probe.json

      - name: Package native multiview prototype
        if: always()
        run: |
          mkdir -p delivery
          cp multiview_v11/* delivery/ 2>/dev/null || true
          cp moge_all_views/*_depth_visual.png delivery/ 2>/dev/null || true
          cp moge_all_views/*_aligned_input.png delivery/ 2>/dev/null || true
          cp moge_all_views/moge_all_views_qa_v2.json delivery/ 2>/dev/null || true
          cp body_masks/* delivery/ 2>/dev/null || true
          cp locked_exact_state/locked_exact_state_montage.png delivery/ 2>/dev/null || true
          cp foreground_v1/ball_triangulation_v1.json delivery/ 2>/dev/null || true
          cp geometry_proof_v3/calibrated_cameras_v3.json delivery/ 2>/dev/null || true
          cp diagnostics/audio_sync_graph.json delivery/ 2>/dev/null || true

      - name: Upload native multiview prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidy-multiview-moge-native-v11-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error

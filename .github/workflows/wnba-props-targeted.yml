name: WNBA PropsMadness targeted extraction

on:
  push:
    paths:
      - .github/workflows/wnba-props-targeted.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wnba-potential-assists-2025
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Query confirmed PropsMadness public WNBA routes
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import csv,json,time
          from pathlib import Path
          import requests

          O=Path('outputs/wnba_props_direct')
          O.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36','Accept':'application/json,text/plain,*/*','Origin':'https://propsmadness.com','Referer':'https://propsmadness.com/wnba'}
          BASE='https://api.propsmadness.com/api'

          r=s.get(BASE+'/offer/wnba/bets/featured',headers=H,timeout=30)
          r.raise_for_status()
          featured=r.json()
          (O/'featured.json').write_text(json.dumps(featured,indent=2),encoding='utf8')

          players={}
          for mo in featured.get('matchOffers',[]):
              match=mo.get('match') or {}
              for off in mo.get('offer') or []:
                  p=off.get('player') or {}
                  pid=p.get('id')
                  if pid is None: continue
                  players[str(pid)]={
                    'id':str(pid),
                    'name':(' '.join(x for x in [p.get('firstName'),p.get('lastName')] if x)).strip(),
                    'teamId':p.get('teamId'),
                    'position':p.get('position'),
                    'offerType':off.get('offerType'),
                    'matchId':off.get('matchId') or match.get('id'),
                    'seasonId':match.get('seasonId')
                  }
          print('FEATURED PLAYERS',len(players))
          print(list(players.values()))
          (O/'players.json').write_text(json.dumps(players,indent=2),encoding='utf8')

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)

          attempts=[]; good=[]
          season_refs=['2025','12']
          for pid,p in players.items():
              urls=[('current',f'{BASE}/players/{pid}/match-statistics')]
              urls += [(ref,f'{BASE}/players/{pid}/match-statistics?seasonReference={ref}') for ref in season_refs]
              for ref,u in urls:
                  try:
                      rr=s.get(u,headers=H,timeout=20)
                      rec={'playerId':pid,'playerName':p['name'],'offerType':p['offerType'],'ref':ref,'url':u,'status':rr.status_code,'bytes':len(rr.content),'prefix':rr.text[:250]}
                      attempts.append(rec)
                      print(pid,p['name'],p['offerType'],ref,rr.status_code,len(rr.content))
                      if rr.status_code==200 and rr.text.strip().startswith(('{','[')):
                          try:j=rr.json()
                          except: continue
                          txt=rr.text
                          hasPA=any(k in txt for k in ['potentialAssists','POTENTIAL_AST','potential_assists'])
                          rec['hasPA']=hasPA
                          if ref!='current' and hasPA:
                              good.append({'player':p,'playerId':pid,'ref':ref,'payload':j})
                              (O/f'history_{pid}_{ref}.json').write_text(json.dumps(j,indent=2),encoding='utf8')
                              break
                  except Exception as e:
                      attempts.append({'playerId':pid,'playerName':p['name'],'ref':ref,'url':u,'error':repr(e)})
              time.sleep(.08)
          (O/'attempts.json').write_text(json.dumps(attempts,indent=2),encoding='utf8')
          (O/'history_successes.json').write_text(json.dumps(good,indent=2),encoding='utf8')

          rows=[]
          for g in good:
              pid=g['playerId']; pname=g['player']['name']
              for d in walk(g['payload']):
                  pa=d.get('potentialAssists',d.get('POTENTIAL_AST',d.get('potential_assists')))
                  if pa is None: continue
                  mid=d.get('matchId') or d.get('gameId') or d.get('id') or ''
                  date=d.get('date') or d.get('matchDate') or d.get('gameDate') or d.get('startDate') or d.get('startDateTimestamp') or ''
                  opp=d.get('opponent') or d.get('opponentAbbreviation') or d.get('opponentName') or ''
                  if isinstance(opp,dict): opp=opp.get('nameAbbreviation') or opp.get('abbreviation') or opp.get('name') or opp.get('id') or ''
                  # retain useful accompanying fields when present
                  rows.append({'playerId':pid,'playerName':pname,'matchId':mid,'date':date,'opponent':opp,'potentialAssists':pa,'assists':d.get('assists',d.get('AST')),'passesMade':d.get('passesMade',d.get('PASSES_MADE')),'minutes':d.get('minutesPlayed',d.get('MIN'))})
          # Deduplicate nested repeats by player/match/date/PA
          clean=[]; seen=set()
          for x in rows:
              key=(x['playerId'],str(x['matchId']),str(x['date']),str(x['potentialAssists']))
              if key in seen: continue
              seen.add(key); clean.append(x)
          fields=['playerId','playerName','matchId','date','opponent','potentialAssists','assists','passesMade','minutes']
          with (O/'wnba_2025_potential_assists_gamelogs.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(clean)

          agg={}
          for x in clean:
              try: pa=float(x['potentialAssists'])
              except: continue
              a=agg.setdefault(x['playerId'],{'playerId':x['playerId'],'playerName':x['playerName'],'games':0,'potentialAssistsTotal':0.0})
              a['games']+=1;a['potentialAssistsTotal']+=pa
          for a in agg.values():
              a['potentialAssistsPerGame']=round(a['potentialAssistsTotal']/a['games'],3)
          board=sorted(agg.values(),key=lambda x:x['potentialAssistsPerGame'],reverse=True)
          af=['playerId','playerName','games','potentialAssistsTotal','potentialAssistsPerGame']
          with (O/'wnba_2025_potential_assists_by_player.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=af);w.writeheader();w.writerows(board)
          summary={'featuredPlayers':len(players),'attempts':len(attempts),'historicalPlayersWithPA':len(good),'gameRows':len(clean),'leaderboardPlayers':len(board)}
          (O/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf8')
          print('SUMMARY',summary)
          print('LEADERS',board[:20])
          PY
          python /tmp/extract.py
      - name: Commit isolated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/wnba_props_direct
          git diff --staged --quiet || git commit -m "Recover WNBA 2025 potential assists from public PropsMadness history [skip ci]"
          git push origin HEAD:agent/wnba-potential-assists-2025

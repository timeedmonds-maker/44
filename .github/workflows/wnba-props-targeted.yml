name: WNBA PropsMadness targeted extraction

on:
  push:
    paths:
      - .github/workflows/wnba-props-targeted.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wnba-potential-assists-2025
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe league-wide WNBA Explore data
        shell: bash
        run: |
          cat >/tmp/explore.py <<'PY'
          import csv,json
          from pathlib import Path
          import requests
          O=Path('outputs/wnba_props_explore'); O.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); H={'User-Agent':'Mozilla/5.0 Chrome/122 Safari/537.36','Accept':'application/json,text/plain,*/*','Origin':'https://propsmadness.com','Referer':'https://propsmadness.com/wnba'}
          B='https://api.propsmadness.com/api'
          markets=['player-assists','player-rebounds-assists','player-points-rebounds-assists','featured']
          attempts=[]; payloads=[]
          for m in markets:
              for path in [f'/offer/wnba/explore/{m}',f'/offer/wnba/explore/{m}?seasonReference=previous']:
                  try:
                      r=s.get(B+path,headers=H,timeout=30)
                      rec={'market':m,'path':path,'status':r.status_code,'bytes':len(r.content),'prefix':r.text[:220]};attempts.append(rec)
                      print(path,r.status_code,len(r.content))
                      if r.status_code==200 and r.text.strip().startswith(('{','[')):
                          j=r.json();payloads.append((m,path,j));
                          safe=m+'_'+('previous' if 'previous' in path else 'default')
                          (O/f'{safe}.json').write_text(json.dumps(j,indent=2),encoding='utf8')
                  except Exception as e:attempts.append({'market':m,'path':path,'error':repr(e)})
          (O/'attempts.json').write_text(json.dumps(attempts,indent=2),encoding='utf8')
          def walk(x,path=''):
              if isinstance(x,dict):
                  yield path,x
                  for k,v in x.items():yield from walk(v,path+'/'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x):yield from walk(v,path+'/'+str(i))
          hits=[]
          for m,p,j in payloads:
              for path,d in walk(j):
                  if not isinstance(d,dict):continue
                  for key in ['potentialAssists','POTENTIAL_AST','potential_assists']:
                      if key in d:
                          hits.append({'market':m,'requestPath':p,'jsonPath':path,'key':key,'value':d.get(key),'object':d})
                          break
          (O/'potential_assist_hits.json').write_text(json.dumps(hits,indent=2),encoding='utf8')
          nonnull=[h for h in hits if h['value'] is not None]
          (O/'summary.json').write_text(json.dumps({'successfulPayloads':len(payloads),'potentialAssistObjects':len(hits),'nonNullPotentialAssistObjects':len(nonnull),'sampleNonNull':nonnull[:25]},indent=2),encoding='utf8')
          print('PA HITS',len(hits),'NONNULL',len(nonnull))
          if nonnull: print(json.dumps(nonnull[:10]))
          PY
          python /tmp/explore.py
      - name: Commit isolated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/wnba_props_explore
          git diff --staged --quiet || git commit -m "Probe WNBA Explore potential assists payload [skip ci]"
          git push origin HEAD:agent/wnba-potential-assists-2025

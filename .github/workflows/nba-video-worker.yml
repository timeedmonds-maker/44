name: NBA Video Worker

on:
  push:
    paths:
      - 'worker_requests/*.json'
  workflow_dispatch:
    inputs:
      game_id:
        description: 'NBA game ID, e.g. 0022500679'
        required: true
        type: string
      event_id:
        description: 'NBA event number, e.g. 102'
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve request and fetch worker
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker_runtime
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --retry 2 --retry-delay 1 -fsSL "$RAW_BASE/nba_video_worker.py" -o .worker_runtime/nba_video_worker.py

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cat > .worker_runtime/request.json <<'JSON'
          {
            "expected_count": 1,
            "events": [
              {
                "rank": 1,
                "game_id": "${{ inputs.game_id }}",
                "event_id": "${{ inputs.event_id }}"
              }
            ]
          }
          JSON
          else
            REQUEST_PATH=$(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          head = event.get('head_commit') or {}
          candidates = [
              p for p in (head.get('added', []) + head.get('modified', []))
              if p.startswith('worker_requests/') and p.endswith('.json')
          ]
          if not candidates:
              raise SystemExit('No changed worker request JSON found in push event')
          print(candidates[-1])
          PY
          )
            curl --retry 2 --retry-delay 1 -fsSL "$RAW_BASE/$REQUEST_PATH" -o .worker_runtime/request.json
          fi

          echo "request_file=.worker_runtime/request.json" >> "$GITHUB_OUTPUT"
          echo "Using request:"
          cat .worker_runtime/request.json

      - name: Prepare lightweight FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .worker_runtime/bin .worker_runtime/vendor
          START=$(date +%s%3N)

          if python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir \
            --target .worker_runtime/vendor imageio-ffmpeg==0.6.0; then
            FFMPEG_EXE=$(PYTHONPATH=.worker_runtime/vendor python3 - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
            ln -sf "$FFMPEG_EXE" .worker_runtime/bin/ffmpeg
          else
            echo "Bundled FFmpeg install failed; falling back to apt." >&2
            if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
            fi
            ln -sf "$(command -v ffmpeg)" .worker_runtime/bin/ffmpeg
          fi

          echo "$PWD/.worker_runtime/bin" >> "$GITHUB_PATH"
          END=$(date +%s%3N)
          echo "FFMPEG_SETUP_MS=$((END-START))"
          .worker_runtime/bin/ffmpeg -version | head -n 1

      - name: Fetch and QA native NBA source video
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          FFMPEG_BINARY="$PWD/.worker_runtime/bin/ffmpeg" \
            python3 .worker_runtime/nba_video_worker.py \
              --request "${{ steps.request.outputs.request_file }}" \
              --out output
          END=$(date +%s%3N)
          echo "VIDEO_WORKER_MS=$((END-START))"

      - name: Upload validated source video
        uses: actions/upload-artifact@v4
        with:
          name: nba-source-video-${{ github.run_id }}
          path: |
            output/clips/*.mp4
            output/reel_SOURCE.mp4
            output/qa.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

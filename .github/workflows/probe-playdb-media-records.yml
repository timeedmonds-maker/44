name: Probe PlayDB Media Records
on:
  push:
    branches: [agent/adams-westbrook-old-video-probe]
    paths:
      - 'probe_playdb_media_records.py'
      - '.github/workflows/probe-playdb-media-records.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 probe_playdb_media_records.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playdb-media-records-${{ github.run_id }}
          path: playdb_media_records.json
          retention-days: 1

name: Adams Jazz Right Slash pair graph v102

on:
  workflow_dispatch:
  push:
    branches: [right-slash-v100b-run]
    paths:
      - 'freeze_spin/diagnose_right_slash_pair_graph_v102.py'
      - '.github/workflows/adams-jazz-right-slash-pair-graph-v102.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose-pair-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable v100b geometry bank
        uses: actions/download-artifact@v4
        with:
          name: right-slash-distributed-geometry-v100b-33980277033
          path: bank
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33980277033
      - name: Verify immutable discovery bank
        run: |
          python - <<'PY'
          import json
          q=json.load(open('bank/distributed_same_game_geometry_bank_v100.json'))
          assert q['status']=='DISCOVERY_ONLY_NO_PROMOTION'
          assert q['game_id']=='0022500301'
          assert q['camera_label']=='Right Slash'
          assert int(q['successful_clip_count'])==18
          assert all(v is False for v in q['permissions'].values())
          PY
      - name: Run mutual pair graph and intrinsics diagnostic
        run: python -m freeze_spin.diagnose_right_slash_pair_graph_v102 --bank bank --out v102
      - name: Enforce no premature promotion
        run: |
          python - <<'PY'
          import json
          q=json.load(open('v102/right_slash_pair_graph_v102.json'))
          assert q['metric_event_camera_allowed'] is False
          assert q['replay_render_allowed'] is False
          print('STATUS',q['status'])
          print('SELECTED_HUB',q['selected_hub'])
          print('EVENTS',q['independent_passing_event_count'])
          print('PP',q.get('shared_principal_point_px'))
          print('MAX_LOO',q.get('max_leave_one_event_out_pp_shift_px'))
          print('RADIAL',q.get('coherent_radial_distortion_pattern_detected'))
          print('HUB_COUNTS',[(h['hub_event'],h['independent_passing_event_count']) for h in q['hubs']])
          PY
      - name: Package v102 evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v102/*.json delivery/ 2>/dev/null || true
          cp bank/distributed_same_game_geometry_bank_v100.json delivery/v100b_source_manifest.json
      - name: Upload v102 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-right-slash-pair-graph-v102-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

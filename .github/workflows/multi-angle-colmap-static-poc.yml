name: Multi-angle joint SfM temporal-bridge POC

on:
  workflow_dispatch:
  push:
    paths:
      - "freeze_spin/analyze_colmap_multiframe_gate.py"
      - "freeze_spin/select_colmap_crossfeed_init.py"
      - "freeze_spin/prepare_colmap_multiframe_inputs.py"
      - ".github/workflows/multi-angle-colmap-static-poc.yml"

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime and COLMAP
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg colmap
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
          colmap -h | head -40

      - name: Retrieve all validated native NBA angles
        run: |
          python build_kd_top10_all_angles.py \
            --request freeze_spin/sidy_cissoko_request.json \
            --out source_output \
            --workers 8

      - name: Synchronize angles and build true temporal bridge
        run: |
          python freeze_spin/estimate_audio_sync_graph.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --clips source_output/clips \
            --out diagnostics/audio_sync_graph.json
          python freeze_spin/export_contact_windows.py \
            --config freeze_spin/sidy_cissoko_sync_map.json \
            --sync diagnostics/audio_sync_graph.json \
            --clips source_output/clips \
            --before 0.50 --after 1.10 \
            --out contact_windows
          python freeze_spin/prepare_colmap_multiframe_inputs.py \
            --windows contact_windows \
            --out temporal_images
          python freeze_spin/prepare_kalicalib_inputs.py \
            --windows contact_windows \
            --out impact_images
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('temporal_images/mapping.json').read_text())
          assert p['view_count'] == 12, p
          assert p['images_per_view'] == 5, p
          assert p['image_count'] == 60, p
          print('Verified temporal bridge:', p['view_count'], 'feeds x', p['images_per_view'], 'frames =', p['image_count'])
          PY

      - name: Extract SIFT with one intrinsic model per physical feed
        run: |
          mkdir -p sfm
          colmap feature_extractor \
            --database_path sfm/database.db \
            --image_path temporal_images \
            --ImageReader.camera_model SIMPLE_RADIAL \
            --ImageReader.single_camera 0 \
            --ImageReader.single_camera_per_folder 1 \
            --ImageReader.default_focal_length_factor 1.2 \
            --SiftExtraction.use_gpu 0 \
            --SiftExtraction.max_num_features 16000
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('sfm/database.db')
          n_images=con.execute('select count(*) from images').fetchone()[0]
          n_cameras=con.execute('select count(*) from cameras').fetchone()[0]
          print('COLMAP database:', n_images, 'images,', n_cameras, 'camera intrinsic groups')
          assert n_images == 60, n_images
          assert n_cameras == 12, n_cameras
          PY

      - name: Exhaustively verify cross-feed feature geometry
        run: |
          colmap exhaustive_matcher \
            --database_path sfm/database.db \
            --SiftMatching.use_gpu 0 \
            --SiftMatching.max_num_matches 32768

      - name: Rank distinct non-planar cross-feed initialization pairs
        run: |
          mkdir -p diagnostics
          python freeze_spin/select_colmap_crossfeed_init.py \
            --database sfm/database.db \
            --mapping temporal_images/mapping.json \
            --out diagnostics/crossfeed_init.json > diagnostics/selected_pair.txt
          cat diagnostics/crossfeed_init.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('diagnostics/crossfeed_init.json').read_text())
          with Path('diagnostics/init_candidates.tsv').open('w', encoding='utf-8') as f:
              for i,c in enumerate(p['top_nonplanar_feed_pairs'][:8],1):
                  f.write(f"{i}\t{c['image_id1']}\t{c['image_id2']}\t{c['label1']}\t{c['label2']}\t{c['verified_inliers']}\t{c['config_name']}\n")
          print(Path('diagnostics/init_candidates.tsv').read_text())
          PY

      - name: Try multiple genuine cross-feed SfM seeds
        run: |
          mkdir -p sfm/sparse sfm/attempts diagnostics/mapper_attempts
          success=0
          while IFS=$'\t' read -r idx init1 init2 label1 label2 inliers config_name; do
            echo "=== attempt $idx: $label1 <-> $label2 | inliers=$inliers | config=$config_name | ids=$init1,$init2 ==="
            out="sfm/attempts/a${idx}"
            mkdir -p "$out"
            set +e
            colmap mapper \
              --database_path sfm/database.db \
              --image_path temporal_images \
              --output_path "$out" \
              --Mapper.min_num_matches 10 \
              --Mapper.init_image_id1 "$init1" \
              --Mapper.init_image_id2 "$init2" \
              --Mapper.init_min_num_inliers 12 \
              --Mapper.abs_pose_min_num_inliers 10 \
              --Mapper.ba_refine_focal_length 1 \
              --Mapper.ba_refine_principal_point 0 \
              --Mapper.ba_refine_extra_params 1 \
              > "diagnostics/mapper_attempts/a${idx}.log" 2>&1
            rc=$?
            set -e
            model_dir=$(find "$out" -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            if [ "$rc" -eq 0 ] && [ -n "$model_dir" ] && [ -f "$model_dir/cameras.bin" ] && [ -f "$model_dir/images.bin" ]; then
              echo "SUCCESS attempt $idx: $label1 <-> $label2" | tee diagnostics/chosen_mapper_seed.txt
              echo "ids=$init1,$init2 inliers=$inliers config=$config_name" >> diagnostics/chosen_mapper_seed.txt
              cp -a "$out"/* sfm/sparse/
              success=1
              break
            fi
            echo "FAILED attempt $idx rc=$rc"
            tail -25 "diagnostics/mapper_attempts/a${idx}.log" || true
          done < diagnostics/init_candidates.tsv
          if [ "$success" -ne 1 ]; then
            echo "No distinct non-planar cross-feed seed initialized a joint model." | tee diagnostics/chosen_mapper_seed.txt
            exit 1
          fi
          find sfm/sparse -maxdepth 2 -type f -print

      - name: Convert every recovered model to text
        run: |
          mkdir -p sfm/models_txt
          shopt -s nullglob
          for d in sfm/sparse/*; do
            [ -d "$d" ] || continue
            b=$(basename "$d")
            mkdir -p "sfm/models_txt/$b"
            colmap model_converter \
              --input_path "$d" \
              --output_path "sfm/models_txt/$b" \
              --output_type TXT
          done
          find sfm/models_txt -maxdepth 2 -type f -print

      - name: Enforce physical-camera 3D quality gate
        run: |
          python freeze_spin/analyze_colmap_multiframe_gate.py \
            --models sfm/models_txt \
            --mapping temporal_images/mapping.json \
            --out sfm_qa

      - name: Package diagnostics whether pass or fail
        if: always()
        run: |
          mkdir -p delivery
          cp diagnostics/audio_sync_graph.json delivery/ || true
          cp diagnostics/crossfeed_init.json delivery/ || true
          cp diagnostics/init_candidates.tsv delivery/ || true
          cp diagnostics/chosen_mapper_seed.txt delivery/ || true
          cp diagnostics/mapper_attempts/*.log delivery/ 2>/dev/null || true
          cp temporal_images/mapping.json delivery/temporal_mapping.json || true
          cp impact_images/mapping.json delivery/impact_mapping.json || true
          cp impact_images/[0-9]*.png delivery/ 2>/dev/null || true
          cp sfm_qa/* delivery/ 2>/dev/null || true
          cp sfm/models_txt/*/*.txt delivery/ 2>/dev/null || true

      - name: Upload temporal-bridge joint SfM experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidy-cissoko-temporal-joint-sfm-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error

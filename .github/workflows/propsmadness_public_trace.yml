name: PropsMadness public trace

on:
  push:
    branches: [agent/wnba-potential-assists-probe]
    paths: [.github/workflows/propsmadness_public_trace.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wnba-potential-assists-probe
      - name: Search archived public browser scans
        run: |
          mkdir -p outputs/wnba_potential_assists
          python - <<'PY'
          import json, urllib.parse, urllib.request, re, time
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 research'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          q=urllib.parse.quote('domain:propsmadness.com')
          s=get(f'https://urlscan.io/api/v1/search/?q={q}&size=25')
          out={'search_total':s.get('total'),'scans':[],'api_urls':[]}
          api=set()
          for row in s.get('results',[]):
              uuid=row.get('_id') or (row.get('task') or {}).get('uuid')
              if not uuid: continue
              rec={'uuid':uuid,'task_url':(row.get('task') or {}).get('url')}
              try:
                  j=get(f'https://urlscan.io/api/v1/result/{uuid}/')
                  urls=[]
                  for entry in (j.get('data') or {}).get('requests',[]):
                      req=(entry.get('request') or {}).get('request') or {}
                      u=req.get('url') or ''
                      if 'propsmadness' in u.lower(): urls.append(u)
                      if 'api.propsmadness.com' in u.lower(): api.add(u)
                  rec['propsmadness_urls']=urls
              except Exception as e:
                  rec['error']=repr(e)
              out['scans'].append(rec)
              time.sleep(.15)
          out['api_urls']=sorted(api)
          open('outputs/wnba_potential_assists/propsmadness_public_trace.json','w').write(json.dumps(out,indent=2))
          print('SCANS',len(out['scans']),'API_URLS',len(api))
          for u in sorted(api): print(u)
          PY
      - name: Commit trace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/wnba_potential_assists/propsmadness_public_trace.json
          git commit -m 'Add public PropsMadness API trace' || exit 0
          git push origin HEAD:agent/wnba-potential-assists-probe

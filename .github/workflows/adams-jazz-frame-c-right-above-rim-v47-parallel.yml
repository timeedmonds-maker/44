name: Adams Jazz Frame C Right Above Rim functional v47 parallel

on:
  workflow_dispatch:
  push:
    branches: [codex/multi-angle-freeze-spin-poc]
    paths:
      - 'freeze_spin/prove_right_above_rim_functional_camera_v47_parallel.py'
      - '.github/workflows/adams-jazz-frame-c-right-above-rim-v47-parallel.yml'

permissions:
  contents: read
  actions: read

jobs:
  prove-right-above-rim-v47-parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic runtime
        run: |
          python -m pip install --quiet numpy==1.26.4 scipy==1.12.0 opencv-python-headless==4.10.0.84
      - name: Recover immutable Frame C
        uses: actions/download-artifact@v4
        with:
          name: adams-jazz-frame-c-synchronized-camera-chooser-33602700692
          path: frame_c_archive
          github-token: ${{ github.token }}
          repository: timeedmonds-maker/44
          run-id: 33602700692
      - name: Verify immutable source
        run: |
          test -f frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png
          echo '0740ccde03fd7839ae92a0dd617312472559ceedafe94b5825fe8ad512d96a4a  frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png' | sha256sum -c -
      - name: Run parallel functional proof
        id: proof
        continue-on-error: true
        run: |
          python -m freeze_spin.prove_right_above_rim_functional_camera_v47_parallel \
            --observations freeze_spin/adams_jazz_frame_c_right_above_rim_fixed_geometry_v46.json \
            --image frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png \
            --registry freeze_spin/adams_jazz_game_camera_registry_v3.json \
            --out v47p
      - name: Package evidence
        if: always()
        run: |
          mkdir -p delivery
          cp v47p/*.json delivery/ 2>/dev/null || true
          cp v47p/*.png delivery/ 2>/dev/null || true
          cp frame_c_archive/L_Right_Above_Rim_8.562013s_frame0257.png delivery/ 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-jazz-frame-c-right-above-rim-v47-parallel-${{ github.run_id }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Enforce verdict
        if: always()
        run: |
          test -f v47p/right_above_rim_functional_camera_v47.json
          python - <<'PY'
          import json
          q = json.load(open('v47p/right_above_rim_functional_camera_v47.json'))
          print(json.dumps(q, indent=2))
          assert q['execution']['mathematical_gates_identical_to_serial_v47'] is True
          assert q['status'] == 'PASS_RIGHT_ABOVE_RIM_FUNCTIONAL_CAMERA_V47'
          assert all(q['gates'].values())
          assert q['permissions']['two_distinct_physical_cameras_validated'] is True
          assert q['permissions']['static_novel_view_allowed'] is False
          assert q['permissions']['replay_render_allowed'] is False
          PY

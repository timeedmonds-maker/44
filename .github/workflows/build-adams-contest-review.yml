name: Build Adams contest review sheets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-adams-contest-review.yml'
      - 'build_adams_contest_thumbnail_review.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python3 -m pip install --quiet pandas requests pillow
      - name: Build review sheets
        run: python3 build_adams_contest_thumbnail_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: adams-contest-review-sheets
          path: contest_review/
          retention-days: 2
          compression-level: 6
